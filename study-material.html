<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d2b6b" />
<title>Study Material · Quest Coaching Centre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<style>
:root{
  --navy:#0d2b6b;
  --navy-2:#16409b;
  --navy-dark:#081f52;
  --gold:#ffc42e;
  --gold-2:#f7b500;
  --gold-ink:#3a2a00;
  --bg:#f2f5fb;
  --card:#ffffff;
  --text:#0f2452;
  --muted:#5f6f90;
  --border:#e3e9f5;
  --border-strong:#cfdcf5;
  --red:#e0245e;
  --red-bg:#ffe3ea;
  --green:#0e9f6e;
  --green-bg:#e3fcef;
  --radius:14px;
  --shadow:0 2px 10px rgba(13,43,107,.07);
  --shadow-hover:0 10px 26px rgba(13,43,107,.14);
  --header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 14px}

/* HEADER */
.app-header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#0d2b6b 0%,#16409b 100%);
  border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(8,31,82,.20);
}
.header-inner{
  display:flex;align-items:center;gap:10px;
  min-height:var(--header-h);padding:7px 0;position:relative;
}
.back-header-btn{
  width:32px;height:32px;flex:none;border-radius:9px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.26);
  color:#fff;font-size:13px;display:grid;place-items:center;cursor:pointer;
  transition:all .2s;
}
.back-header-btn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.back-header-btn:active{transform:scale(.94);}
.back-header-btn.hidden{display:none;}
.brand{flex:1;min-width:0;text-align:center;}
.brand h1{
  font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.7px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  font-size:11px;color:#c3d2f2;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-tag{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;
  color:var(--gold-ink);
  background:linear-gradient(135deg,#ffd257,#f7b500);
  padding:4px 9px;border-radius:20px;text-transform:uppercase;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
@media(max-width:400px){.header-tag{display:none}}

main{flex:1 0 auto;padding-bottom:26px}
.page-head{padding:15px 0 11px}
.page-head h2{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.2px;}
.page-head h2::after{
  content:"";display:block;width:38px;height:3px;border-radius:2px;
  background:var(--gold);margin-top:7px;
}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:7px}

.section-label{
  font-size:11px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);margin:16px 0 9px;
}
.stack{display:flex;flex-direction:column;gap:10px}

/* MEDIUM SWITCHER */
.medium-switcher{
  display:flex;gap:6px;
  background:#fff;
  border-radius:12px;
  padding:5px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.medium-btn{
  flex:1;
  padding:10px 12px;
  border-radius:9px;
  background:transparent;
  border:none;
  font-size:.85rem;
  font-weight:800;
  color:#64748b;
  cursor:pointer;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.medium-btn:hover{background:#f1f5ff;color:var(--navy);}
.medium-btn.active.hindi{
  background:linear-gradient(135deg,#ff9933,#ff6600);
  color:#fff;
  box-shadow:0 3px 10px rgba(255,102,0,.32);
}
.medium-btn.active.english{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;
  box-shadow:0 3px 10px rgba(13,43,107,.28);
}

/* CONTENT TYPE SWITCHER */
.content-switcher{
  display:flex;gap:5px;
  background:#fff;
  border-radius:12px;
  padding:5px;
  margin-bottom:14px;
  overflow-x:auto;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.content-switcher::-webkit-scrollbar{display:none;}
.content-btn{
  flex:0 0 auto;
  min-width:82px;
  padding:9px 10px;
  border-radius:9px;
  background:transparent;
  border:none;
  font-size:.76rem;
  font-weight:700;
  color:#64748b;
  cursor:pointer;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.content-btn:hover{background:#f1f5ff;color:var(--navy);}
.content-btn.active{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;
  box-shadow:0 3px 10px rgba(13,43,107,.28);
}

/* SEARCH */
.search-box{
  display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:0 12px;
  box-shadow:var(--shadow);transition:border-color .15s, box-shadow .15s;
}
.search-box:focus-within{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(22,64,155,.10)}
.search-box .s-ico{font-size:14px;opacity:.7;flex:none}
.search-box input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  padding:12px 0;font-size:14px;color:var(--text);
}
.search-box input::placeholder{color:#9aa8c4}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none}

/* CARDS */
.card-icon{
  width:44px;height:44px;flex:none;border-radius:12px;
  display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;
}
.class-card,.item-card{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 13px 13px 15px;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  overflow:hidden;min-height:68px;
}
.class-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#ffd257,#f7b500);
}
.class-card .card-icon{
  background:linear-gradient(135deg,#0d2b6b,#1b4bb5);
  border-color:#1b4bb5;box-shadow:0 3px 8px rgba(13,43,107,.25);color:#fff;
}
.class-card:active,.item-card:active{transform:scale(.985)}
@media(hover:hover){
  .class-card:hover,.item-card:hover{
    transform:translateY(-2px);box-shadow:var(--shadow-hover);
    border-color:var(--border-strong);
  }
  .class-card:hover .card-arrow,.item-card:hover .card-arrow{
    background:var(--gold);color:var(--gold-ink);border-color:var(--gold);
  }
}
.card-text{flex:1;min-width:0}
.card-text h3{
  font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-text span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.card-arrow{
  width:30px;height:30px;flex:none;border-radius:50%;
  display:grid;place-items:center;
  background:#f1f5ff;border:1px solid #e4ebfb;color:var(--navy);
  font-size:14px;font-weight:700;
  transition:background .15s,color .15s,border-color .15s;
}

/* CHAPTER ROW */
.chapter-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 12px 14px 14px;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  position:relative;overflow:hidden;cursor:pointer;text-decoration:none;
}
.chapter-row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#ffd257,#f7b500);opacity:0;transition:opacity .2s;
}
.chapter-row:hover{
  transform:translateY(-1px);box-shadow:var(--shadow-hover);
  border-color:var(--border-strong);
}
.chapter-row:hover::before{opacity:1;}
.chapter-row:active{transform:scale(.99);}

.ch-num{
  width:34px;height:34px;flex:none;border-radius:10px;
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;color:var(--navy);
  font-size:11.5px;font-weight:800;letter-spacing:.3px;
  display:grid;place-items:center;
}
.ch-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.ch-name{
  font-size:15px;font-weight:800;color:var(--navy);
  line-height:1.3;letter-spacing:-.1px;word-break:break-word;
}
.ch-meta{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.2px;
}
.ch-meta .badge-new-inline{
  background:var(--red-bg);color:var(--red);
  font-size:9px;font-weight:800;letter-spacing:.5px;
  padding:1.5px 5px;border-radius:4px;
}
.ch-download{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:var(--navy);display:grid;place-items:center;font-size:15px;
  box-shadow:0 3px 8px rgba(247,181,0,.28);
  border:1px solid #f0ad00;transition:all .18s ease;cursor:pointer;
}
.ch-download:hover{
  transform:scale(1.08);box-shadow:0 5px 14px rgba(247,181,0,.45);
  background:linear-gradient(135deg,#ffdf7a,#ffc42e);
}
.ch-download:active{transform:scale(.94);}
.ch-download.locked{
  background:linear-gradient(135deg,#64748b,#475569);
  color:#fff;border-color:#475569;
  box-shadow:0 3px 8px rgba(71,85,105,.28);
}

@media(min-width:600px){
  .chapter-row{padding:16px 16px 16px 18px;gap:14px;}
  .ch-num{width:38px;height:38px;font-size:12.5px;}
  .ch-name{font-size:16.5px;}
  .ch-meta{font-size:12px;}
  .ch-download{width:42px;height:42px;font-size:16px;}
}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:9px 13px;border-radius:10px;border:1px solid transparent;
  font-size:13px;font-weight:700;letter-spacing:.15px;
  white-space:nowrap;cursor:pointer;
  transition:transform .13s ease, box-shadow .15s ease, background .15s ease;
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn-navy{
  background:linear-gradient(135deg,#0d2b6b,#1b4bb5);
  color:#fff;
  box-shadow:0 2px 8px rgba(13,43,107,.28);
}
.btn-gold{
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:var(--gold-ink);
  box-shadow:0 2px 8px rgba(247,181,0,.32);
  border-color:#f0ad00;
}

/* BREADCRUMBS */
.crumbs{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:12px 0 0;font-size:11.5px;color:var(--muted);
}
.crumbs a{color:var(--navy);font-weight:650}
.crumbs a:active{color:var(--navy-2)}
.crumbs .sep{opacity:.45;font-size:12px}
.crumbs .current{
  color:var(--muted);font-weight:600;max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* PDF VIEWER */
.pdfjs-viewer{
  margin-top:12px;display:flex;flex-direction:column;
  gap:14px;padding-bottom:24px;
}
.pdf-page{
  background:#fff;border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
  box-shadow:0 3px 12px rgba(13,43,107,.10);
  position:relative;width:100%;
}
.pdf-page canvas{display:block;width:100%;height:auto;background:#fff;}
.pdf-page-num{
  position:absolute;top:8px;right:10px;
  background:rgba(13,43,107,.82);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.4px;
  padding:3px 9px;border-radius:20px;pointer-events:none;
}
.pdf-loading{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.pdf-loading .spinner-lg{
  width:38px;height:38px;border:3px solid #e3e9f5;
  border-top-color:var(--navy);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.pdf-error{
  background:#ffe3ea;color:#c4114a;
  border:1px solid #ffc9d6;border-radius:12px;
  padding:18px;text-align:center;font-size:13px;
  font-weight:600;margin-top:14px;
}
.pdf-error .btn{margin-top:12px;}

/* EMPTY */
.empty{
  background:var(--card);border:1px dashed var(--border-strong);
  border-radius:var(--radius);padding:22px 16px;text-align:center;
  font-size:13px;color:var(--muted);
}
.empty strong{display:block;color:var(--navy);font-size:14px;margin-bottom:4px;}
.empty .empty-ico{
  font-size:2.8rem;
  color:#cfdcf5;
  margin-bottom:12px;
  display:block;
}
.empty small{
  display:block;margin-top:8px;color:#8a95ae;font-size:11.5px;
}
.empty a{color:var(--navy);font-weight:700;text-decoration:underline;}

.sk{
  border-radius:var(--radius);
  background:linear-gradient(90deg,#eef2f9 25%,#e2e9f6 37%,#eef2f9 63%);
  background-size:400% 100%;
  animation:shimmer 1.25s ease-in-out infinite;
}
.sk-card{height:68px}
.sk-chapter{height:72px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}

/* FOOTER */
.app-footer{
  flex:none;margin-top:auto;background:#fff;border-top:1px solid var(--border);
  padding:18px 14px calc(20px + env(safe-area-inset-bottom));
  text-align:center;
}
.app-footer strong{
  display:block;font-size:12.5px;font-weight:800;
  color:var(--navy);letter-spacing:.7px;
}
.app-footer span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;}
.app-footer small{display:block;font-size:11px;color:#93a1bd;margin-top:8px;}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:22px;z-index:200;
  transform:translate(-50%,90px);
  background:var(--navy-dark);color:#fff;
  padding:11px 17px;border-radius:11px;
  font-size:12.5px;font-weight:650;
  box-shadow:0 10px 28px rgba(8,31,82,.35);
  border-left:3px solid var(--gold);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
  max-width:92vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* POPUP MODAL */
.popup-overlay{
  position:fixed;inset:0;
  background:rgba(8,31,82,.62);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  z-index:9999;
  display:flex;align-items:center;justify-content:center;
  padding:18px;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
.popup-overlay.open{opacity:1;pointer-events:auto;}

.popup-box{
  width:100%;max-width:420px;
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 25px 70px rgba(8,31,82,.42);
  transform:translateY(18px) scale(.96);
  transition:transform .32s cubic-bezier(0.25, 0.8, 0.25, 1);
  max-height:92vh;
  display:flex;flex-direction:column;
}
.popup-overlay.open .popup-box{transform:translateY(0) scale(1);}

.popup-header{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;
  padding:20px 22px;
  position:relative;
  border-bottom:3px solid #ffc42e;
}
.popup-header .popup-icon{
  width:48px;height:48px;
  border-radius:13px;
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:#0d2b6b;
  display:grid;place-items:center;
  font-size:1.35rem;
  margin-bottom:10px;
  box-shadow:0 5px 14px rgba(247,181,0,.4);
}
.popup-header h3{
  font-size:1.1rem;font-weight:800;
  line-height:1.3;
}
.popup-header p{
  font-size:.78rem;color:#c3d2f2;
  margin-top:4px;line-height:1.45;
}
.popup-close-x{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;
  border-radius:9px;
  background:rgba(255,255,255,0.16);
  border:1px solid rgba(255,255,255,0.28);
  color:#fff;font-size:.9rem;
  display:grid;place-items:center;
  cursor:pointer;transition:all .2s;
}
.popup-close-x:hover{
  background:#ffc107;color:#1a237e;
  border-color:#ffc107;
  transform:rotate(90deg);
}
.popup-body{
  padding:22px;
  overflow-y:auto;
  flex:1;
}
.popup-field{margin-bottom:14px;}
.popup-field label{
  display:block;
  font-size:.72rem;font-weight:800;
  letter-spacing:.9px;
  text-transform:uppercase;
  color:#5f6f90;
  margin-bottom:6px;
}
.popup-input-wrap{
  display:flex;align-items:center;
  border:2px solid #e3e9f5;
  border-radius:12px;
  background:#f9fbff;
  transition:all .2s;
}
.popup-input-wrap:focus-within{
  border-color:#16409b;
  background:#fff;
  box-shadow:0 0 0 4px rgba(22,64,155,.10);
}
.popup-input-wrap .pi-ico{
  padding:0 14px;
  font-size:1rem;color:#8a95ae;
  flex-shrink:0;
}
.popup-input-wrap input{
  flex:1;min-width:0;
  padding:14px 14px 14px 0;
  border:none;outline:none;
  background:transparent;
  font-size:.95rem;
  color:#0f2452;
  font-weight:600;
}
.popup-input-wrap input::placeholder{
  color:#9aa8c4;font-weight:500;
}
.popup-actions{
  display:flex;gap:10px;
  margin-top:18px;
}
.popup-btn{
  flex:1;
  min-height:46px;
  border-radius:12px;
  font-size:.92rem;
  font-weight:800;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  gap:8px;
  transition:all .2s;
  border:2px solid transparent;
  padding:10px 16px;
}
.popup-btn:active{transform:scale(.97);}
.popup-btn.primary{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;
  box-shadow:0 6px 16px rgba(13,43,107,.32);
}
.popup-btn.primary:hover{
  box-shadow:0 8px 22px rgba(13,43,107,.42);
  transform:translateY(-1px);
}
.popup-btn.ghost{
  background:#fff;
  border-color:#e3e9f5;
  color:#5f6f90;
  flex:0 0 auto;
  min-width:90px;
}
.popup-btn.ghost:hover{
  background:#f5f8ff;border-color:#cfdcf5;color:#0d2b6b;
}
.popup-status{
  padding:11px 14px;
  border-radius:10px;
  font-size:.82rem;
  font-weight:650;
  margin-top:12px;
  display:none;
  align-items:center;gap:8px;
  line-height:1.4;
}
.popup-status.error{
  background:#ffe3ea;color:#c4114a;
  border:1px solid #ffc9d6;
  display:flex;
}
.popup-status.success{
  background:#e3fcef;color:#0e9f6e;
  border:1px solid #b8f0d4;
  display:flex;
}
.popup-status.loading{
  background:#eef3ff;color:#16409b;
  border:1px solid #dbe6ff;
  display:flex;
}
.popup-status .spinner{
  width:15px;height:15px;
  border:2px solid #16409b;
  border-top-color:transparent;
  border-radius:50%;
  animation:spin .75s linear infinite;
  flex-shrink:0;
}
.popup-hint{
  font-size:.72rem;color:#8a95ae;

<script>
/* ============================================================
   QUEST COACHING — STUDY MATERIAL PORTAL (Student)
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
  authDomain: "quest-coaching.firebaseapp.com",
  databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quest-coaching",
  storageBucket: "quest-coaching.firebasestorage.app",
  messagingSenderId: "131948734089",
  appId: "1:131948734089:web:f4ba25110c8b1298360858"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const SM_COLLECTION = 'study_materials';
const SUB_SUBCOLLECTION = 'subjects';
const CH_SUBCOLLECTION = 'chapters';
const ADMISSIONS_COLLECTION = 'admissions';

const CONTENT_TYPES = ['notes', 'pyqs', 'test_paper', 'objective', 'subjective'];
const CONTENT_LABELS = {
  notes: '📝 Notes',
  pyqs: '📜 PYQs',
  test_paper: '📋 Test Paper',
  objective: '🔘 Objective',
  subjective: '✍️ Subjective'
};
const MEDIUMS = ['hindi', 'english'];

const $  = (sel, root = document) => root.querySelector(sel);
const app = $('#app');

const esc = (str = '') => String(str).replace(/[&<>"']/g, ch => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
));
const pad2 = n => String(n).padStart(2, '0');
const sanitizeFile = (str = 'document') =>
  str.replace(/[^\w\s\u0900-\u097F-]/g, '').trim().replace(/\s+/g, '_').slice(0, 70) || 'document';

let toastTimer;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

const skeletonCards = (n = 3) =>
  Array.from({ length: n }, () => '<div class="sk sk-card"></div>').join('');
const skeletonChapters = (n = 5) =>
  Array.from({ length: n }, () => '<div class="sk sk-chapter"></div>').join('');

/* ============================================================
   STATE
   ============================================================ */
const state = {
  medium: 'hindi',       // default Hindi
  contentType: 'notes',  // default Notes
  // Verified student session (sessionStorage)
  verifiedStudent: null,
  // Pending download request
  pendingDownload: null, // { chapterId, contentType, medium, pdfUrl, fileName }
  _cache: null
};

/* Load verified student from sessionStorage */
try {
  const saved = sessionStorage.getItem('quest_study_verified');
  if (saved) state.verifiedStudent = JSON.parse(saved);
} catch(e){}

/* ============================================================
   DATA SOURCE
   ============================================================ */
const DataSource = {
  async _load() {
    if (state._cache) return state._cache;
    try {
      const classesSnap = await db.collection(SM_COLLECTION).orderBy('display_order').get();

      const classes = [];
      for (const classDoc of classesSnap.docs) {
        const classData = classDoc.data();
        const cls = {
          id: classDoc.id,
          name: classData.name || classDoc.id,
          display_order: classData.display_order || 0,
          subjects: []
        };

        const subjectsSnap = await db.collection(SM_COLLECTION).doc(classDoc.id)
          .collection(SUB_SUBCOLLECTION).orderBy('display_order').get();

        for (const subjectDoc of subjectsSnap.docs) {
          const subjectData = subjectDoc.data();
          const subj = {
            id: subjectDoc.id,
            name: subjectData.name || subjectDoc.id,
            icon: subjectData.icon || '📘',
            display_order: subjectData.display_order || 0,
            chapters: []
          };

          const chaptersSnap = await db.collection(SM_COLLECTION).doc(classDoc.id)
            .collection(SUB_SUBCOLLECTION).doc(subjectDoc.id)
            .collection(CH_SUBCOLLECTION).orderBy('display_order').get();

          chaptersSnap.forEach(chDoc => {
            const chData = chDoc.data();
            if (chData.is_published === false) return;
            subj.chapters.push({ id: chDoc.id, ...chData });
          });

          cls.subjects.push(subj);
        }

        classes.push(cls);
      }

      state._cache = classes;
    } catch (err) {
      console.warn('study_materials fetch failed:', err.message);
      state._cache = [];
    }
    return state._cache;
  },

  async getClasses() {
    const classes = await this._load();
    return [...classes].sort((a,b) => (a.display_order||0) - (b.display_order||0));
  },

  async getClass(id) {
    const list = await this.getClasses();
    return list.find(c => c.id === id) || null;
  },

  async getSubjectsWithCounts(classId) {
    const cls = await this.getClass(classId);
    if (!cls) return [];
    return [...(cls.subjects || [])]
      .sort((a,b) => (a.display_order||0) - (b.display_order||0))
      .map(s => ({
        ...s,
        class_id: cls.id,
        chapter_count: (s.chapters || []).length
      }));
  },

  async getSubject(classId, subjectId) {
    const cls = await this.getClass(classId);
    if (!cls) return null;
    const s = (cls.subjects || []).find(x => x.id === subjectId);
    return s ? { ...s, class_id: cls.id } : null;
  },

  async getChaptersBySubject(classId, subjectId) {
    const s = await this.getSubject(classId, subjectId);
    if (!s) return [];
    return [...(s.chapters || [])].sort((a,b) => (a.display_order||0) - (b.display_order||0));
  },

  async getChapterContext(classId, subjectId, chapterId) {
    const cls = await this.getClass(classId);
    if (!cls) return null;
    const subject = (cls.subjects || []).find(s => s.id === subjectId);
    if (!subject) return null;
    const chapter = (subject.chapters || []).find(c => c.id === chapterId);
    if (!chapter) return null;
    return { chapter, subject, cls };
  },

  async search(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    const classes = await this.getClasses();
    const results = [];
    classes.forEach(cls => {
      (cls.subjects || []).forEach(subject => {
        (subject.chapters || []).forEach(ch => {
          const nameHit = ch.name.toLowerCase().includes(q);
          const subjectHit = subject.name.toLowerCase().includes(q);
          if (!nameHit && !subjectHit) return;
          results.push({
            classId: cls.id, className: cls.name,
            subjectId: subject.id, subjectName: subject.name,
            subjectIcon: subject.icon || '📘',
            chapterId: ch.id, chapterName: ch.name,
            score: nameHit ? ch.name.toLowerCase().indexOf(q) : 100 + subject.name.toLowerCase().indexOf(q)
          });
        });
      });
    });
    return results.sort((a,b) => a.score - b.score).slice(0, 40);
  }
};

/* ============================================================
   PDF RESOLUTION
   ============================================================ */
function getContentEntry(chapter, medium, type) {
  return chapter?.content?.[medium]?.[type] || null;
}

function resolvePdfUrl(chapter, medium, type) {
  const entry = getContentEntry(chapter, medium, type);
  if (entry?.pdf_path && /^https?:\/\//i.test(entry.pdf_path)) return entry.pdf_path;
  return null;
}

const pdfDataCache = new Map();
async function fetchPdfData(url, cacheKey) {
  if (pdfDataCache.has(cacheKey)) {
    return pdfDataCache.get(cacheKey).slice(0);
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error('PDF fetch failed: ' + res.status);
  const buffer = await res.arrayBuffer();
  pdfDataCache.set(cacheKey, buffer);
  return buffer.slice(0);
}

/* ============================================================
   MEDIUM & CONTENT SWITCH
   ============================================================ */
function switchMedium(m) {
  state.medium = m;
  document.querySelectorAll('.medium-btn').forEach(b => {
    b.classList.remove('active', 'hindi', 'english');
    if (b.dataset.medium === m) {
      b.classList.add('active', m);
    }
  });
  // Update header tag
  const tag = $('#headerTag');
  if (tag) tag.textContent = m === 'hindi' ? 'Hindi' : 'English';
  const sub = $('#headerSub');
  if (sub) sub.textContent = m === 'hindi' ? 'Study Material · हिंदी' : 'Study Material · English';
  // Re-render current route
  router();
}

function switchContentType(c) {
  state.contentType = c;
  document.querySelectorAll('.content-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.content === c);
  });
  // Re-render current route
  router();
}

function mediumSwitcherHTML() {
  return `
    <div class="medium-switcher">
      <button class="medium-btn hindi ${state.medium === 'hindi' ? 'active' : ''}"
              data-medium="hindi" onclick="switchMedium('hindi')">
        <i class="fas fa-language"></i> हिंदी मीडियम
      </button>
      <button class="medium-btn english ${state.medium === 'english' ? 'active' : ''}"
              data-medium="english" onclick="switchMedium('english')">
        <i class="fas fa-language"></i> English Medium
      </button>
    </div>
  `;
}

function contentSwitcherHTML() {
  return `
    <div class="content-switcher">
      ${CONTENT_TYPES.map(t => `
        <button class="content-btn ${state.contentType === t ? 'active' : ''}"
                data-content="${t}" onclick="switchContentType('${t}')">
          ${CONTENT_LABELS[t]}
        </button>
      `).join('')}
    </div>
  `;
}

/* ============================================================
   ROUTER
   ============================================================ */
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  const p = raw.split('/').filter(Boolean);
  if (p[0] === 'class' && p[2] === 'subject' && p[4] === 'chapter' && p[5]) {
    return { name:'chapter', classId:p[1], subjectId:p[3], chapterId:p[5] };
  }
  if (p[0] === 'class' && p[2] === 'subject' && p[3]) {
    return { name:'subject', classId:p[1], subjectId:p[3] };
  }
  if (p[0] === 'class' && p[1]) {
    return { name:'class', classId:p[1] };
  }
  return { name:'home' };
}

async function router() {
  const route = parseRoute();
  window.scrollTo(0, 0);
  const backBtn = $('#headerBackBtn');
  if (route.name === 'home') backBtn.classList.add('hidden');
  else backBtn.classList.remove('hidden');

  try {
    if (route.name === 'home')         await renderHome();
    else if (route.name === 'class')   await renderClassPage(route.classId);
    else if (route.name === 'subject') await renderSubjectPage(route.classId, route.subjectId);
    else                                await renderChapterPage(route.classId, route.subjectId, route.chapterId);
  } catch (err) {
    console.error('[Study Portal]', err);
    app.innerHTML = `<div class="page-head"><h2>Something went wrong</h2>
      <p>Please check your connection and try again.</p></div>
      <div class="empty"><strong>Unable to load study material</strong>
      <button class="btn btn-navy" style="margin-top:12px" onclick="location.reload()">Retry</button></div>`;
  }
}

function goBack() {
  const route = parseRoute();
  if (route.name === 'chapter') location.hash = `#/class/${route.classId}/subject/${route.subjectId}`;
  else if (route.name === 'subject') location.hash = `#/class/${route.classId}`;
  else if (route.name === 'class') location.hash = '#/';
  else history.back();
}

function crumbsHTML(items) {
  return `<nav class="crumbs" aria-label="Breadcrumb">${items.map((item, i) => `
    ${i ? '<span class="sep">›</span>' : ''}
    ${item.href
      ? `<a href="${item.href}">${esc(item.label)}</a>`
      : `<span class="current">${esc(item.label)}</span>`}
  `).join('')}</nav>`;
}

/* ============================================================
   HOME
   ============================================================ */
async function renderHome() {
  app.innerHTML = `
    <div class="page-head">
      <h2>Study Material</h2>
      <p>Select your class to get started</p>
    </div>
    ${mediumSwitcherHTML()}
    ${contentSwitcherHTML()}
    <div class="search-box">
      <span class="s-ico" aria-hidden="true">🔍</span>
      <input id="searchInput" type="search" inputmode="search"
             placeholder="Search Chapter or Subject" autocomplete="off" />
    </div>
    <div id="searchResults" class="stack" style="margin-top:12px"></div>
    <div id="classSection">
      <div class="section-label">Select Your Class</div>
      <div class="stack" id="classList">${skeletonCards(2)}</div>
    </div>
  `;

  const classes = await DataSource.getClasses();
  const list = $('#classList');
  if (!list) return;

  if (!classes.length) {
    list.innerHTML = `<div class="empty">
      <span class="empty-ico"><i class="fas fa-book-open"></i></span>
      <strong>Study Material Coming Soon</strong>
      Abhi tak koi material upload nahi hua hai.<br>
      <small>Teacher jab class, subject aur PDFs upload karenge, yaha dikh jaayenge.</small>
    </div>`;
    return;
  }

  list.innerHTML = classes.map(cls => `
    <a class="class-card" href="#/class/${cls.id}">
      <div class="card-icon" aria-hidden="true">📚</div>
      <div class="card-text">
        <h3>${esc(cls.name)}</h3>
        <span>Study Material</span>
      </div>
      <div class="card-arrow" aria-hidden="true">→</div>
    </a>
  `).join('');
}

let searchTimer;
app.addEventListener('input', e => {
  if (e.target.id !== 'searchInput') return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(e.target.value.trim()), 170);
});

async function runSearch(query) {
  const resultsBox = $('#searchResults');
  const classSection = $('#classSection');
  if (!resultsBox || !classSection) return;
  if (!query) {
    resultsBox.innerHTML = '';
    classSection.style.display = '';
    return;
  }
  classSection.style.display = 'none';
  resultsBox.innerHTML = '<div class="sk sk-card"></div>';
  const results = await DataSource.search(query);
  if ($('#searchInput')?.value.trim() !== query) return;
  if (!results.length) {
    resultsBox.innerHTML = `<div class="empty">
      <strong>No results found</strong>
      Nothing matched "${esc(query)}". Try another chapter or subject name.
    </div>`;
    return;
  }
  resultsBox.innerHTML = results.map(r => `
    <a class="item-card" href="#/class/${r.classId}/subject/${r.subjectId}/chapter/${r.chapterId}">
      <div class="card-icon" aria-hidden="true">${r.subjectIcon}</div>
      <div class="card-text">
        <h3>${esc(r.chapterName)}</h3>
        <span>${esc(r.className)} · ${esc(r.subjectName)}</span>
      </div>
      <div class="card-arrow" aria-hidden="true">→</div>
    </a>
  `).join('');
}

/* ============================================================
   CLASS PAGE
   ============================================================ */
async function renderClassPage(classId) {
  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label:'Class' }])}
    <div class="page-head"><h2>Loading…</h2></div>
    <div class="stack">${skeletonCards(4)}</div>
  `;
  const cls = await DataSource.getClass(classId);
  if (!cls) {
    app.innerHTML = crumbsHTML([{ label:'Home', href:'#/' }]) +
      `<div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-school"></i></span>
        <strong>Class not found</strong>
      </div>`;
    return;
  }
  const subjects = await DataSource.getSubjectsWithCounts(classId);
  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label: cls.name }])}
    ${mediumSwitcherHTML()}
    ${contentSwitcherHTML()}
    <div class="page-head">
      <h2>${esc(cls.name)}</h2>
      <p>Study Material · Select a subject</p>
    </div>
    <div class="stack">
      ${subjects.length ? subjects.map(s => `
        <a class="item-card" href="#/class/${cls.id}/subject/${s.id}">
          <div class="card-icon" aria-hidden="true">${s.icon || '📘'}</div>
          <div class="card-text">
            <h3>${esc(s.name)}</h3>
            <span>${s.chapter_count} Chapter${s.chapter_count === 1 ? '' : 's'}</span>
          </div>
          <div class="card-arrow" aria-hidden="true">→</div>
        </a>
      `).join('') : `<div class="empty">
        <span class="empty-ico"><i class="fas fa-book"></i></span>
        <strong>No subjects yet</strong>
        Is class ke subjects abhi upload nahi hue hain.
      </div>`}
    </div>
  `;
}

/* ============================================================
   SUBJECT PAGE
   ============================================================ */
async function renderSubjectPage(classId, subjectId) {
  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label:'Class' }, { label:'Subject' }])}
    <div class="page-head"><h2>Loading…</h2></div>
    <div class="stack">${skeletonChapters(6)}</div>
  `;
  const [cls, subject] = await Promise.all([
    DataSource.getClass(classId), DataSource.getSubject(classId, subjectId)
  ]);
  if (!cls || !subject) {
    app.innerHTML = crumbsHTML([{ label:'Home', href:'#/' }]) +
      `<div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-book"></i></span>
        <strong>Subject not found</strong>
      </div>`;
    return;
  }
  const chapters = await DataSource.getChaptersBySubject(classId, subjectId);
  // Filter chapters that have this content type in current medium
  const chaptersWithContent = chapters.filter(ch => {
    const entry = getContentEntry(ch, state.medium, state.contentType);
    return entry && entry.pdf_path;
  });

  app.innerHTML = `
    ${crumbsHTML([
      { label:'Home', href:'#/' },
      { label: cls.name, href:`#/class/${cls.id}` },
      { label: subject.name }
    ])}
    ${mediumSwitcherHTML()}
    ${contentSwitcherHTML()}
    <div class="page-head">
      <h2>${esc(cls.name)} ${esc(subject.name)}</h2>
      <p>${CONTENT_LABELS[state.contentType]} · ${chaptersWithContent.length} available</p>
    </div>
    <div class="section-label" style="margin-top:4px">Chapters</div>
    <div class="stack">
      ${chaptersWithContent.length ? chaptersWithContent.map(ch => {
        const previewHref = `#/class/${cls.id}/subject/${subject.id}/chapter/${ch.id}`;
        const entry = getContentEntry(ch, state.medium, state.contentType);
        const downloadOn = entry.download_on !== false;
        return `
          <div class="chapter-row" data-preview-href="${previewHref}">
            <div class="ch-num" aria-hidden="true">${pad2(ch.chapter_number)}</div>
            <div class="ch-body">
              <div class="ch-name">${esc(ch.name)}</div>
              <div class="ch-meta">
                <span>${CONTENT_LABELS[state.contentType]}</span>
                ${ch.is_new ? '<span class="badge-new-inline">NEW</span>' : ''}
                ${!downloadOn ? '<span style="background:#fef3c7;color:#b45309;font-size:9px;font-weight:800;padding:1.5px 5px;border-radius:4px;letter-spacing:.5px;">🔒 LOCKED</span>' : ''}
              </div>
            </div>
            <button class="ch-download ${!downloadOn ? 'locked' : ''}"
                    type="button"
                    data-download="${ch.id}"
                    aria-label="Download PDF">
              <i class="fas fa-${downloadOn ? 'download' : 'lock'}"></i>
            </button>
          </div>
        `;
      }).join('') : `<div class="empty">
        <span class="empty-ico"><i class="fas fa-file-alt"></i></span>
        <strong>No ${CONTENT_LABELS[state.contentType]} available</strong>
        Is subject me ${state.medium === 'hindi' ? 'हिंदी' : 'English'} medium ke ${CONTENT_LABELS[state.contentType]} abhi upload nahi hue.
      </div>`}
    </div>
  `;
}

/* ============================================================
   CHAPTER PAGE — PDF.js viewer
   ============================================================ */
async function renderChapterPage(classId, subjectId, chapterId) {
  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label:'Loading…' }])}
    <div class="sk" style="height:120px;border-radius:14px;margin-top:12px"></div>
  `;
  const ctx = await DataSource.getChapterContext(classId, subjectId, chapterId);
  if (!ctx || !ctx.chapter) {
    app.innerHTML = crumbsHTML([{ label:'Home', href:'#/' }]) +
      `<div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-file-alt"></i></span>
        <strong>Chapter not found</strong>
      </div>`;
    return;
  }
  const { chapter, subject, cls } = ctx;
  const subjectHref = `#/class/${cls.id}/subject/${subject.id}`;

  const pdfUrl = resolvePdfUrl(chapter, state.medium, state.contentType);

  if (!pdfUrl) {
    app.innerHTML = `
      ${crumbsHTML([
        { label:'Home', href:'#/' },
        { label: cls.name, href:`#/class/${cls.id}` },
        { label: subject.name, href: subjectHref },
        { label: `Ch ${pad2(chapter.chapter_number)}` }
      ])}
      ${mediumSwitcherHTML()}
      ${contentSwitcherHTML()}
      <div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-file-pdf"></i></span>
        <strong>${CONTENT_LABELS[state.contentType]} abhi upload nahi hua</strong>
        ${esc(chapter.name)} ka ${state.medium === 'hindi' ? 'हिंदी' : 'English'} medium ${CONTENT_LABELS[state.contentType]} abhi upload nahi kiya gaya.<br>
        <small>Dusra medium ya content type try karein.</small>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    ${crumbsHTML([
      { label:'Home', href:'#/' },
      { label: cls.name, href:`#/class/${cls.id}` },
      { label: subject.name, href: subjectHref },
      { label: `Ch ${pad2(chapter.chapter_number)}` }
    ])}
    ${mediumSwitcherHTML()}
    ${contentSwitcherHTML()}
    <div class="page-head" style="padding-top:10px;">
      <h2 style="font-size:17px;">${esc(chapter.name)}</h2>
      <p style="font-size:11.5px;">${CONTENT_LABELS[state.contentType]} · ${state.medium === 'hindi' ? 'हिंदी मीडियम' : 'English Medium'}</p>
    </div>
    <div class="pdfjs-viewer" id="pdfViewer">
      <div class="pdf-loading" id="pdfLoading">
        <div class="spinner-lg"></div>
        <span>Loading PDF pages…</span>
      </div>
    </div>
  `;

  renderPdfPages(chapter, state.medium, state.contentType, pdfUrl);
}

async function renderPdfPages(chapter, medium, type, pdfUrl) {
  const viewer = document.getElementById('pdfViewer');
  if (!viewer) return;

  const cacheKey = `${chapter.id}_${medium}_${type}`;

  try {
    if (!window.pdfjsLib) throw new Error('PDF.js library not loaded');
    const buffer = await fetchPdfData(pdfUrl, cacheKey);
    const loadingTask = pdfjsLib.getDocument({ data: buffer });
    const pdf = await loadingTask.promise;

    const loadingEl = document.getElementById('pdfLoading');
    if (loadingEl) loadingEl.remove();

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const container = viewer;
      const containerWidth = container.clientWidth || window.innerWidth - 28;
      const unscaledViewport = page.getViewport({ scale: 1 });
      const scale = (containerWidth - 2) / unscaledViewport.width;
      const viewport = page.getViewport({ scale });

      const pageWrap = document.createElement('div');
      pageWrap.className = 'pdf-page';
      pageWrap.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

      const numBadge = document.createElement('div');
      numBadge.className = 'pdf-page-num';
      numBadge.textContent = `${pageNum} / ${pdf.numPages}`;
      pageWrap.appendChild(numBadge);

      const canvas = document.createElement('canvas');
      const ctx2d = canvas.getContext('2d');

      const outputScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + 'px';
      canvas.style.height = Math.floor(viewport.height) + 'px';

      const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

      pageWrap.appendChild(canvas);
      viewer.appendChild(pageWrap);

      await page.render({ canvasContext: ctx2d, viewport, transform }).promise;
    }
  } catch (err) {
    console.error('[PDF.js] render failed:', err);
    pdfDataCache.delete(cacheKey);
    viewer.innerHTML = `
      <div class="pdf-error">
        <div>⚠️ PDF load nahi ho paya</div>
        <p style="margin-top:8px;font-weight:500;color:#7a2040;font-size:12.5px;">
          ${esc(err.message || 'Unknown error')}
        </p>
        <button class="btn btn-navy" onclick="retryPdfRender('${chapter.id}')">
          <i class="fas fa-redo"></i> Retry
        </button>
      </div>
    `;
  }
}

window.retryPdfRender = function(chapterId) {
  const route = parseRoute();
  if (route.name !== 'chapter') return;
  // Clear caches
  pdfDataCache.delete(`${chapterId}_${state.medium}_${state.contentType}`);
  DataSource.getChapterContext(route.classId, route.subjectId, route.chapterId).then(ctx => {
    if (ctx && ctx.chapter) {
      const viewer = document.getElementById('pdfViewer');
      if (viewer) {
        viewer.innerHTML = `
          <div class="pdf-loading" id="pdfLoading">
            <div class="spinner-lg"></div>
            <span>Loading PDF pages…</span>
          </div>
        `;
      }
      renderChapterPage(route.classId, route.subjectId, route.chapterId);
    }
  });
};

let resizeTimer;
window.addEventListener('resize', () => {
  if (!location.hash.includes('/chapter/')) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const route = parseRoute();
    if (route.name === 'chapter') renderChapterPage(route.classId, route.subjectId, route.chapterId);
  }, 400);
});

/* ============================================================
   DOWNLOAD FLOW
   ============================================================ */
document.addEventListener('click', e => {
  const dlBtn = e.target.closest('[data-download]');
  if (dlBtn) {
    e.preventDefault();
    e.stopPropagation();
    handleDownloadClick(dlBtn.dataset.download);
    return;
  }
  const row = e.target.closest('.chapter-row[data-preview-href]');
  if (row) {
    e.preventDefault();
    location.hash = row.dataset.previewHref.replace(/^#/, '');
  }
});

async function handleDownloadClick(chapterId) {
  try {
    // Find chapter
    const classes = await DataSource.getClasses();
    let chapter = null;
    outer:
    for (const cls of classes) {
      for (const s of (cls.subjects || [])) {
        for (const ch of (s.chapters || [])) {
          if (ch.id === chapterId) { chapter = ch; break outer; }
        }
      }
    }
    if (!chapter) return toast('Chapter not found');

    const entry = getContentEntry(chapter, state.medium, state.contentType);
    if (!entry?.pdf_path) return toast('PDF abhi upload nahi hua');

    const pdfUrl = entry.pdf_path;
    const fileName = sanitizeFile(chapter.name + '_' + state.medium + '_' + state.contentType) + '.pdf';
    const downloadOn = entry.download_on !== false;

    if (downloadOn) {
      // Free download
      triggerDownload(pdfUrl, fileName);
      toast('Download started ✓');
    } else {
      // Locked — check if already verified
      if (state.verifiedStudent) {
        // Already verified in this session
        triggerDownload(pdfUrl, fileName);
        toast('Verified ✓ Download started');
      } else {
        // Show popup
        openVerifyPopup(chapterId, pdfUrl, fileName);
      }
    }
  } catch (err) {
    console.error('[Download]', err);
    toast('Download failed. Please try again.');
  }
}

function triggerDownload(url, fileName) {
  const link = document.createElement('a');
  link.href = url;
  link.download = fileName;
  link.target = '_blank';
  link.rel = 'noopener';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
}

/* ============================================================
   VERIFY POPUP
   ============================================================ */
function openVerifyPopup(chapterId, pdfUrl, fileName) {
  state.pendingDownload = { chapterId, pdfUrl, fileName };
  $('#verifyPopup').classList.add('open');
  $('#verifyRoll').value = '';
  $('#verifyReg').value = '';
  $('#verifyStatus').className = 'popup-status';
  $('#verifyStatus').textContent = '';
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('#verifyRoll').focus(), 350);
}

window.closeVerifyPopup = function() {
  $('#verifyPopup').classList.remove('open');
  state.pendingDownload = null;
  document.body.style.overflow = '';
};

function setVerifyStatus(type, message) {
  const el = $('#verifyStatus');
  el.className = 'popup-status ' + type;
  el.innerHTML = type === 'loading'
    ? `<span class="spinner"></span><span>${esc(message)}</span>`
    : `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i><span>${esc(message)}</span>`;
}

window.submitVerify = async function() {
  const roll = $('#verifyRoll').value.trim();
  const reg = $('#verifyReg').value.trim();

  if (!roll) {
    setVerifyStatus('error', 'Roll Number daalein');
    $('#verifyRoll').focus();
    return;
  }
  if (!reg) {
    setVerifyStatus('error', 'Registration Number daalein');
    $('#verifyReg').focus();
    return;
  }

  setVerifyStatus('loading', 'Verifying student…');
  const btn = $('#verifyBtn');
  btn.disabled = true;

  try {
    // Query admissions collection — match rollNumber + admissionNo
    const snap = await db.collection(ADMISSIONS_COLLECTION)
      .where('rollNumber', '==', roll)
      .where('admissionNo', '==', reg)
      .limit(1)
      .get();

    if (snap.empty) {
      setVerifyStatus('error', 'Aapka Roll No ya Registration No galat hai. Dobara try karein.');
      btn.disabled = false;
      return;
    }

    const doc = snap.docs[0];
    const student = doc.data();

    // Save verified session
    state.verifiedStudent = {
      id: doc.id,
      rollNumber: roll,
      admissionNo: reg,
      name: student.studentName || '',
      verifiedAt: Date.now()
    };
    sessionStorage.setItem('quest_study_verified', JSON.stringify(state.verifiedStudent));

    setVerifyStatus('success', `Verified! Welcome ${student.studentName || 'Student'}`);

    setTimeout(() => {
      // Download the PDF
      if (state.pendingDownload) {
        triggerDownload(state.pendingDownload.pdfUrl, state.pendingDownload.fileName);
        toast('Verified ✓ Download started');
      }
      closeVerifyPopup();
    }, 900);

  } catch (err) {
    console.error('[Verify]', err);
    setVerifyStatus('error', 'Verification failed: ' + err.message);
  } finally {
    btn.disabled = false;
  }
};

/* Esc key to close popup */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('#verifyPopup').classList.contains('open')) closeVerifyPopup();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('hashchange', router);
router();
</script>
