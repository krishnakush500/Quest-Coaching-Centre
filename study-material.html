<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d2b6b" />
<title>Study Material · Quest Coaching Centre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   QUEST COACHING CENTRE — STUDY MATERIAL PORTAL
   Design: Royal Blue + Golden Yellow + White Cards
   ============================================================ */
:root{
  --navy:#0d2b6b;
  --navy-2:#16409b;
  --navy-dark:#081f52;
  --gold:#ffc42e;
  --gold-2:#f7b500;
  --gold-ink:#3a2a00;
  --bg:#f2f5fb;
  --card:#ffffff;
  --text:#0f2452;
  --muted:#5f6f90;
  --border:#e3e9f5;
  --border-strong:#cfdcf5;
  --red:#e0245e;
  --red-bg:#ffe3ea;
  --radius:14px;
  --shadow:0 2px 10px rgba(13,43,107,.07);
  --shadow-hover:0 10px 26px rgba(13,43,107,.14);
  --header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.45;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 14px}

/* ---------------- COMPACT HEADER ---------------- */
.app-header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#0d2b6b 0%,#16409b 100%);
  border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(8,31,82,.20);
}
.header-inner{
  display:flex;align-items:center;gap:10px;
  min-height:var(--header-h);
  padding:7px 0;
  position:relative;
}
.back-header-btn{
  width:32px;height:32px;flex:none;border-radius:9px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.26);
  color:#fff;font-size:13px;
  display:grid;place-items:center;cursor:pointer;
  transition:all .2s;
}
.back-header-btn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.back-header-btn:active{transform:scale(.94);}
.back-header-btn.hidden{display:none;}

.brand{flex:1;min-width:0;text-align:center;}
.brand h1{
  font-size:13.5px;font-weight:800;color:#fff;
  letter-spacing:.7px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  font-size:11px;color:#c3d2f2;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-tag{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;
  color:var(--gold-ink);
  background:linear-gradient(135deg,#ffd257,#f7b500);
  padding:4px 9px;border-radius:20px;
  text-transform:uppercase;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
@media(max-width:400px){.header-tag{display:none}}

/* ---------------- LAYOUT ---------------- */
main{flex:1 0 auto;padding-bottom:26px}
.page-head{padding:15px 0 11px}
.page-head h2{
  font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.2px;
}
.page-head h2::after{
  content:"";display:block;width:38px;height:3px;border-radius:2px;
  background:var(--gold);margin-top:7px;
}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:7px}

.section-label{
  font-size:11px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);
  margin:16px 0 9px;
}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------------- SEARCH ---------------- */
.search-box{
  display:flex;align-items:center;gap:9px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 12px;
  box-shadow:var(--shadow);
  transition:border-color .15s, box-shadow .15s;
}
.search-box:focus-within{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(22,64,155,.10)}
.search-box .s-ico{font-size:14px;opacity:.7;flex:none}
.search-box input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  padding:12px 0;font-size:14px;color:var(--text);
}
.search-box input::placeholder{color:#9aa8c4}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none}

/* ---------------- CARDS ---------------- */
.card-icon{
  width:44px;height:44px;flex:none;border-radius:12px;
  display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;
}
.class-card,.item-card{
  position:relative;
  display:flex;align-items:center;gap:12px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:13px 13px 13px 15px;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  overflow:hidden;
  min-height:68px;
}
.class-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#ffd257,#f7b500);
}
.class-card .card-icon{
  background:linear-gradient(135deg,#0d2b6b,#1b4bb5);
  border-color:#1b4bb5;
  box-shadow:0 3px 8px rgba(13,43,107,.25);
  color:#fff;
}
.class-card:active,.item-card:active{transform:scale(.985)}
@media(hover:hover){
  .class-card:hover,.item-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-hover);
    border-color:var(--border-strong);
  }
  .class-card:hover .card-arrow,.item-card:hover .card-arrow{
    background:var(--gold);color:var(--gold-ink);border-color:var(--gold);
  }
}
.card-text{flex:1;min-width:0}
.card-text h3{
  font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-text span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.card-arrow{
  width:30px;height:30px;flex:none;border-radius:50%;
  display:grid;place-items:center;
  background:#f1f5ff;border:1px solid #e4ebfb;color:var(--navy);
  font-size:14px;font-weight:700;
  transition:background .15s,color .15s,border-color .15s;
}

/* ============================================================
   CHAPTER CARD — CLEAN & COMPACT
   ============================================================ */
.chapter-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px 12px 14px 14px;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  text-decoration:none;
}
.chapter-row::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:linear-gradient(180deg,#ffd257,#f7b500);
  opacity:0;
  transition:opacity .2s;
}
.chapter-row:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-hover);
  border-color:var(--border-strong);
}
.chapter-row:hover::before{opacity:1;}
.chapter-row:active{transform:scale(.99);}

.ch-num{
  width:34px;height:34px;flex:none;border-radius:10px;
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;
  color:var(--navy);
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.3px;
  display:grid;
  place-items:center;
}

.ch-body{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.ch-name{
  font-size:15px;
  font-weight:800;
  color:var(--navy);
  line-height:1.3;
  letter-spacing:-.1px;
  word-break:break-word;
}
.ch-meta{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted);
  font-weight:600;
  letter-spacing:.2px;
}
.ch-meta .badge-new-inline{
  background:var(--red-bg);
  color:var(--red);
  font-size:9px;
  font-weight:800;
  letter-spacing:.5px;
  padding:1.5px 5px;
  border-radius:4px;
}

.ch-download{
  width:38px;
  height:38px;
  flex:none;
  border-radius:11px;
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:var(--navy);
  display:grid;
  place-items:center;
  font-size:15px;
  box-shadow:0 3px 8px rgba(247,181,0,.28);
  border:1px solid #f0ad00;
  transition:all .18s ease;
  cursor:pointer;
}
.ch-download:hover{
  transform:scale(1.08);
  box-shadow:0 5px 14px rgba(247,181,0,.45);
  background:linear-gradient(135deg,#ffdf7a,#ffc42e);
}
.ch-download:active{transform:scale(.94);}

@media(min-width:600px){
  .chapter-row{padding:16px 16px 16px 18px;gap:14px;}
  .ch-num{width:38px;height:38px;font-size:12.5px;}
  .ch-name{font-size:16.5px;}
  .ch-meta{font-size:12px;}
  .ch-download{width:42px;height:42px;font-size:16px;}
}

/* ---------------- BUTTONS ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:9px 13px;
  border-radius:10px;border:1px solid transparent;
  font-size:13px;font-weight:700;letter-spacing:.15px;
  white-space:nowrap;cursor:pointer;
  transition:transform .13s ease, box-shadow .15s ease, background .15s ease;
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn-gold{
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:var(--gold-ink);
  box-shadow:0 2px 8px rgba(247,181,0,.32);
  border-color:#f0ad00;
}
.btn-navy{
  background:linear-gradient(135deg,#0d2b6b,#1b4bb5);
  color:#fff;
  box-shadow:0 2px 8px rgba(13,43,107,.28);
}
.btn-ghost{
  background:#fff;border-color:var(--border-strong);color:var(--navy);
}
.btn-block{width:100%}
.btn-lg{min-height:46px;font-size:13.5px}

/* ---------------- BREADCRUMBS ---------------- */
.crumbs{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:12px 0 0;font-size:11.5px;color:var(--muted);
}
.crumbs a{color:var(--navy);font-weight:650}
.crumbs a:active{color:var(--navy-2)}
.crumbs .sep{opacity:.45;font-size:12px}
.crumbs .current{
  color:var(--muted);font-weight:600;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.back-link{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:700;color:var(--navy);
  padding:2px 0 8px;
}
.back-link:active{opacity:.6}

/* ============================================================
   PDF PREVIEW — CLEAN FULL-VIEW (no card, no heading, no button)
   ============================================================ */
.pdf-view-full{
  margin-top:10px;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  background:#fff;
}
.pdf-view-full iframe{
  width:100%;
  height:calc(100vh - 190px);
  min-height:520px;
  border:0;
  display:block;
  background:#e9edf5;
}
@media(max-width:600px){
  .pdf-view-full iframe{
    height:calc(100vh - 160px);
    min-height:480px;
  }
}

/* Android fallback — only Open PDF button, centered, clean */
.pdf-fallback-simple{
  margin-top:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:36px 20px;
  text-align:center;
}
.pdf-fallback-simple .pf-ico{
  font-size:42px;
  color:var(--navy);
  line-height:1;
}
.pdf-fallback-simple h3{
  font-size:16px;
  font-weight:800;
  color:var(--navy);
  margin-top:14px;
  letter-spacing:.2px;
}
.pdf-fallback-simple p{
  font-size:12.5px;
  color:var(--muted);
  margin-top:8px;
  max-width:320px;
  margin-left:auto;
  margin-right:auto;
  line-height:1.5;
}
.pdf-fallback-simple .btn{
  margin-top:18px;
  min-width:180px;
}

/* ---------------- STATES ---------------- */
.empty{
  background:var(--card);border:1px dashed var(--border-strong);
  border-radius:var(--radius);padding:22px 16px;text-align:center;
  font-size:13px;color:var(--muted);
}
.empty strong{display:block;color:var(--navy);font-size:14px;margin-bottom:4px;}
.sk{
  border-radius:var(--radius);
  background:linear-gradient(90deg,#eef2f9 25%,#e2e9f6 37%,#eef2f9 63%);
  background-size:400% 100%;
  animation:shimmer 1.25s ease-in-out infinite;
}
.sk-card{height:68px}
.sk-chapter{height:72px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}

/* ---------------- FOOTER ---------------- */
.app-footer{
  flex:none;margin-top:auto;
  background:#fff;border-top:1px solid var(--border);
  padding:18px 14px calc(20px + env(safe-area-inset-bottom));
  text-align:center;
}
.app-footer strong{
  display:block;font-size:12.5px;font-weight:800;
  color:var(--navy);letter-spacing:.7px;
}
.app-footer span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;}
.app-footer small{display:block;font-size:11px;color:#93a1bd;margin-top:8px;}

/* ---------------- TOAST ---------------- */
.toast{
  position:fixed;left:50%;bottom:22px;z-index:200;
  transform:translate(-50%,90px);
  background:var(--navy-dark);color:#fff;
  padding:11px 17px;border-radius:11px;
  font-size:12.5px;font-weight:650;
  box-shadow:0 10px 28px rgba(8,31,82,.35);
  border-left:3px solid var(--gold);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
  max-width:92vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media(min-width:600px){
  body{font-size:15.5px}
  .page-head h2{font-size:23px}
  .class-card,.item-card{padding:15px 16px}
  .card-icon{width:48px;height:48px;font-size:22px}
  .card-text h3{font-size:15.5px}
}
@media(max-width:359px){
  .wrap{padding:0 11px}
  .brand h1{font-size:12.5px}
  .btn{font-size:12.5px;padding:9px 10px}
  .ch-name{font-size:14px;}
}
</style>
</head>

  'c12-bio':['Sexual Reproduction in Flowering Plants','Human Reproduction','Reproductive Health','Principles of Inheritance and Variation','Molecular Basis of Inheritance','Evolution','Human Health and Disease','Microbes in Human Welfare','Biotechnology: Principles and Processes','Biotechnology and its Applications','Organisms and Populations','Ecosystem','Biodiversity and Conservation','Biology Practice Set – I','Biology Practice Set – II','Biology Sample Paper 2026'],
  'c12-eng':['The Last Lesson','Lost Spring','Deep Water','The Rattrap','Indigo','My Mother at Sixty-six']
};

const DEMO_NEW = new Set(['c10-sci-1','c10-math-2','c12-phy-1','c12-chem-4','c12-bio-1']);

function buildDemoChapters() {
  const chapters = [];
  Object.keys(DEMO_CHAPTER_NAMES).forEach(subjectId => {
    DEMO_CHAPTER_NAMES[subjectId].forEach((name, i) => {
      const id = `${subjectId}-${i+1}`;
      chapters.push({
        id,
        subject_id: subjectId,
        chapter_number: i+1,
        name,
        pdf_path: null,
        display_order: i+1,
        is_new: DEMO_NEW.has(id),
        is_published: true
      });
    });
  });
  return chapters;
}
const DEMO_CHAPTERS = buildDemoChapters();

/* ---------------------------------------------------------------
   4. DATA SOURCE
   --------------------------------------------------------------- */
const DataSource = {
  _cache: { classes:null, subjects:null, chapters:null },

  async _fetchCollection(col) {
    const snap = await db.collection(col).get();
    const items = [];
    snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
    return items;
  },

  async getClasses() {
    if (this._cache.classes) return this._cache.classes;
    try {
      const items = await this._fetchCollection(COL_CLASSES);
      const list = items.length ? items : DEMO_CLASSES;
      this._cache.classes = list.sort((a,b) => (a.display_order||0) - (b.display_order||0));
      return this._cache.classes;
    } catch (err) {
      console.warn('Firestore classes fetch failed, using demo:', err.message);
      this._cache.classes = DEMO_CLASSES;
      return DEMO_CLASSES;
    }
  },

  async getClass(id) {
    const list = await this.getClasses();
    return list.find(c => c.id === id) || null;
  },

  async getSubjects() {
    if (this._cache.subjects) return this._cache.subjects;
    try {
      const items = await this._fetchCollection(COL_SUBJECTS);
      const list = items.length ? items : DEMO_SUBJECTS;
      this._cache.subjects = list.sort((a,b) => (a.display_order||0) - (b.display_order||0));
      return this._cache.subjects;
    } catch (err) {
      console.warn('Firestore subjects fetch failed, using demo:', err.message);
      this._cache.subjects = DEMO_SUBJECTS;
      return DEMO_SUBJECTS;
    }
  },

  async getSubject(id) {
    const list = await this.getSubjects();
    return list.find(s => s.id === id) || null;
  },

  async getSubjectsWithCounts(classId) {
    const [subjects, chapters] = await Promise.all([
      this.getSubjects(),
      this.getChapters()
    ]);
    const filtered = subjects
      .filter(s => s.class_id === classId)
      .sort((a,b) => (a.display_order||0) - (b.display_order||0));
    return filtered.map(s => ({
      ...s,
      chapter_count: chapters.filter(c => c.subject_id === s.id).length
    }));
  },

  async getChapters() {
    if (this._cache.chapters) return this._cache.chapters;
    try {
      const items = await this._fetchCollection(COL_CHAPTERS);
      const list = items.length ? items : DEMO_CHAPTERS;
      this._cache.chapters = list.sort((a,b) => (a.display_order||0) - (b.display_order||0));
      return this._cache.chapters;
    } catch (err) {
      console.warn('Firestore chapters fetch failed, using demo:', err.message);
      this._cache.chapters = DEMO_CHAPTERS;
      return DEMO_CHAPTERS;
    }
  },

  async getChaptersBySubject(subjectId) {
    const all = await this.getChapters();
    return all
      .filter(c => c.subject_id === subjectId)
      .sort((a,b) => (a.display_order||0) - (b.display_order||0));
  },

  async getChapterContext(chapterId) {
    const [chapters, subjects, classes] = await Promise.all([
      this.getChapters(),
      this.getSubjects(),
      this.getClasses()
    ]);
    const chapter = chapters.find(c => c.id === chapterId);
    if (!chapter) return null;
    const subject = subjects.find(s => s.id === chapter.subject_id) || null;
    const cls = subject ? classes.find(c => c.id === subject.class_id) : null;
    return { chapter, subject, cls };
  },

  async search(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    const [chapters, subjects, classes] = await Promise.all([
      this.getChapters(),
      this.getSubjects(),
      this.getClasses()
    ]);
    const subjectMap = new Map(subjects.map(s => [s.id, s]));
    const classMap = new Map(classes.map(c => [c.id, c]));

    const results = [];
    chapters.forEach(ch => {
      const subject = subjectMap.get(ch.subject_id);
      if (!subject) return;
      const cls = classMap.get(subject.class_id);
      if (!cls) return;

      const nameHit = ch.name.toLowerCase().includes(q);
      const subjectHit = subject.name.toLowerCase().includes(q);
      if (!nameHit && !subjectHit) return;

      results.push({
        classId: cls.id,
        className: cls.name,
        subjectId: subject.id,
        subjectName: subject.name,
        subjectIcon: subject.icon || '📘',
        chapterId: ch.id,
        chapterName: ch.name,
        chapterNumber: ch.chapter_number,
        score: nameHit ? ch.name.toLowerCase().indexOf(q) : 100 + subject.name.toLowerCase().indexOf(q)
      });
    });
    return results.sort((a,b) => a.score - b.score).slice(0, 40);
  }
};

/* ---------------------------------------------------------------
   5. PDF RESOLUTION
   --------------------------------------------------------------- */
const pdfBlobCache = new Map();

function resolvePdfUrl(chapter) {
  if (chapter.pdf_path && /^https?:\/\//i.test(chapter.pdf_path)) return chapter.pdf_path;

  if (chapter.pdf_path) {
    const bucket = firebaseConfig.storageBucket;
    const path = chapter.pdf_path.replace(/^\/+/, '');
    return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(path)}?alt=media`;
  }

  if (pdfBlobCache.has(chapter.id)) return pdfBlobCache.get(chapter.id);

  const blob = new Blob([buildSamplePdf(chapter)], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  pdfBlobCache.set(chapter.id, url);
  return url;
}

function buildSamplePdf(chapter) {
  const clean = s => String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const title = clean(chapter.name || 'Study Material');
  const meta  = clean(`Quest Coaching Centre  |  Chapter ${pad2(chapter.chapter_number || 1)}`);

  const content =
    `BT\n/F1 22 Tf\n0.05 0.17 0.42 rg\n60 742 Td\n(${title}) Tj\nET\n` +
    `BT\n/F2 12 Tf\n0.37 0.44 0.56 rg\n60 714 Td\n(${meta}) Tj\nET\n` +
    `0.85 0.85 0.9 RG\n1 w\n60 700 m 535 700 l S\n` +
    `BT\n/F2 11 Tf\n0.2 0.25 0.35 rg\n60 664 Td\n(This is a sample study-material PDF.) Tj\nET\n` +
    `BT\n/F2 11 Tf\n0.2 0.25 0.35 rg\n60 644 Td\n(Real notes will appear once uploaded by admin.) Tj\nET\n` +
    `0.05 0.17 0.42 rg\n60 60 475 8 re f\n` +
    `1 0.77 0.18 rg\n60 60 150 8 re f\n`;

  const objects = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] ' +
      '/Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${content.length} >>\nstream\n${content}endstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'
  ];

  let pdf = '%PDF-1.4\n';
  const offsets = [];
  objects.forEach((obj, i) => {
    offsets.push(pdf.length);
    pdf += `${i + 1} 0 obj\n${obj}\nendobj\n`;
  });
  const xrefStart = pdf.length;
  pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
  offsets.forEach(off => { pdf += `${String(off).padStart(10, '0')} 00000 n \n`; });
  pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return pdf;
}

/* ---------------------------------------------------------------
   6. ROUTER
   --------------------------------------------------------------- */
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  const p = raw.split('/').filter(Boolean);

  if (p[0] === 'class' && p[2] === 'subject' && p[4] === 'chapter' && p[5]) {
    return { name: 'chapter', classId: p[1], subjectId: p[3], chapterId: p[5] };
  }
  if (p[0] === 'class' && p[2] === 'subject' && p[3]) {
    return { name: 'subject', classId: p[1], subjectId: p[3] };
  }
  if (p[0] === 'class' && p[1]) {
    return { name: 'class', classId: p[1] };
  }
  return { name: 'home' };
}

async function router() {
  const route = parseRoute();
  window.scrollTo(0, 0);

  const backBtn = $('#headerBackBtn');
  if (route.name === 'home') backBtn.classList.add('hidden');
  else backBtn.classList.remove('hidden');

  try {
    if (route.name === 'home')         await renderHome();
    else if (route.name === 'class')   await renderClassPage(route.classId);
    else if (route.name === 'subject') await renderSubjectPage(route.classId, route.subjectId);
    else                                await renderChapterPage(route.chapterId);
  } catch (err) {
    console.error('[Study Portal]', err);
    app.innerHTML = `<div class="page-head"><h2>Something went wrong</h2>
      <p>Please check your connection and try again.</p></div>
      <div class="empty"><strong>Unable to load study material</strong>
      <button class="btn btn-navy" style="margin-top:12px" onclick="location.reload()">Retry</button></div>`;
  }
}

function goBack() {
  const route = parseRoute();
  if (route.name === 'chapter') location.hash = `#/class/${route.classId}/subject/${route.subjectId}`;
  else if (route.name === 'subject') location.hash = `#/class/${route.classId}`;
  else if (route.name === 'class') location.hash = '#/';
  else history.back();
}

function crumbsHTML(items) {
  return `<nav class="crumbs" aria-label="Breadcrumb">${items.map((item, i) => `
    ${i ? '<span class="sep">›</span>' : ''}
    ${item.href
      ? `<a href="${item.href}">${esc(item.label)}</a>`
      : `<span class="current">${esc(item.label)}</span>`}
  `).join('')}</nav>`;
}

   7. PAGE — HOME
   --------------------------------------------------------------- */
async function renderHome() {
  app.innerHTML = `
    <div class="page-head">
      <h2>Study Material</h2>
      <p>Select your class to get started</p>
    </div>

    <div class="search-box">
      <span class="s-ico" aria-hidden="true">🔍</span>
      <input id="searchInput" type="search" inputmode="search"
             placeholder="Search Chapter or Subject" autocomplete="off"
             aria-label="Search chapter or subject" />
    </div>

    <div id="searchResults" class="stack" style="margin-top:12px"></div>

    <div id="classSection">
      <div class="section-label">Select Your Class</div>
      <div class="stack" id="classList">${skeletonCards(2)}</div>
    </div>

  const classes = await DataSource.getClasses();

  if (!list) return;

  }

  list.innerHTML = classes.map(cls => `

      <div class="card-text">

      </div>
      <div class="card-arrow" aria-hidden="true">→</div>
    </a>

}

/* Live search */
let searchTimer;
app.addEventListener('input', e => {
  if (e.target.id !== 'searchInput') return;
  const value = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(value.trim()), 170);
});

async function runSearch(query) {
  const resultsBox = $('#searchResults');
  const classSection = $('#classSection');
  if (!resultsBox || !classSection) return;

  if (!query) {
    resultsBox.innerHTML = '';
    classSection.style.display = '';
    return;
  }

  classSection.style.display = 'none';
  resultsBox.innerHTML = '<div class="sk sk-card"></div>';

  const results = await DataSource.search(query);
  if ($('#searchInput')?.value.trim() !== query) return;

  if (!results.length) {
    resultsBox.innerHTML = `<div class="empty">
      <strong>No results found</strong>
      Nothing matched “${esc(query)}”. Try another chapter or subject name.
    </div>`;
    return;
  }

  resultsBox.innerHTML = results.map(r => `
    <a class="item-card" href="#/class/${r.classId}/subject/${r.subjectId}/chapter/${r.chapterId}">
      <div class="card-icon" aria-hidden="true">${r.subjectIcon}</div>
      <div class="card-text">
        <h3>${esc(r.chapterName)}</h3>
        <span>${esc(r.className)} · ${esc(r.subjectName)}</span>
      </div>
      <div class="card-arrow" aria-hidden="true">→</div>
    </a>
  `).join('');
}

   9. PAGE — SUBJECT → CHAPTER LIST

/* ---------------------------------------------------------------
   10. PAGE — CHAPTER PDF PREVIEW (CLEAN — only PDF viewer)
   --------------------------------------------------------------- */
async function renderChapterPage(chapterId) {
  app.innerHTML = `
    ${crumbsHTML([{ label: 'Home', href: '#/' }, { label: 'Loading…' }])}
    <div class="sk" style="height:120px;border-radius:14px;margin-top:12px"></div>
  `;

  const ctx = await DataSource.getChapterContext(chapterId);
  if (!ctx || !ctx.chapter) {
    app.innerHTML = crumbsHTML([{ label: 'Home', href: '#/' }]) +
      `<div class="empty" style="margin-top:16px"><strong>Chapter not found</strong>
       Please go back and choose a chapter again.</div>`;
    return;
  }

  const { chapter, subject, cls } = ctx;
  const pdfUrl = resolvePdfUrl(chapter);
  const subjectHref = `#/class/${cls.id}/subject/${subject.id}`;

  app.innerHTML = `
    ${crumbsHTML([
      { label: 'Home', href: '#/' },
      { label: cls.name, href: `#/class/${cls.id}` },
      { label: subject.name, href: subjectHref },
      { label: `Ch ${pad2(chapter.chapter_number)}` }
    ])}

    ${ANDROID_NO_INLINE_PDF ? `
      <div class="pdf-fallback-simple">
        <div class="pf-ico" aria-hidden="true"><i class="fas fa-file-pdf"></i></div>
        <h3>${esc(chapter.name)}</h3>
        <p>Your browser can't display PDFs inline. Open it in a new tab to read.</p>
        <a class="btn btn-navy" href="${pdfUrl}" target="_blank" rel="noopener">
          <i class="fas fa-external-link-alt"></i> Open PDF
        </a>
      </div>
    ` : `
      <div class="pdf-view-full">
        <iframe src="${pdfUrl}#view=FitH&toolbar=1"
                title="${esc(chapter.name)} — PDF preview"
                loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>
    `}
  `;
}

/* ---------------------------------------------------------------
   11. CLICK HANDLER — Preview (chapter-row) + Download icon
   --------------------------------------------------------------- */
document.addEventListener('click', e => {
  const dlBtn = e.target.closest('[data-download]');
  if (dlBtn) {
    e.preventDefault();
    e.stopPropagation();
    handleDownload(dlBtn.dataset.download);
    return;
  }

  const row = e.target.closest('.chapter-row[data-preview-href]');
  if (row) {
    e.preventDefault();
    location.hash = row.dataset.previewHref.replace(/^#/, '');
  }
});

async function handleDownload(chapterId) {
  try {
    const ctx = await DataSource.getChapterContext(chapterId);
    if (!ctx || !ctx.chapter) return toast('Chapter not found');

    const url = resolvePdfUrl(ctx.chapter);
    const link = document.createElement('a');
    link.href = url;
    link.download = sanitizeFile(ctx.chapter.name) + '.pdf';
    link.rel = 'noopener';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();

    toast('Download started ✓');
  } catch (err) {
    console.error('[Study Portal] download failed', err);
    toast('Download failed. Please try again.');
  }
}

window.addEventListener('hashchange', router);
router();
