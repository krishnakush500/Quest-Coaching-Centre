<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d2b6b" />
<title>Study Material · Quest Coaching Centre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>

<style>
:root{
  --navy:#0d2b6b;
  --navy-2:#16409b;
  --navy-dark:#081f52;
  --gold:#ffc42e;
  --gold-2:#f7b500;
  --gold-ink:#3a2a00;
  --bg:#f2f5fb;
  --card:#ffffff;
  --text:#0f2452;
  --muted:#5f6f90;
  --border:#e3e9f5;
  --border-strong:#cfdcf5;
  --red:#e0245e;
  --red-bg:#ffe3ea;
  --green:#0e9f6e;
  --green-bg:#e3fcef;
  --radius:14px;
  --shadow:0 2px 10px rgba(13,43,107,.07);
  --shadow-hover:0 10px 26px rgba(13,43,107,.14);
  --header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 14px}

/* Header */
.app-header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#0d2b6b 0%,#16409b 100%);
  border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(8,31,82,.20);
}
.header-inner{
  display:flex;align-items:center;gap:10px;
  min-height:var(--header-h);padding:7px 0;position:relative;
}
.back-header-btn{
  width:32px;height:32px;flex:none;border-radius:9px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.26);
  color:#fff;font-size:13px;display:grid;place-items:center;cursor:pointer;
  transition:all .2s;
}
.back-header-btn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.back-header-btn:active{transform:scale(.94);}
.back-header-btn.hidden{display:none;}
.brand{flex:1;min-width:0;text-align:center;}
.brand h1{
  font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.7px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  font-size:11px;color:#c3d2f2;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-tag{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;
  color:var(--gold-ink);
  background:linear-gradient(135deg,#ffd257,#f7b500);
  padding:4px 9px;border-radius:20px;text-transform:uppercase;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
@media(max-width:400px){.header-tag{display:none}}

main{flex:1 0 auto;padding-bottom:26px}
.page-head{padding:15px 0 11px}
.page-head h2{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.2px;}
.page-head h2::after{
  content:"";display:block;width:38px;height:3px;border-radius:2px;
  background:var(--gold);margin-top:7px;
}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:7px}

/* Medium Switch */
.medium-switch{
  display:flex;gap:8px;margin-bottom:14px;
  background:var(--card);padding:8px;border-radius:12px;
  box-shadow:var(--shadow);
}
.medium-btn{
  flex:1;padding:10px 12px;border-radius:9px;
  background:#f1f5ff;border:1.5px solid #dbe6ff;
  font-size:.85rem;font-weight:800;color:#64748b;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.medium-btn:hover{background:#e4edff;color:#0d2b6b;}
.medium-btn.active{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;border-color:#16409b;
  box-shadow:0 3px 10px rgba(13,43,107,.28);
}

/* Content Type Tabs */
.content-tabs{
  display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;
  background:var(--card);padding:6px;border-radius:12px;
  box-shadow:var(--shadow);
}
.content-tab{
  flex:1;min-width:70px;
  padding:9px 8px;border-radius:9px;
  background:transparent;border:none;
  font-size:.78rem;font-weight:800;color:#64748b;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.content-tab i{font-size:.85rem;}
.content-tab:hover{background:#f1f5ff;color:#0d2b6b;}
.content-tab.active{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;box-shadow:0 3px 10px rgba(13,43,107,.28);
}
.content-tab .cnt{
  background:rgba(255,255,255,.22);
  font-size:.6rem;font-weight:800;
  padding:1px 5px;border-radius:20px;
  min-width:18px;text-align:center;
}
.content-tab.active .cnt{background:#ffc42e;color:#0d2b6b;}
.content-tab.hidden-tab{display:none;}

.section-label{
  font-size:11px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;color:var(--muted);margin:14px 0 9px;
}
.stack{display:flex;flex-direction:column;gap:10px}

.search-box{
  display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:0 12px;
  box-shadow:var(--shadow);transition:border-color .15s, box-shadow .15s;
  margin-bottom:12px;
}
.search-box:focus-within{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(22,64,155,.10)}
.search-box .s-ico{font-size:14px;opacity:.7;flex:none}
.search-box input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  padding:12px 0;font-size:14px;color:var(--text);
}
.search-box input::placeholder{color:#9aa8c4}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none}

.card-icon{
  width:44px;height:44px;flex:none;border-radius:12px;
  display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;
}
.class-card,.item-card{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 13px 13px 15px;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  overflow:hidden;min-height:68px;
}
.class-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#ffd257,#f7b500);
}
.class-card .card-icon{
  background:linear-gradient(135deg,#0d2b6b,#1b4bb5);
  border-color:#1b4bb5;box-shadow:0 3px 8px rgba(13,43,107,.25);color:#fff;
}
.class-card:active,.item-card:active{transform:scale(.985)}
@media(hover:hover){
  .class-card:hover,.item-card:hover{
    transform:translateY(-2px);box-shadow:var(--shadow-hover);
    border-color:var(--border-strong);
  }
  .class-card:hover .card-arrow,.item-card:hover .card-arrow{
    background:var(--gold);color:var(--gold-ink);border-color:var(--gold);
  }
}
.card-text{flex:1;min-width:0}
.card-text h3{
  font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-text span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.card-arrow{
  width:30px;height:30px;flex:none;border-radius:50%;
  display:grid;place-items:center;
  background:#f1f5ff;border:1px solid #e4ebfb;color:var(--navy);
  font-size:14px;font-weight:700;
  transition:background .15s,color .15s,border-color .15s;
}

.chapter-row{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 12px 14px 14px;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  position:relative;overflow:hidden;cursor:pointer;text-decoration:none;
}
.chapter-row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#ffd257,#f7b500);opacity:0;transition:opacity .2s;
}
.chapter-row:hover{
  transform:translateY(-1px);box-shadow:var(--shadow-hover);
  border-color:var(--border-strong);
}
.chapter-row:hover::before{opacity:1;}
.chapter-row:active{transform:scale(.99);}

.ch-num{
  width:34px;height:34px;flex:none;border-radius:10px;
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;color:var(--navy);
  font-size:11.5px;font-weight:800;letter-spacing:.3px;
  display:grid;place-items:center;
}
.ch-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.ch-name{
  font-size:15px;font-weight:800;color:var(--navy);
  line-height:1.3;letter-spacing:-.1px;word-break:break-word;
}
.ch-meta{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.2px;
}
.ch-meta .badge-new-inline{
  background:var(--red-bg);color:var(--red);
  font-size:9px;font-weight:800;letter-spacing:.5px;
  padding:1.5px 5px;border-radius:4px;
}
.ch-meta .badge-lock-inline{
  background:#ffe3ea;color:#e0245e;
  font-size:9px;font-weight:800;letter-spacing:.5px;
  padding:1.5px 5px;border-radius:4px;
  display:inline-flex;align-items:center;gap:3px;
}
.ch-download{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:var(--navy);display:grid;place-items:center;font-size:15px;
  box-shadow:0 3px 8px rgba(247,181,0,.28);
  border:1px solid #f0ad00;transition:all .18s ease;cursor:pointer;
}
.ch-download:hover{
  transform:scale(1.08);box-shadow:0 5px 14px rgba(247,181,0,.45);
  background:linear-gradient(135deg,#ffdf7a,#ffc42e);
}
.ch-download:active{transform:scale(.94);}

@media(min-width:600px){
  .chapter-row{padding:16px 16px 16px 18px;gap:14px;}
  .ch-num{width:38px;height:38px;font-size:12.5px;}
  .ch-name{font-size:16.5px;}
  .ch-meta{font-size:12px;}
  .ch-download{width:42px;height:42px;font-size:16px;}
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:9px 13px;border-radius:10px;border:1px solid transparent;
  font-size:13px;font-weight:700;letter-spacing:.15px;
  white-space:nowrap;cursor:pointer;
  transition:transform .13s ease, box-shadow .15s ease, background .15s ease;
  -webkit-user-select:none;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn-navy{
  background:linear-gradient(135deg,#0d2b6b,#1b4bb5);
  color:#fff;
  box-shadow:0 2px 8px rgba(13,43,107,.28);
}
.btn-gold{
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:var(--gold-ink);
  box-shadow:0 2px 8px rgba(247,181,0,.32);
  border-color:#f0ad00;
}
.btn-block{width:100%;}
.btn-lg{min-height:46px;font-size:13.5px;}

.crumbs{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:12px 0 0;font-size:11.5px;color:var(--muted);
}
.crumbs a{color:var(--navy);font-weight:650}
.crumbs a:active{color:var(--navy-2)}
.crumbs .sep{opacity:.45;font-size:12px}
.crumbs .current{
  color:var(--muted);font-weight:600;max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* PDF viewer */
.pdfjs-viewer{
  margin-top:12px;display:flex;flex-direction:column;
  gap:14px;padding-bottom:24px;
}
.pdf-page{
  background:#fff;border:1px solid var(--border);
  border-radius:8px;overflow:hidden;
  box-shadow:0 3px 12px rgba(13,43,107,.10);
  position:relative;width:100%;
}
.pdf-page canvas{display:block;width:100%;height:auto;background:#fff;}
.pdf-page-num{
  position:absolute;top:8px;right:10px;
  background:rgba(13,43,107,.82);color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.4px;
  padding:3px 9px;border-radius:20px;pointer-events:none;
}
.pdf-loading{
  text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.pdf-loading .spinner-lg{
  width:38px;height:38px;border:3px solid #e3e9f5;
  border-top-color:var(--navy);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.pdf-error{
  background:#ffe3ea;color:#c4114a;
  border:1px solid #ffc9d6;border-radius:12px;
  padding:18px;text-align:center;font-size:13px;
  font-weight:600;margin-top:14px;
}
.pdf-error .btn{margin-top:12px;}

.empty{
  background:var(--card);border:1px dashed var(--border-strong);
  border-radius:var(--radius);padding:22px 16px;text-align:center;
  font-size:13px;color:var(--muted);
}
.empty strong{display:block;color:var(--navy);font-size:14px;margin-bottom:4px;}
.empty .empty-ico{
  font-size:2.8rem;color:#cfdcf5;margin-bottom:12px;display:block;
}
.empty small{display:block;margin-top:8px;color:#8a95ae;font-size:11.5px;}

.sk{
  border-radius:var(--radius);
  background:linear-gradient(90deg,#eef2f9 25%,#e2e9f6 37%,#eef2f9 63%);
  background-size:400% 100%;
  animation:shimmer 1.25s ease-in-out infinite;
}
.sk-card{height:68px}
.sk-chapter{height:72px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}

.app-footer{
  flex:none;margin-top:auto;background:#fff;border-top:1px solid var(--border);
  padding:18px 14px calc(20px + env(safe-area-inset-bottom));
  text-align:center;
}
.app-footer strong{
  display:block;font-size:12.5px;font-weight:800;
  color:var(--navy);letter-spacing:.7px;
}
.app-footer span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;}
.app-footer small{display:block;font-size:11px;color:#93a1bd;margin-top:8px;}

.toast{
  position:fixed;left:50%;bottom:22px;z-index:200;
  transform:translate(-50%,90px);
  background:var(--navy-dark);color:#fff;
  padding:11px 17px;border-radius:11px;
  font-size:12.5px;font-weight:650;
  box-shadow:0 10px 28px rgba(8,31,82,.35);
  border-left:3px solid var(--gold);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
  max-width:92vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* Download Lock Popup */
.popup-overlay{
  position:fixed;inset:0;
  background:rgba(8,31,82,.62);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:18px;opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
.popup-overlay.open{opacity:1;pointer-events:auto;}
.popup-box{
  width:100%;max-width:420px;background:#fff;
  border-radius:20px;overflow:hidden;
  box-shadow:0 25px 70px rgba(8,31,82,.42);
  transform:translateY(18px) scale(.96);
  transition:transform .32s cubic-bezier(.25,.8,.25,1);
}
.popup-overlay.open .popup-box{transform:translateY(0) scale(1);}
.popup-header{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;padding:22px 22px 20px;
  position:relative;border-bottom:3px solid #ffc42e;
}
.popup-header::before{
  content:"";position:absolute;top:-60%;left:-20%;width:60%;height:220%;
  background:radial-gradient(circle,rgba(255,196,46,.18) 0%,transparent 70%);
  pointer-events:none;
}
.popup-icon{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:#0d2b6b;display:grid;place-items:center;font-size:1.5rem;
  margin-bottom:12px;position:relative;z-index:2;
  box-shadow:0 6px 16px rgba(247,181,0,.42);
  border:1px solid rgba(255,255,255,.35);
}
.popup-header h3{
  font-size:1.15rem;font-weight:800;
  letter-spacing:.3px;line-height:1.3;
  position:relative;z-index:2;
}
.popup-header p{
  font-size:.8rem;color:#c3d2f2;margin-top:5px;
  position:relative;z-index:2;line-height:1.4;
}
.popup-close-x{
  position:absolute;top:14px;right:14px;
  width:34px;height:34px;border-radius:9px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);
  color:#fff;font-size:.95rem;
  display:grid;place-items:center;cursor:pointer;
  z-index:5;transition:all .2s;
}
.popup-close-x:hover{
  background:#ffc42e;color:#1a237e;border-color:#ffc42e;
  transform:rotate(90deg);
}
.popup-body{padding:22px;}
.popup-field{margin-bottom:14px;}
.popup-field label{
  display:block;font-size:.72rem;font-weight:800;
  letter-spacing:.9px;text-transform:uppercase;
  color:#5f6f90;margin-bottom:7px;
}
.popup-input-wrap{
  position:relative;display:flex;align-items:center;
  border:2px solid #e3e9f5;border-radius:12px;
  background:#f9fbff;transition:all .2s ease;
}
.popup-input-wrap:focus-within{
  border-color:#16409b;background:#fff;
  box-shadow:0 0 0 4px rgba(22,64,155,.10);
}
.popup-input-wrap .pi-ico{
  padding:0 14px;font-size:1rem;color:#8a95ae;flex-shrink:0;
}
.popup-input-wrap input{
  flex:1;min-width:0;padding:14px 14px 14px 0;
  border:none;outline:none;background:transparent;
  font-size:.95rem;color:#0f2452;font-weight:600;
}
.popup-input-wrap input::placeholder{color:#9aa8c4;font-weight:500;}

.popup-status{
  padding:12px 14px;border-radius:10px;
  font-size:.85rem;font-weight:650;
  margin-top:14px;display:none;
  align-items:center;gap:8px;line-height:1.4;
}
.popup-status.error{
  background:#ffe3ea;color:#c4114a;
  border:1px solid #ffc9d6;display:flex;
}
.popup-status.success{
  background:#e3fcef;color:#0e9f6e;
  border:1px solid #b8f0d4;display:flex;
}
.popup-status.loading{
  background:#eef3ff;color:#16409b;
  border:1px solid #dbe6ff;display:flex;
}
.popup-status .spinner{
  width:15px;height:15px;
  border:2px solid #16409b;
  border-top-color:transparent;
  border-radius:50%;
  animation:spin .75s linear infinite;
  flex-shrink:0;
}
.popup-hint{
  font-size:.75rem;color:#8a95ae;
  margin-top:8px;line-height:1.5;
  display:flex;gap:6px;align-items:flex-start;
}
.popup-hint i{color:#f7b500;font-size:.8rem;margin-top:2px;flex-shrink:0;}
.popup-actions{display:flex;gap:10px;margin-top:18px;}
.popup-btn{
  flex:1;min-height:46px;border-radius:12px;
  font-size:.92rem;font-weight:800;letter-spacing:.3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s ease;border:2px solid transparent;
}
.popup-btn:active{transform:scale(.97);}
.popup-btn.primary{
  background:linear-gradient(135deg,#0d2b6b,#16409b);
  color:#fff;
  box-shadow:0 6px 16px rgba(13,43,107,.32);
}
.popup-btn.primary:hover{
  background:linear-gradient(135deg,#16409b,#1b4bb5);
  transform:translateY(-1px);
}
.popup-btn.ghost{
  background:#fff;border-color:#e3e9f5;
  color:#5f6f90;flex:0 0 auto;min-width:100px;
}
.popup-btn.ghost:hover{
  background:#f5f8ff;border-color:#cfdcf5;color:#0d2b6b;
}

@media(max-width:600px){
  body{font-size:15.5px}
  .page-head h2{font-size:23px}

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   QUEST COACHING — STUDY MATERIAL PORTAL
   Nested structure with medium + 5 content types
   ============================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
  authDomain: "quest-coaching.firebaseapp.com",
  databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quest-coaching",
  storageBucket: "quest-coaching.firebasestorage.app",
  messagingSenderId: "131948734089",
  appId: "1:131948734089:web:f4ba25110c8b1298360858"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const SM_COLLECTION = 'study_materials';
const SUB_SUBCOLLECTION = 'subjects';
const CH_SUBCOLLECTION = 'chapters';

const CONTENT_TYPES = ['notes', 'pyqs', 'test_paper', 'objective', 'subjective'];
const CONTENT_LABELS = {
  notes: 'Notes',
  pyqs: 'PYQs',
  test_paper: 'Test Paper',
  objective: 'Objective',
  subjective: 'Subjective'
};

const $  = (sel, root = document) => root.querySelector(sel);
const app = $('#app');

const esc = (str = '') => String(str).replace(/[&<>"']/g, ch => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
));
const pad2 = n => String(n).padStart(2, '0');
const sanitizeFile = (str = 'document') =>
  str.replace(/[^\w\s\u0900-\u097F-]/g, '').trim().replace(/\s+/g, '_').slice(0, 70) || 'document';

let toastTimer;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

const skeletonCards = (n = 3) =>
  Array.from({ length: n }, () => '<div class="sk sk-card"></div>').join('');
const skeletonChapters = (n = 5) =>
  Array.from({ length: n }, () => '<div class="sk sk-chapter"></div>').join('');

/* ============================================================
   STATE
   ============================================================ */
const state = {
  medium: 'hindi',           // auto-selected
  contentType: 'notes',      // auto-selected
  pendingDownload: null,     // { chapterId, url, filename }
  verifiedStudent: null      // session me verify hone ke baad save hoga
};

/* Load verified student from sessionStorage */
(function restoreSession() {
  try {
    const s = sessionStorage.getItem('qcc_student_verified');
    if (s) state.verifiedStudent = JSON.parse(s);
  } catch(e) {}
})();

/* ============================================================
   DATA SOURCE
   ============================================================ */
const DataSource = {
  _cache: null,

  async _load() {
    if (this._cache) return this._cache;
    try {
      const classesSnap = await db.collection(SM_COLLECTION)
        .orderBy('display_order').get();

      const classes = [];
      for (const classDoc of classesSnap.docs) {
        const classData = classDoc.data();
        const cls = {
          id: classDoc.id,
          name: classData.name || classDoc.id,
          display_order: classData.display_order || 0,
          subjects: []
        };

        const subjectsSnap = await db.collection(SM_COLLECTION).doc(classDoc.id)
          .collection(SUB_SUBCOLLECTION)
          .orderBy('display_order')
          .get();

        for (const subjectDoc of subjectsSnap.docs) {
          const subjectData = subjectDoc.data();
          const subj = {
            id: subjectDoc.id,
            name: subjectData.name || subjectDoc.id,
            icon: subjectData.icon || '📘',
            display_order: subjectData.display_order || 0,
            chapters: []
          };

          const chaptersSnap = await db.collection(SM_COLLECTION).doc(classDoc.id)
            .collection(SUB_SUBCOLLECTION).doc(subjectDoc.id)
            .collection(CH_SUBCOLLECTION)
            .orderBy('display_order')
            .get();

          chaptersSnap.forEach(chDoc => {
            const chData = chDoc.data();
            if (chData.is_published === false) return;

            // 🔥 Migration: purana pdf_path ko mediums.hindi.notes me convert
            if (chData.pdf_path && !chData.mediums) {
              chData.mediums = {
                hindi: {
                  notes: {
                    pdf_path: chData.pdf_path,
                    download_locked: false
                  }
                }
              };
            }

            subj.chapters.push({
              id: chDoc.id,
              name: chData.name || '',
              chapter_number: chData.chapter_number || 0,
              display_order: chData.display_order || 0,
              is_new: chData.is_new || false,
              is_published: chData.is_published !== false,
              mediums: chData.mediums || {}
            });
          });

          cls.subjects.push(subj);
        }

        classes.push(cls);
      }

      this._cache = classes;
    } catch (err) {
      console.warn('study_materials fetch failed:', err.message);
      this._cache = [];
    }
    return this._cache;
  },

  async getClasses() {
    const classes = await this._load();
    return [...classes].sort((a,b) => (a.display_order||0) - (b.display_order||0));
  },

  async getClass(id) {
    const list = await this.getClasses();
    return list.find(c => c.id === id) || null;
  },

  async getSubjectsWithCounts(classId) {
    const cls = await this.getClass(classId);
    if (!cls) return [];
    return [...(cls.subjects || [])]
      .sort((a,b) => (a.display_order||0) - (b.display_order||0))
      .map(s => ({
        ...s,
        class_id: cls.id,
        chapter_count: (s.chapters || []).filter(ch =>
          (ch.mediums?.[state.medium]?.[state.contentType]?.pdf_path)
        ).length
      }));
  },

  async getSubject(classId, subjectId) {
    const cls = await this.getClass(classId);
    if (!cls) return null;
    const s = (cls.subjects || []).find(x => x.id === subjectId);
    return s ? { ...s, class_id: cls.id } : null;
  },

  async getChaptersBySubject(classId, subjectId) {
    const s = await this.getSubject(classId, subjectId);
    if (!s) return [];
    // Only chapters that have content for current medium + type
    return [...(s.chapters || [])]
      .filter(ch => ch.mediums?.[state.medium]?.[state.contentType]?.pdf_path)
      .sort((a,b) => (a.display_order||0) - (b.display_order||0));
  },

  async getChapterContext(classId, subjectId, chapterId) {
    const cls = await this.getClass(classId);
    if (!cls) return null;
    const subject = (cls.subjects || []).find(s => s.id === subjectId);
    if (!subject) return null;
    const chapter = (subject.chapters || []).find(c => c.id === chapterId);
    if (!chapter) return null;
    return { chapter, subject, cls };
  },

  async search(query) {
    const q = String(query || '').trim().toLowerCase();
    if (!q) return [];
    const classes = await this.getClasses();
    const results = [];
    classes.forEach(cls => {
      (cls.subjects || []).forEach(subject => {
        (subject.chapters || []).forEach(ch => {
          // Only if current medium + type has content
          const content = ch.mediums?.[state.medium]?.[state.contentType];
          if (!content || !content.pdf_path) return;
          const nameHit = ch.name.toLowerCase().includes(q);
          const subjectHit = subject.name.toLowerCase().includes(q);
          if (!nameHit && !subjectHit) return;
          results.push({
            classId: cls.id, className: cls.name,
            subjectId: subject.id, subjectName: subject.name,
            subjectIcon: subject.icon || '📘',
            chapterId: ch.id, chapterName: ch.name,
            score: nameHit ? ch.name.toLowerCase().indexOf(q) : 100 + subject.name.toLowerCase().indexOf(q)
          });
        });
      });
    });
    return results.sort((a,b) => a.score - b.score).slice(0, 40);
  }
};

/* ============================================================
   PDF RESOLUTION
   ============================================================ */
function getChapterContent(chapter) {
  return chapter?.mediums?.[state.medium]?.[state.contentType] || null;
}

function resolvePdfUrl(chapter) {
  const content = getChapterContent(chapter);
  if (content?.pdf_path && /^https?:\/\//i.test(content.pdf_path)) return content.pdf_path;
  return null;
}

function isDownloadLocked(chapter) {
  const content = getChapterContent(chapter);
  return content?.download_locked === true;
}

const pdfDataCache = new Map();
async function fetchPdfData(chapter) {
  if (pdfDataCache.has(chapter.id)) {
    return pdfDataCache.get(chapter.id).slice(0);
  }
  const url = resolvePdfUrl(chapter);
  if (!url) throw new Error('Is chapter ka PDF abhi upload nahi hua hai.');
  const res = await fetch(url);
  if (!res.ok) throw new Error('PDF fetch failed: ' + res.status);
  const buffer = await res.arrayBuffer();
  pdfDataCache.set(chapter.id, buffer);
  return buffer.slice(0);
}

/* ============================================================
   ROUTER
   ============================================================ */
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, '');
  const p = raw.split('/').filter(Boolean);
  if (p[0] === 'class' && p[2] === 'subject' && p[4] === 'chapter' && p[5]) {
    return { name:'chapter', classId:p[1], subjectId:p[3], chapterId:p[5] };
  }
  if (p[0] === 'class' && p[2] === 'subject' && p[3]) {
    return { name:'subject', classId:p[1], subjectId:p[3] };
  }
  if (p[0] === 'class' && p[1]) {
    return { name:'class', classId:p[1] };
  }
  return { name:'home' };
}

async function router() {
  const route = parseRoute();
  window.scrollTo(0, 0);
  const backBtn = $('#headerBackBtn');
  if (route.name === 'home') backBtn.classList.add('hidden');
  else backBtn.classList.remove('hidden');

  try {
    if (route.name === 'home')         await renderHome();
    else if (route.name === 'class')   await renderClassPage(route.classId);
    else if (route.name === 'subject') await renderSubjectPage(route.classId, route.subjectId);
    else                                await renderChapterPage(route.classId, route.subjectId, route.chapterId);
  } catch (err) {
    console.error('[Study Portal]', err);
    app.innerHTML = `<div class="page-head"><h2>Something went wrong</h2>
      <p>Please check your connection and try again.</p></div>
      <div class="empty"><strong>Unable to load study material</strong>
      <button class="btn btn-navy" style="margin-top:12px" onclick="location.reload()">Retry</button></div>`;
  }
}

function goBack() {
  const route = parseRoute();
  if (route.name === 'chapter') location.hash = `#/class/${route.classId}/subject/${route.subjectId}`;
  else if (route.name === 'subject') location.hash = `#/class/${route.classId}`;
  else if (route.name === 'class') location.hash = '#/';
  else history.back();
}

function crumbsHTML(items) {
  return `<nav class="crumbs" aria-label="Breadcrumb">${items.map((item, i) => `
    ${i ? '<span class="sep">›</span>' : ''}
    ${item.href
      ? `<a href="${item.href}">${esc(item.label)}</a>`
      : `<span class="current">${esc(item.label)}</span>`}
  `).join('')}</nav>`;
}

/* ============================================================
   MEDIUM & CONTENT SWITCH HELPERS
   ============================================================ */
function mediumSwitchHTML() {
  return `
    <div class="medium-switch">
      <button class="medium-btn ${state.medium==='hindi'?'active':''}" onclick="setMedium('hindi')">
        <i class="fas fa-om"></i> हिंदी
      </button>
      <button class="medium-btn ${state.medium==='english'?'active':''}" onclick="setMedium('english')">
        <i class="fas fa-globe"></i> English
      </button>
    </div>
  `;
}

function contentTabsHTML() {
  return `
    <div class="content-tabs">
      ${CONTENT_TYPES.map(t => `
        <button class="content-tab ${state.contentType===t?'active':''}" onclick="setContentType('${t}')">
          <i class="fas fa-${contentIcon(t)}"></i> ${CONTENT_LABELS[t]}
        </button>
      `).join('')}
    </div>
  `;
}

function contentIcon(t) {
  return {
    notes: 'book',
    pyqs: 'history',
    test_paper: 'file-signature',
    objective: 'check-square',
    subjective: 'pen-fancy'
  }[t] || 'file';
}

window.setMedium = function(m) {
  if (state.medium === m) return;
  state.medium = m;
  // Clear PDF cache (medium change se different PDFs)
  pdfDataCache.clear();
  router();
};

window.setContentType = function(t) {
  if (state.contentType === t) return;
  state.contentType = t;
  pdfDataCache.clear();
  router();
};

/* ============================================================
   HOME
   ============================================================ */
async function renderHome() {
  app.innerHTML = `
    <div class="page-head">
      <h2>Study Material</h2>
      <p>Select your class to get started</p>
    </div>
    ${mediumSwitchHTML()}
    ${contentTabsHTML()}
    <div class="search-box">
      <span class="s-ico" aria-hidden="true">🔍</span>
      <input id="searchInput" type="search" inputmode="search"
             placeholder="Search ${CONTENT_LABELS[state.contentType]} or Subject" autocomplete="off" />
    </div>
    <div id="searchResults" class="stack" style="margin-top:12px"></div>
    <div id="classSection">
      <div class="section-label">Select Your Class</div>
      <div class="stack" id="classList">${skeletonCards(2)}</div>
    </div>
  `;

  const classes = await DataSource.getClasses();
  const list = $('#classList');
  if (!list) return;

  // Filter classes that have at least 1 chapter with current medium+type content
  const classesWithContent = [];
  for (const cls of classes) {
    let hasAny = false;
    for (const s of (cls.subjects || [])) {
      for (const ch of (s.chapters || [])) {
        if (ch.mediums?.[state.medium]?.[state.contentType]?.pdf_path) {
          hasAny = true; break;
        }
      }
      if (hasAny) break;
    }
    if (hasAny) classesWithContent.push(cls);
  }

  if (!classesWithContent.length) {
    list.innerHTML = `<div class="empty">
      <span class="empty-ico"><i class="fas fa-book-open"></i></span>
      <strong>${CONTENT_LABELS[state.contentType]} Coming Soon</strong>
      Abhi is medium me ${CONTENT_LABELS[state.contentType]} upload nahi hua hai.<br>
      <small>Thodi der baad check karein ya doosra content type try karein.</small>
    </div>`;
    return;
  }

  list.innerHTML = classesWithContent.map(cls => `
    <a class="class-card" href="#/class/${cls.id}">
      <div class="card-icon" aria-hidden="true">📚</div>
      <div class="card-text">
        <h3>${esc(cls.name)}</h3>
        <span>${CONTENT_LABELS[state.contentType]} · ${state.medium === 'hindi' ? 'हिंदी' : 'English'}</span>
      </div>
      <div class="card-arrow" aria-hidden="true">→</div>
    </a>
  `).join('');
}

let searchTimer;
app.addEventListener('input', e => {
  if (e.target.id !== 'searchInput') return;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(e.target.value.trim()), 170);
});

async function runSearch(query) {
  const resultsBox = $('#searchResults');
  const classSection = $('#classSection');
  if (!resultsBox || !classSection) return;
  if (!query) {
    resultsBox.innerHTML = '';
    classSection.style.display = '';
    return;
  }
  classSection.style.display = 'none';
  resultsBox.innerHTML = '<div class="sk sk-card"></div>';
  const results = await DataSource.search(query);
  if ($('#searchInput')?.value.trim() !== query) return;
  if (!results.length) {
    resultsBox.innerHTML = `<div class="empty">
      <strong>No results found</strong>
      Nothing matched "${esc(query)}". Try another name.
    </div>`;
    return;
  }
  resultsBox.innerHTML = results.map(r => `
    <a class="item-card" href="#/class/${r.classId}/subject/${r.subjectId}/chapter/${r.chapterId}">
      <div class="card-icon" aria-hidden="true">${r.subjectIcon}</div>
      <div class="card-text">
        <h3>${esc(r.chapterName)}</h3>
        <span>${esc(r.className)} · ${esc(r.subjectName)}</span>
      </div>
      <div class="card-arrow" aria-hidden="true">→</div>
    </a>
  `).join('');
}

/* ============================================================
   CLASS PAGE
   ============================================================ */
async function renderClassPage(classId) {
  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label:'Class' }])}
    ${mediumSwitchHTML()}
    ${contentTabsHTML()}
    <div class="page-head"><h2>Loading…</h2></div>
    <div class="stack">${skeletonCards(4)}</div>
  `;
  const cls = await DataSource.getClass(classId);
  if (!cls) {
    app.innerHTML = crumbsHTML([{ label:'Home', href:'#/' }]) +
      `<div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-school"></i></span>
        <strong>Class not found</strong>
      </div>`;
    return;
  }
  const subjects = await DataSource.getSubjectsWithCounts(classId);

  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label: cls.name }])}
    ${mediumSwitchHTML()}
    ${contentTabsHTML()}
    <div class="page-head">
      <h2>${esc(cls.name)}</h2>
      <p>${CONTENT_LABELS[state.contentType]} · Select a subject</p>
    </div>
    <div class="stack">
      ${subjects.filter(s => s.chapter_count > 0).length ? subjects.filter(s => s.chapter_count > 0).map(s => `
        <a class="item-card" href="#/class/${cls.id}/subject/${s.id}">
          <div class="card-icon" aria-hidden="true">${s.icon || '📘'}</div>
          <div class="card-text">
            <h3>${esc(s.name)}</h3>
            <span>${s.chapter_count} ${CONTENT_LABELS[state.contentType]}</span>
          </div>
          <div class="card-arrow" aria-hidden="true">→</div>
        </a>
      `).join('') : `<div class="empty">
        <span class="empty-ico"><i class="fas fa-book"></i></span>
        <strong>No ${CONTENT_LABELS[state.contentType]} yet</strong>
        Is class me abhi ${CONTENT_LABELS[state.contentType]} upload nahi hua.
      </div>`}
    </div>
  `;
}

/* ============================================================
   SUBJECT PAGE
   ============================================================ */
async function renderSubjectPage(classId, subjectId) {
  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label:'Class' }, { label:'Subject' }])}
    ${mediumSwitchHTML()}
    ${contentTabsHTML()}
    <div class="page-head"><h2>Loading…</h2></div>
    <div class="stack">${skeletonChapters(6)}</div>
  `;
  const [cls, subject] = await Promise.all([
    DataSource.getClass(classId), DataSource.getSubject(classId, subjectId)
  ]);
  if (!cls || !subject) {
    app.innerHTML = crumbsHTML([{ label:'Home', href:'#/' }]) +
      `<div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-book"></i></span>
        <strong>Subject not found</strong>
      </div>`;
    return;
  }
  const chapters = await DataSource.getChaptersBySubject(classId, subjectId);

  app.innerHTML = `
    ${crumbsHTML([
      { label:'Home', href:'#/' },
      { label: cls.name, href:`#/class/${cls.id}` },
      { label: subject.name }
    ])}
    ${mediumSwitchHTML()}
    ${contentTabsHTML()}
    <div class="page-head">
      <h2>${esc(cls.name)} ${esc(subject.name)}</h2>
      <p>${CONTENT_LABELS[state.contentType]} · ${chapters.length} available</p>
    </div>
    <div class="section-label" style="margin-top:4px">${CONTENT_LABELS[state.contentType]}</div>
    <div class="stack">
      ${chapters.length ? chapters.map(ch => {
        const previewHref = `#/class/${cls.id}/subject/${subject.id}/chapter/${ch.id}`;
        const locked = isDownloadLocked(ch);
        return `
          <div class="chapter-row" data-preview-href="${previewHref}">
            <div class="ch-num" aria-hidden="true">${pad2(ch.chapter_number)}</div>
            <div class="ch-body">
              <div class="ch-name">${esc(ch.name)}</div>
              <div class="ch-meta">
                <span>Chapter ${pad2(ch.chapter_number)}</span>
                ${ch.is_new ? '<span class="badge-new-inline">NEW</span>' : ''}
                ${locked ? '<span class="badge-lock-inline"><i class="fas fa-lock"></i> Locked</span>' : ''}
              </div>
            </div>
            <button class="ch-download" type="button" data-download="${ch.id}" aria-label="Download PDF">
              <i class="fas fa-download"></i>
            </button>
          </div>
        `;
      }).join('') : `<div class="empty">
        <span class="empty-ico"><i class="fas fa-file-alt"></i></span>
        <strong>No ${CONTENT_LABELS[state.contentType]} yet</strong>
        Is subject me abhi upload nahi hua.
      </div>`}
    </div>
  `;
}

/* ============================================================
   CHAPTER PAGE — PDF.js viewer
   ============================================================ */
async function renderChapterPage(classId, subjectId, chapterId) {
  app.innerHTML = `
    ${crumbsHTML([{ label:'Home', href:'#/' }, { label:'Loading…' }])}
    <div class="sk" style="height:120px;border-radius:14px;margin-top:12px"></div>
  `;
  const ctx = await DataSource.getChapterContext(classId, subjectId, chapterId);
  if (!ctx || !ctx.chapter) {
    app.innerHTML = crumbsHTML([{ label:'Home', href:'#/' }]) +
      `<div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-file-alt"></i></span>
        <strong>Chapter not found</strong>
      </div>`;
    return;
  }
  const { chapter, subject, cls } = ctx;
  const subjectHref = `#/class/${cls.id}/subject/${subject.id}`;

  if (!resolvePdfUrl(chapter)) {
    app.innerHTML = `
      ${crumbsHTML([
        { label:'Home', href:'#/' },
        { label: cls.name, href:`#/class/${cls.id}` },
        { label: subject.name, href: subjectHref },
        { label: `Ch ${pad2(chapter.chapter_number)}` }
      ])}
      <div class="empty" style="margin-top:16px">
        <span class="empty-ico"><i class="fas fa-file-pdf"></i></span>
        <strong>PDF abhi upload nahi hua</strong>
        ${esc(chapter.name)} ka PDF abhi upload nahi kiya gaya.
      </div>
    `;
    return;
  }

  const locked = isDownloadLocked(chapter);
  const contentLabel = CONTENT_LABELS[state.contentType];
  const mediumLabel = state.medium === 'hindi' ? 'हिंदी मीडियम' : 'English Medium';

  app.innerHTML = `
    ${crumbsHTML([
      { label:'Home', href:'#/' },
      { label: cls.name, href:`#/class/${cls.id}` },
      { label: subject.name, href: subjectHref },
      { label: `Ch ${pad2(chapter.chapter_number)}` }
    ])}
    <div class="page-head" style="padding:12px 0 10px;">
      <h2 style="font-size:17px;">${esc(chapter.name)}</h2>
      <p>${contentLabel} · ${mediumLabel}</p>
    </div>
    <div style="margin-bottom:14px;">
      <button class="btn btn-gold btn-block btn-lg" onclick="handleDownloadClick('${chapter.id}')">
        <i class="fas fa-${locked ? 'lock' : 'download'}"></i>
        ${locked ? 'Verify & Download PDF' : 'DOWNLOAD PDF'}
      </button>
    </div>
    <div class="pdfjs-viewer" id="pdfViewer">
      <div class="pdf-loading" id="pdfLoading">
        <div class="spinner-lg"></div>
        <span>Loading PDF pages…</span>
      </div>
    </div>
  `;

  renderPdfPages(chapter);
}

async function renderPdfPages(chapter) {
  const viewer = document.getElementById('pdfViewer');
  if (!viewer) return;

  try {
    if (!window.pdfjsLib) throw new Error('PDF.js library not loaded');
    const buffer = await fetchPdfData(chapter);
    const loadingTask = pdfjsLib.getDocument({ data: buffer });
    const pdf = await loadingTask.promise;

    const loadingEl = document.getElementById('pdfLoading');
    if (loadingEl) loadingEl.remove();

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const container = viewer;
      const containerWidth = container.clientWidth || window.innerWidth - 28;
      const unscaledViewport = page.getViewport({ scale: 1 });
      const scale = (containerWidth - 2) / unscaledViewport.width;
      const viewport = page.getViewport({ scale });

      const pageWrap = document.createElement('div');
      pageWrap.className = 'pdf-page';
      pageWrap.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

      const numBadge = document.createElement('div');
      numBadge.className = 'pdf-page-num';
      numBadge.textContent = `${pageNum} / ${pdf.numPages}`;
      pageWrap.appendChild(numBadge);

      const canvas = document.createElement('canvas');
      const ctx2d = canvas.getContext('2d');

      const outputScale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + 'px';
      canvas.style.height = Math.floor(viewport.height) + 'px';

      const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

      pageWrap.appendChild(canvas);
      viewer.appendChild(pageWrap);

      await page.render({ canvasContext: ctx2d, viewport, transform }).promise;
    }
  } catch (err) {
    console.error('[PDF.js] render failed:', err);
    pdfDataCache.delete(chapter.id);
    viewer.innerHTML = `
      <div class="pdf-error">
        <div>⚠️ PDF load nahi ho paya</div>
        <p style="margin-top:8px;font-weight:500;color:#7a2040;font-size:12.5px;">
          ${esc(err.message || 'Unknown error')}
        </p>
        <button class="btn btn-navy" onclick="retryPdfRender('${chapter.id}')">
          <i class="fas fa-redo"></i> Retry
        </button>
      </div>
    `;
  }
}

window.retryPdfRender = function(chapterId) {
  const route = parseRoute();
  if (route.name !== 'chapter') return;
  pdfDataCache.delete(chapterId);
  DataSource.getChapterContext(route.classId, route.subjectId, route.chapterId).then(ctx => {
    if (ctx && ctx.chapter) {
      const viewer = document.getElementById('pdfViewer');
      if (viewer) {
        viewer.innerHTML = `
          <div class="pdf-loading" id="pdfLoading">
            <div class="spinner-lg"></div>
            <span>Loading PDF pages…</span>
          </div>
        `;
      }
      renderPdfPages(ctx.chapter);
    }
  });
};

let resizeTimer;
window.addEventListener('resize', () => {
  if (!location.hash.includes('/chapter/')) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const route = parseRoute();
    if (route.name === 'chapter') renderChapterPage(route.classId, route.subjectId, route.chapterId);
  }, 400);
});

/* ============================================================
   DOWNLOAD HANDLERS
   ============================================================ */
document.addEventListener('click', e => {
  const dlBtn = e.target.closest('[data-download]');
  if (dlBtn) {
    e.preventDefault();
    e.stopPropagation();
    handleDownloadClick(dlBtn.dataset.download);
    return;
  }
  const row = e.target.closest('.chapter-row[data-preview-href]');
  if (row) {
    e.preventDefault();
    location.hash = row.dataset.previewHref.replace(/^#/, '');
  }
});

window.handleDownloadClick = async function(chapterId) {
  try {
    // Find chapter
    let chapter = null;
    const classes = await DataSource.getClasses();
    outer:
    for (const cls of classes) {
      for (const s of (cls.subjects || [])) {
        for (const ch of (s.chapters || [])) {
          if (ch.id === chapterId) { chapter = ch; break outer; }
        }
      }
    }
    if (!chapter) return toast('Chapter not found');

    const url = resolvePdfUrl(chapter);
    if (!url) return toast('PDF abhi upload nahi hua');

    const filename = sanitizeFile(chapter.name) + '.pdf';
    const locked = isDownloadLocked(chapter);

    if (!locked) {
      // Direct download
      triggerDownload(url, filename);
      toast('Download started ✓');
      return;
    }

    // Locked — check session first
    if (state.verifiedStudent) {
      // Already verified in this session
      triggerDownload(url, filename);
      toast('Download started ✓');
      return;
    }

    // Need to open lock popup
    state.pendingDownload = { chapterId, url, filename };
    openLockPopup();
  } catch (err) {
    console.error('[Download]', err);
    toast('Download failed. Please try again.');
  }
};

function triggerDownload(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.target = '_blank';
  link.rel = 'noopener';
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  link.remove();
}

/* ============================================================
   LOCK POPUP — Roll + Reg verification
   ============================================================ */
function openLockPopup() {
  document.getElementById('lockPopup').classList.add('open');
  document.getElementById('lockRollInput').value = '';
  document.getElementById('lockRegInput').value = '';
  document.getElementById('lockStatus').className = 'popup-status';
  document.getElementById('lockStatus').textContent = '';
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('lockRollInput').focus(), 320);
}

function closeLockPopup() {
  document.getElementById('lockPopup').classList.remove('open');
  document.body.style.overflow = '';
  state.pendingDownload = null;
}

window.openLockPopup = openLockPopup;
window.closeLockPopup = closeLockPopup;

function setLockStatus(type, message) {
  const el = document.getElementById('lockStatus');
  el.className = 'popup-status ' + type;
  if (type === 'loading') {
    el.innerHTML = '<span class="spinner"></span><span>' + message + '</span>';
  } else {
    const icon = type === 'error' ? 'exclamation-circle' : 'check-circle';
    el.innerHTML = `<i class="fas fa-${icon}"></i><span>${message}</span>`;
  }
}

window.submitLockVerification = async function() {
  const roll = document.getElementById('lockRollInput').value.trim();
  const reg = document.getElementById('lockRegInput').value.trim();

  if (!roll) {
    setLockStatus('error', 'Please enter Roll Number');
    document.getElementById('lockRollInput').focus();
    return;
  }
  if (!reg) {
    setLockStatus('error', 'Please enter Registration Number');
    document.getElementById('lockRegInput').focus();
    return;
  }

  setLockStatus('loading', 'Verifying your details…');
  const btn = document.getElementById('lockSubmitBtn');
  btn.disabled = true;

  try {
    // Query admissions collection
    const snap = await db.collection('admissions')
      .where('rollNumber', '==', roll)
      .where('admissionNo', '==', reg)
      .limit(1)
      .get();

    if (snap.empty) {
      setLockStatus('error', 'Details match nahi hui. Roll No aur Reg No sahi check karein.');
      btn.disabled = false;
      return;
    }

    const studentData = snap.docs[0].data();

    // Save to session
    state.verifiedStudent = {
      rollNumber: roll,
      admissionNo: reg,
      name: studentData.studentName || '',
      verifiedAt: Date.now()
    };
    try {
      sessionStorage.setItem('qcc_student_verified', JSON.stringify(state.verifiedStudent));
    } catch(e) {}

    setLockStatus('success', `✓ Verified! ${studentData.studentName || 'Welcome'}`);

    // Trigger download after short delay
    const pending = state.pendingDownload;
    setTimeout(() => {
      closeLockPopup();
      if (pending) {
        triggerDownload(pending.url, pending.filename);
        toast('Download started ✓');
      }
    }, 800);
  } catch (err) {
    console.error('Verification error:', err);
    setLockStatus('error', 'Verification failed. Please try again.');
  } finally {
    btn.disabled = false;
  }
};

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('hashchange', router);
router();
</script>
