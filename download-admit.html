<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Admit Card - Quest Coaching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      min-height:100vh;
      padding:30px 20px;
    }
    .container { max-width:800px; margin:0 auto; }
    .header {
      background: white;
      border-radius:20px;
      padding:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      margin-bottom:25px;
    }
    .header h1 { color:#1a237e; font-size:1.8rem; }
    .header h1 i { color:#10b981; }
    .header p { color:#64748b; margin-top:8px; }
    
    .back-btn {
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#64748b;
      color:white;
      padding:10px 20px;
      border:none;
      border-radius:50px;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      margin-bottom:20px;
      transition:0.2s;
    }
    .back-btn:hover { background:#475569; transform:translateY(-2px); }
    
    .exam-list-card {
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }
    .exam-list-card h2 {
      color:#1a237e;
      margin-bottom:15px;
      font-size:1.2rem;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .exam-item {
      background:#f8fafc;
      padding:15px 20px;
      border-radius:12px;
      margin-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid #e2e8f0;
      transition:0.2s;
      cursor:pointer;
    }
    .exam-item:hover { border-color:#10b981; background:#f0fdf4; }
    .exam-item .exam-info { display:flex; flex-direction:column; gap:3px; }
    .exam-item .exam-name { font-weight:700; color:#1a237e; font-size:1rem; }
    .exam-item .exam-meta { font-size:0.8rem; color:#64748b; }
    .exam-item .arrow { color:#10b981; font-size:1.2rem; }
    
    .loading { text-align:center; padding:40px; }
    .loading .spinner {
      width:40px; height:40px;
      border:4px solid #f3f3f3;
      border-top:4px solid #1a237e;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin:0 auto 15px;
    }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    
    .no-data { text-align:center; padding:40px; color:#64748b; }
    .no-data i { font-size:40px; color:#cbd5e1; margin-bottom:15px; display:block; }

    /* SweetAlert Custom Override */
    .swal2-popup {
      border-radius: 20px !important;
      padding: 25px !important;
    }
    .swal2-input {
      border: 2px solid #d1d5db !important;
      border-radius: 10px !important;
      padding: 12px 15px !important;
      font-size: 1rem !important;
      width: 100% !important;
      max-width: 280px !important;
      margin: 10px auto !important;
    }
    .swal2-input:focus {
      border-color: #10b981 !important;
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.2) !important;
    }
    .swal2-confirm {
      background: #10b981 !important;
      border-radius: 10px !important;
      padding: 10px 30px !important;
      font-weight: 600 !important;
    }
    .swal2-confirm:hover {
      background: #059669 !important;
    }
    .swal2-cancel {
      background: #64748b !important;
      border-radius: 10px !important;
      padding: 10px 30px !important;
      font-weight: 600 !important;
    }
    .swal2-cancel:hover {
      background: #475569 !important;
    }
    .swal2-title {
      color: #1a237e !important;
      font-size: 1.3rem !important;
    }
    .swal2-html-container {
      color: #64748b !important;
      font-size: 0.95rem !important;
    }
  </style>
</head>
<body>
<div class="container">
  <button class="back-btn" onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i> Back to Home
  </button>
  
  <div class="header">
    <h1><i class="fas fa-download"></i> Download Admit Card</h1>
    <p>Select your exam and enter your roll number</p>
  </div>
  
  <div class="exam-list-card">
    <h2><i class="fas fa-list"></i> Available Exams</h2>
    <div id="examList">
      <div class="loading"><div class="spinner"></div><p>Loading exams...</p></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
  authDomain: "quest-coaching.firebaseapp.com",
  projectId: "quest-coaching",
  storageBucket: "quest-coaching.firebasestorage.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allExams = [];

async function loadExams() {
  try {
    const snapshot = await db.collection('admit_cards').get();
    const cards = [];
    snapshot.forEach(doc => { cards.push({ id: doc.id, ...doc.data() }); });
    
    // Group by exam
    const examGroups = {};
    cards.forEach(card => {
      const key = card.examName || 'Unknown Exam';
      if (!examGroups[key]) {
        examGroups[key] = {
          examName: key,
          studentClass: card.studentClass || 'N/A',
          students: []
        };
      }
      examGroups[key].students.push(card);
    });
    
    allExams = Object.keys(examGroups).map(key => examGroups[key]);
    displayExams(allExams);
  } catch (error) {
    console.error('Error loading exams:', error);
    document.getElementById('examList').innerHTML = `
      <div class="no-data">
        <i class="fas fa-exclamation-circle"></i>
        <p>Error loading exams. Please try again.</p>
      </div>
    `;
  }
}

function displayExams(exams) {
  const container = document.getElementById('examList');
  if (exams.length === 0) {
    container.innerHTML = `
      <div class="no-data">
        <i class="fas fa-id-card"></i>
        <p>No admit cards available yet.</p>
      </div>
    `;
    return;
  }
  
  let html = '';
  exams.forEach(exam => {
    html += `
      <div class="exam-item" onclick="showRollNumberDialog('${exam.examName}', '${exam.studentClass}')">
        <div class="exam-info">
          <div class="exam-name"><i class="fas fa-file-alt" style="color:#10b981;margin-right:8px;"></i>${exam.examName}</div>
          <div class="exam-meta"><i class="fas fa-graduation-cap"></i> Class: ${exam.studentClass}</div>
        </div>
        <i class="fas fa-chevron-right arrow"></i>
      </div>
    `;
  });
  container.innerHTML = html;
}

function showRollNumberDialog(examName, studentClass) {
  // Find the exam data
  const examData = allExams.find(e => e.examName === examName && e.studentClass === studentClass);
  if (!examData) {
    Swal.fire({
      icon: 'error',
      title: 'Error!',
      text: 'Exam data not found!',
      confirmButtonColor: '#dc2626'
    });
    return;
  }

  // Show SweetAlert dialog with roll number input
  Swal.fire({
    title: `<i class="fas fa-id-card" style="color:#10b981;margin-right:10px;"></i> ${examName}`,
    html: `
      <p style="margin-bottom:12px;color:#64748b;">Enter your roll number to download admit card</p>
      <input type="text" id="rollNumberInput" class="swal2-input" placeholder="Enter Roll Number" autofocus>
    `,
    showCancelButton: true,
    confirmButtonText: '<i class="fas fa-search"></i> Get Admit Card',
    cancelButtonText: '<i class="fas fa-times"></i> Cancel',
    confirmButtonColor: '#10b981',
    cancelButtonColor: '#64748b',
    preConfirm: () => {
      const rollNo = document.getElementById('rollNumberInput').value.trim();
      if (!rollNo) {
        Swal.showValidationMessage('Please enter your roll number!');
        return false;
      }
      return rollNo;
    }
  }).then((result) => {
    if (result.isConfirmed && result.value) {
      const rollNo = result.value;
      // Find student in selected exam
      const student = examData.students.find(s => String(s.rollNumber) === String(rollNo));
      if (!student) {
        Swal.fire({
          icon: 'error',
          title: 'Student Not Found!',
          text: `Roll number "${rollNo}" not found in ${examName}`,
          confirmButtonColor: '#dc2626'
        });
        return;
      }
      // Open admit card view
      window.open(`view-card.html?id=${student.id}`, '_blank');
    }
  });

  // Focus on input when dialog opens
  setTimeout(() => {
    const input = document.getElementById('rollNumberInput');
    if (input) input.focus();
  }, 300);
}

// Load exams on page load
document.addEventListener('DOMContentLoaded', loadExams);
</script>
</body>
</html>
