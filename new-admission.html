        /* Public View Card Styles - No login required */

        }

            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;

        .institution-name h1 { color: white; font-size: 32px; letter-spacing: 2px; margin-bottom: 5px; }
        .institution-name .tagline { color: #c5a059; font-size: 13px; letter-spacing: 2px; margin-bottom: 5px; }

        .contact-item-card i { color: #c5a059; }
        
        .title-banner { text-align: center; padding: 20px 0 10px 0; background: white; }
        .title-banner h2 { font-size: 28px; color: #1a3a5c; letter-spacing: 3px; display: inline-block; position: relative; }
        .title-banner h2:before, .title-banner h2:after { content: "✦"; color: #c5a059; font-size: 20px; position: absolute; top: 50%; transform: translateY(-50%); }
        .title-banner h2:before { left: -35px; }
        .title-banner h2:after { right: -35px; }

            display: flex;
            gap: 25px;
            padding: 0 30px 20px 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .photo-card { width: 130px; height: 150px; border: 3px solid #c5a059; border-radius: 12px; overflow: hidden; background: #f5f5f5; display: flex; align-items: center; justify-content: center; }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-group {

            background: #f8f9fc;
            border-radius: 12px;
            padding: 15px 20px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;

        .info-row-center {

            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px dashed #e2e8f0;
            text-align: center;

        .info-value-center { font-weight: 600; color: #1a3a5c; font-size: 13px; width: 55%; text-align: left; }
        .adm-no-center { color: #d9534f; font-size: 14px; }

        .qr-label-card { background: #c5a059; color: white; font-size: 10px; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        
        .details-section { padding: 0 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; margin-bottom: 25px; }
        .detail-box { background: #f8f9fc; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        .detail-title { background: #1a3a5c; color: white; padding: 12px 18px; font-size: 14px; font-weight: 700; }
        .detail-content { padding: 18px; }

        .detail-table td:last-child { color: #1a3a5c; }

        .terms-col { list-style: none; padding: 0; margin: 0; }
        .terms-col li { margin-bottom: 8px; font-size: 10.5px; line-height: 1.4; color: #333; text-align: left; }

        .quote-text { font-size: 12px; font-style: italic; color: #2c3e50; }
        .quote-author { font-size: 11px; font-weight: 700; color: #c5a059; margin-top: 5px; display: block; }
        
        .signatures-section { display: flex; justify-content: space-between; align-items: center; padding: 0 30px 25px 30px; flex-wrap: wrap; gap: 20px; }
        .sig-card { text-align: center; width: 200px; }
        .sig-line { border-top: 1.5px solid #2c3e50; width: 100%; margin-top: 30px; padding-top: 8px; font-size: 11px; font-weight: 600; }
        .seal-card { width: 100px; height: 100px; border: 2px solid #c5a059; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #fef9e6; }

        .seal-card .seal-text { font-size: 8px; margin-top: 5px; }
        
        .card-footer { background: #0f2b44; padding: 12px; text-align: center; }
        .card-footer p { color: white; font-size: 11px; letter-spacing: 1px; }
        
        .action-buttons-card {

            gap: 12px;
            justify-content: center;
            padding: 20px;
            background: #f1f5f9;
            flex-wrap: wrap;
            border-radius: 16px;
            margin-top: 20px;
        }
        .action-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 13px;
        }
        .action-btn.print { background: #1b4f9b; color: white; }
        .action-btn.share { background: #16a34a; color: white; }
        .action-btn.pdf { background: #dc2626; color: white; }
        .action-btn.back { background: #6c757d; color: white; }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .loading-spinner { text-align: center; padding: 50px; color: #1a3a5c; }
        .error-message { text-align: center; padding: 50px; color: #dc2626; }

            .details-section { grid-template-columns: 1fr; padding: 0 15px; }
            .top-row { flex-direction: column; align-items: center; padding: 0 15px; }
            .signatures-section { justify-content: center; flex-direction: column; align-items: center; }
            .terms-list { grid-template-columns: 1fr; gap: 15px; }
            .title-banner h2 { font-size: 22px; }
            .title-banner h2:before, .title-banner h2:after { display: none; }
            .institution-name h1 { font-size: 24px; }
            .info-row-center { flex-direction: column; text-align: center; }
            .info-label-center { text-align: center; padding-right: 0; margin-bottom: 5px; width: 100%; }
            .info-value-center { text-align: center; width: 100%; }
        }
        
        @media print {
            .action-buttons-card { display: none !important; }
            .admission-card { box-shadow: none; margin: 0; max-width: 100%; }
            body { background: white; padding: 0; }
            .terms-list { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

        const element = tempDiv.querySelector('#pdfCard');

        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgWidth = 190;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
        pdf.save(`Admission_Form_${studentData.admissionNo}_${studentData.studentName}.pdf`);
        
        document.body.removeChild(tempDiv);
