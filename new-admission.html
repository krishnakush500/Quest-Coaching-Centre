async function compressPhoto(file, maxWidth=400, maxHeight=400, quality=0.75){ return new Promise((resolve)=>{ const reader=new FileReader(); reader.readAsDataURL(file); reader.onload=(e)=>{ const img=new Image(); img.src=e.target.result; img.onload=()=>{ const canvas=document.createElement('canvas'); let w=img.width, h=img.height; if(w>h){ if(w>maxWidth){ h=(h*maxWidth)/w; w=maxWidth; } }else{ if(h>maxHeight){ w=(w*maxHeight)/h; h=maxHeight; } } canvas.width=w; canvas.height=h; const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h); canvas.toBlob(blob=>resolve(blob),'image/jpeg',quality); }; }; }); }
async function uploadPhotoToSupabase(file, admissionNo){ const blob=await compressPhoto(file); const fileName=`${admissionNo}_${Date.now()}.jpg`; const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(fileName,blob,{contentType:'image/jpeg'}); if(error) throw error; const {data:urlData}=supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(fileName); return urlData.publicUrl; }
function generateAdmissionNo(){ const year=new Date().getFullYear(); const random=Math.floor(Math.random()*10000).toString().padStart(4,'0'); return `QCC/${year}/${random}`; }
function getFormData(){ const firstName=document.getElementById('firstName').value.trim(), middle=document.getElementById('middleName').value.trim(),last=document.getElementById('lastName').value.trim(), fullName=[firstName,middle,last].filter(n=>n).join(' '); const knowAbout=Array.from(document.querySelectorAll('input[name="knowAbout"]:checked')).map(cb=>cb.value).join(', '); return { fullName,firstName,middleName:middle,lastName:last, nationality:document.getElementById('nationality').value.trim(), dob:document.getElementById('dob').value, rollNumber:document.getElementById('rollNumber').value.trim(), gender:document.querySelector('input[name="gender"]:checked')?.value, classVal:document.getElementById('class').value, fatherName:document.getElementById('fatherName').value.trim(), motherName:document.getElementById('motherName').value.trim(), studentMobile:document.getElementById('studentMobile').value.trim(), address:document.getElementById('address').value.trim(), aadhar:document.getElementById('aadhar').value.trim(), presentSchool:document.getElementById('presentSchool').value.trim(), session:document.getElementById('sessionSelect').value, knowAbout, medicalInfo:document.getElementById('medicalInfo').value.trim(), declaration:document.getElementById('declaration').checked, declarationPlace:document.getElementById('declarationPlace').value.trim() }; }
function validateFormData(data){ if(!data.firstName || !data.lastName || !data.dob || !data.rollNumber || !data.gender || !data.classVal || !data.fatherName || !data.studentMobile || !data.address || !data.presentSchool){ showAlert('Fill all required fields (*)','error'); return false; } if(data.studentMobile.length!==10 || !/^\d+$/.test(data.studentMobile)){ showAlert('Valid 10-digit mobile','error'); return false; } if(!data.declaration){ showAlert('Accept declaration','error'); return false; } return true; }
function showAlert(msg,type){ const div=document.getElementById('formAlert'); div.innerHTML=`<div style="background:${type==='error'?'#fee2e2':'#d1fae5'};color:${type==='error'?'#991b1b':'#065f46'};padding:12px;border-radius:16px;margin-bottom:20px;">${msg}</div>`; setTimeout(()=>div.innerHTML='',4000); }
async function afterSubmitShowCard(docId){ const doc=await admissionsCollection.doc(docId).get(); if(doc.exists){ const data={id:doc.id,...doc.data()}; displayAdmissionCard(data,data.photoUrl); formSectionDiv.style.display='none'; cardSectionDiv.style.display='block'; } }
function resetFormToEmpty(){ document.getElementById('admissionForm').reset(); document.getElementById('firstName').value=''; document.getElementById('lastName').value=''; document.getElementById('middleName').value=''; document.getElementById('declarationDate').value=new Date().toLocaleDateString('en-IN'); document.getElementById('declarationPlace').value='Gopalganj'; document.getElementById('nationality').value='Indian'; const preview=document.getElementById('photoPreview'); const placeholderDiv=document.getElementById('photoPlaceholder'); preview.style.display='none'; preview.src=''; placeholderDiv.style.display='flex'; document.getElementById('studentPhoto').value=''; existingPhotoUrl=null; showAlert('Form cleared. Fill details for new admission.','success'); }
async function submitNewAdmission(e){ e.preventDefault(); const data=getFormData(); if(!validateFormData(data)) return; const photoFile=document.getElementById('studentPhoto').files[0]; if(!photoFile){ showAlert('Upload passport photo','error'); return; } const progressOverlay=document.getElementById('progressOverlay'), progressFill=document.getElementById('progressFill'), progressStatus=document.getElementById('progressStatus'), progressPercent=document.getElementById('progressPercent'); progressOverlay.style.display='flex'; const setProgress=(p,msg)=>{ progressFill.style.width=p+'%'; progressPercent.textContent=p+'%'; if(msg) progressStatus.textContent=msg; }; setProgress(10,'Preparing...'); try{ const admissionNo=generateAdmissionNo(); setProgress(30,'Uploading photo...'); const photoUrl=await uploadPhotoToSupabase(photoFile,admissionNo); setProgress(70,'Saving record...'); const admissionData={ admissionNo, studentName:data.fullName, rollNumber:data.rollNumber, fatherName:data.fatherName, motherName:data.motherName, dob:data.dob, gender:data.gender, classApplying:data.classVal, schoolName:data.presentSchool, address:data.address, parentMobile:data.studentMobile, aadhar:data.aadhar, nationality:data.nationality, knowAbout:data.knowAbout, medicalInfo:data.medicalInfo, photoUrl, admissionDate:new Date().toISOString(), session:data.session, createdAt:firebase.firestore.FieldValue.serverTimestamp(), status:'active' }; const docRef=await admissionsCollection.add(admissionData); setProgress(100,'Complete!'); setTimeout(async()=>{ progressOverlay.style.display='none'; await afterSubmitShowCard(docRef.id); },500); }catch(err){ progressOverlay.style.display='none'; showAlert('Error: '+err.message,'error'); } }
function setupNewMode(){ document.getElementById('submitButtonContainer').innerHTML=`<button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-save"></i> Submit Admission</button>`; const form=document.getElementById('admissionForm'); form.onsubmit=submitNewAdmission; resetFormToEmpty(); document.getElementById('modeBadge').textContent='📝 NEW ADMISSION'; formSectionDiv.style.display='block'; cardSectionDiv.style.display='none'; }
async function generateQRCodeImageUrl(text,size=85){ return new Promise((resolve)=>{ const tempDiv=document.createElement('div'); tempDiv.style.cssText='position:absolute;left:-9999px;top:-9999px'; document.body.appendChild(tempDiv); const qrDiv=document.createElement('div'); tempDiv.appendChild(qrDiv); new QRCode(qrDiv,{text,width:size,height:size}); setTimeout(()=>{ const canvas=qrDiv.querySelector('canvas'); if(canvas){ resolve(canvas.toDataURL('image/png')); }else resolve(null); document.body.removeChild(tempDiv); },200); }); }
async function generateAndSavePdf(studentData,photoUrl){ const pdfUrl=await generatePdfBlobUrl(studentData,photoUrl); const link=document.createElement('a'); link.href=pdfUrl; link.download=`Admission_${studentData.admissionNo}_${studentData.studentName}.pdf`; link.click(); URL.revokeObjectURL(pdfUrl); Swal.fire('Downloaded!','PDF ready','success'); }
async function generatePdfBlobUrl(studentData,photoUrl){ const tempDiv=document.createElement('div'); tempDiv.style.cssText='position:absolute;left:-9999px;top:-9999px;width:1100px'; document.body.appendChild(tempDiv); const publicShareUrl=`${window.location.origin}${window.location.pathname}?mode=view&id=${studentData.id}`; const qrImg=await generateQRCodeImageUrl(publicShareUrl,85); const admDate=new Date(studentData.admissionDate), dobDate=new Date(studentData.dob); const termsHtml=`<ul class="terms-col">${TERMS_LEFT.map((t,i)=>`<li><strong>${i+1}.</strong> ${t}</li>`).join('')}</ul><ul class="terms-col">${TERMS_RIGHT.map((t,i)=>`<li><strong>${i+12}.</strong> ${t}</li>`).join('')}</ul>`; tempDiv.innerHTML=`<div id="pdfCard" class="admission-card"><div class="card-header"><div class="logo-center"><div class="logo-img-card"><img src="${LOGO_URL}"></div><div class="institution-name"><h1>QUEST COACHING CENTRE</h1><div class="tagline">|| SEARCH FOR KNOWLEDGE ||</div><div class="under">Under MR. RAVI SIR</div></div><div class="contact-strip-card"><div class="contact-item-card"><i class="fas fa-map-marker-alt"></i> Block More, Gopalganj</div><div class="contact-item-card"><i class="fas fa-phone-alt"></i> +91 9708442525</div></div></div></div><div class="title-banner"><h2>🎓 ADMISSION FORM 🎓</h2></div><div class="top-row"><div class="photo-card"><img src="${photoUrl}"></div><div class="info-group"><div class="info-row"><span class="info-label">ADMISSION NO.</span><span class="info-value adm-no">${studentData.admissionNo}</span></div><div class="info-row"><span class="info-label">ROLL NO.</span><span class="info-value">${studentData.rollNumber||'-'}</span></div><div class="info-row"><span class="info-label">SESSION</span><span class="info-value">${studentData.session}</span></div><div class="info-row"><span class="info-label">CLASS APPLYING</span><span class="info-value">${studentData.classApplying}</span></div></div><div class="qr-card"><div class="qr-box"><img src="${qrImg}" style="width:85px;height:85px;"></div><div class="qr-label-card">SCAN TO VERIFY</div></div></div><div class="details-section"><div class="detail-box"><div class="detail-title">PERSONAL DETAILS</div><div class="detail-content"><table class="detail-table"><tr><td>Student Name</td><td>${studentData.studentName}</td></tr><tr><td>DOB</td><td>${dobDate.toLocaleDateString()}</td></tr><tr><td>Gender</td><td>${studentData.gender}</td></tr><tr><td>Aadhar</td><td>${studentData.aadhar||'-'}</td></tr></table></div></div><div class="detail-box"><div class="detail-title">PARENT INFO</div><div class="detail-content"><table class="detail-table"><tr><td>Father</td><td>${studentData.fatherName}</td></tr><tr><td>Mother</td><td>${studentData.motherName||'-'}</td></tr><tr><td>Contact</td><td>${studentData.parentMobile}</td></tr></table></div></div></div><div class="terms-section"><div class="terms-box"><div class="terms-title">📜 नियम और शर्तें</div><div class="terms-list">${termsHtml}</div></div></div><div class="signatures-section"><div class="sig-card"><div class="sig-line">Parent Signature</div></div><div class="seal-card"><span>QUEST COACHING<br>CENTRE</span><span class="seal-text">DIRECTOR SEAL</span></div><div class="sig-card"><div class="sig-line">Student Signature</div></div></div><div class="card-footer"><p>★ THANK YOU ★</p></div></div>`; await new Promise(r=>setTimeout(r,600)); const element=tempDiv.querySelector('#pdfCard'); const canvas=await html2canvas(element,{scale:2,useCORS:true}); const imgData=canvas.toDataURL('image/png'); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4'); const imgWidth=190; const imgHeight=(canvas.height*imgWidth)/canvas.width; pdf.addImage(imgData,'PNG',10,10,imgWidth,imgHeight); const blob=pdf.output('blob'); const url=URL.createObjectURL(blob); document.body.removeChild(tempDiv); return url; }
function displayAdmissionCard(studentData,photoUrl){ const admDate=new Date(studentData.admissionDate||Date.now()), dobDate=new Date(studentData.dob); const termsHtml=`<ul class="terms-col">${TERMS_LEFT.map((t,i)=>`<li><strong>${i+1}.</strong> ${t}</li>`).join('')}</ul><ul class="terms-col">${TERMS_RIGHT.map((t,i)=>`<li><strong>${i+12}.</strong> ${t}</li>`).join('')}</ul>`; const shareableLink=`${window.location.origin}${window.location.pathname}?mode=view&id=${studentData.id}`; const cardHtml=`<div id="admissionCard" class="admission-card"><div class="card-header"><div class="logo-center"><div class="logo-img-card"><img src="${LOGO_URL}" alt="Logo"></div><div class="institution-name"><h1>QUEST COACHING CENTRE</h1><div class="tagline">|| SEARCH FOR KNOWLEDGE ||</div></div><div class="contact-strip-card"><div class="contact-item-card"><i class="fas fa-map-marker-alt"></i> Block More, Gopalganj</div><div class="contact-item-card"><i class="fas fa-phone-alt"></i> +91 9708442525</div></div></div></div><div class="title-banner"><h2>🎓 ADMISSION FORM 🎓</h2></div><div class="top-row"><div class="photo-card"><img src="${photoUrl}"></div><div class="info-group"><div class="info-row"><span class="info-label">ADMISSION NO.</span><span class="info-value adm-no">${studentData.admissionNo}</span></div><div class="info-row"><span class="info-label">ROLL NO.</span><span class="info-value">${studentData.rollNumber||'-'}</span></div><div class="info-row"><span class="info-label">ADMISSION DATE</span><span class="info-value">${admDate.toLocaleDateString()}</span></div><div class="info-row"><span class="info-label">CLASS</span><span class="info-value">${studentData.classApplying}</span></div></div><div class="qr-card"><div class="qr-box" id="qrcode-view"></div><div class="qr-label-card">SCAN TO VERIFY</div></div></div><div class="details-section"><div class="detail-box"><div class="detail-title">PERSONAL DETAILS</div><div class="detail-content"><table class="detail-table"><tr><td>Student Name</td><td>${studentData.studentName}</td></tr><tr><td>DOB</td><td>${dobDate.toLocaleDateString()}</td></tr><tr><td>Father</td><td>${studentData.fatherName}</td></tr><tr><td>Contact</td><td>${studentData.parentMobile}</td></tr></table></div></div><div class="detail-box"><div class="detail-title">OTHER DETAILS</div><div class="detail-content"><table class="detail-table"><tr><td>School</td><td>${studentData.schoolName||'-'}</td></tr><tr><td>Address</td><td>${studentData.address}</td></tr><tr><td>Know About</td><td>${studentData.knowAbout||'-'}</td></tr></table></div></div></div><div class="terms-section"><div class="terms-box"><div class="terms-title">📜 नियम और शर्तें</div><div class="terms-list">${termsHtml}</div></div></div><div class="signatures-section"><div class="sig-card"><div class="sig-line">Parent Signature</div></div><div class="seal-card"><span>QUEST COACHING<br>CENTRE</span><span class="seal-text">DIRECTOR</span></div><div class="sig-card"><div class="sig-line">Student Signature</div></div></div><div class="card-footer"><p>★ THANK YOU FOR CHOOSING QUEST COACHING CENTRE ★</p></div></div><div class="action-buttons-card"><button class="action-btn print" onclick="document.getElementById('admissionCard').closest('.screen-card-container').querySelector('#admissionCard').cloneNode(true); window.print();"><i class="fas fa-print"></i> Print</button><button class="action-btn share" id="shareCardBtn"><i class="fas fa-share-alt"></i> Share Link & Details</button><button class="action-btn pdf" id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> PDF</button></div>`; cardSectionDiv.innerHTML=cardHtml; cardSectionDiv.style.display='block'; setTimeout(()=>{ new QRCode(document.getElementById("qrcode-view"),{text:shareableLink,width:85,height:85}); },100); document.getElementById('shareCardBtn').onclick=()=>{ const text=`🎓 Quest Coaching Admission\nStudent: ${studentData.studentName}\nAdmission No: ${studentData.admissionNo}\nRoll: ${studentData.rollNumber}\nClass: ${studentData.classApplying}\nLink: ${shareableLink}`; if(navigator.share) navigator.share({title:'Admission Card',text}); else { navigator.clipboard.writeText(text); Swal.fire('Copied!','Link & details copied','success'); } }; document.getElementById('downloadPdfBtn').onclick=()=>generateAndSavePdf(studentData,photoUrl); }
auth.onAuthStateChanged((user)=>{ if(isPublicView){ authLoadingDiv.style.display='none'; mainContentDiv.style.display='block'; admissionsCollection.doc(studentId).get().then(doc=>{ if(doc.exists){ currentStudentData={id:doc.id,...doc.data()}; displayAdmissionCard(currentStudentData,currentStudentData.photoUrl); formSectionDiv.style.display='none'; cardSectionDiv.style.display='block'; } else { Swal.fire('Error','Student not found','error').then(()=>goBackToList()); } }).catch(()=>Swal.fire('Error','Failed to load','error')); return; } if(!user){ Swal.fire({title:'Access Denied',text:'Please login from main page',icon:'error',confirmButtonColor:'#1b4f9b'}).then(()=>{window.location.href='index.html';}); return; } authLoadingDiv.style.display='none'; mainContentDiv.style.display='block'; newAdmissionBtn.onclick=()=>{ setupNewMode(); }; if(mode==='edit'&&studentId){ document.getElementById('modeBadge').textContent='✏️ EDIT MODE'; formSectionDiv.style.display='block'; } else { setupNewMode(); } });
