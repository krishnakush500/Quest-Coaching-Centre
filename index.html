<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Restricted</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      max-width: 400px;
    }

    h2 {
      color: #f87171;
      margin-bottom: 15px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #e5e7eb;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #22c55e;
      color: white;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #16a34a;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Access Restricted</h2>

    <p>This website has been temporarily restricted due to incomplete payment.</p>

    <p>Your cooperation is important. Please complete the payment to reactivate your services.</p>

    <button class="btn" onclick="contact()">Contact Support</button>

    <div class="footer">
      Thank you for your understanding.
    </div>
  </div>

  <script>
    function contact() {
      alert("Please contact the developer to complete the payment.");
    }
  </script>

</body>
</html>
