<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d2b6b" />
<title>About Us · Quest Coaching Centre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --navy:#0d2b6b;
  --navy-2:#16409b;
  --navy-dark:#081f52;
  --gold:#ffc42e;
  --gold-2:#f7b500;
  --gold-ink:#3a2a00;
  --bg:#f2f5fb;
  --card:#ffffff;
  --text:#0f2452;
  --muted:#5f6f90;
  --border:#e3e9f5;
  --radius:14px;
  --shadow:0 2px 10px rgba(13,43,107,.07);
  --shadow-hover:0 10px 26px rgba(13,43,107,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:0 14px}

/* HEADER */
.app-header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#0d2b6b 0%,#16409b 100%);
  border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(8,31,82,.20);
}
.header-inner{
  display:flex;align-items:center;gap:10px;
  min-height:56px;padding:7px 0;
}
.back-header-btn{
  width:34px;height:34px;flex:none;border-radius:9px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.26);
  color:#fff;font-size:14px;display:grid;place-items:center;cursor:pointer;
  transition:all .2s;
}
.back-header-btn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.back-header-btn:active{transform:scale(.94);}
.brand{flex:1;min-width:0;text-align:center;}
.brand h1{
  font-size:14px;font-weight:800;color:#fff;letter-spacing:.7px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  font-size:11px;color:#c3d2f2;line-height:1.35;
}
.header-tag{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;
  color:var(--gold-ink);
  background:linear-gradient(135deg,#ffd257,#f7b500);
  padding:4px 9px;border-radius:20px;text-transform:uppercase;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}

main{flex:1 0 auto;padding-bottom:26px}

/* HERO */
.hero-card{
  margin-top:16px;
  background:linear-gradient(135deg, #0d2b6b 0%, #16409b 100%);
  border-radius:20px;
  padding:30px 24px;
  color:#fff;
  text-align:center;
  box-shadow:0 10px 30px rgba(13,43,107,.28);
  position:relative;
  overflow:hidden;
  border-bottom:4px solid var(--gold);
}
.hero-card::before{
  content:"";position:absolute;top:-60%;right:-20%;width:80%;height:220%;
  background:radial-gradient(circle,rgba(255,196,46,.18) 0%,transparent 70%);
  pointer-events:none;
}
.hero-photo{
  width:130px;height:130px;
  border-radius:50%;
  margin:0 auto 16px;
  border:4px solid var(--gold);
  overflow:hidden;
  background:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  position:relative;z-index:2;
}
.hero-photo img{width:100%;height:100%;object-fit:cover;}
.hero-card h2{
  font-size:1.4rem;font-weight:800;
  letter-spacing:.4px;line-height:1.25;
  position:relative;z-index:2;
}
.hero-card .role{
  font-size:.82rem;color:var(--gold);
  font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;
  margin-top:6px;
  position:relative;z-index:2;
}
.hero-card .phone{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.28);
  padding:8px 16px;
  border-radius:30px;
  font-size:.88rem;font-weight:700;
  margin-top:14px;
  position:relative;z-index:2;
  transition:all .2s;
}
.hero-card .phone:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.hero-card .phone i{color:var(--gold);font-size:.95rem;}
.hero-card .phone:hover i{color:var(--navy);}

/* SECTION CARD */
.section-card{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  margin-top:16px;
}
.section-title{
  font-size:1.1rem;font-weight:800;color:var(--navy);
  display:flex;align-items:center;gap:10px;
  margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:2px solid var(--border);
}
.section-title i{color:var(--gold);font-size:1.15rem;}

.about-text{
  font-size:15px;
  line-height:1.75;
  color:var(--text);
  white-space:pre-wrap;
  word-wrap:break-word;
}

/* INFO ROWS */
.info-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:#f9fbff;
  border:1.5px solid var(--border);
  border-radius:12px;
  margin-bottom:10px;
  transition:all .2s;
}
.info-row:hover{border-color:#cfdcf5;box-shadow:0 4px 12px rgba(13,43,107,.06);}
.info-row .info-icon{
  width:42px;height:42px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;
  color:var(--navy);
  display:grid;place-items:center;
  font-size:1.15rem;
}
.info-row .info-body{flex:1;min-width:0;}
.info-row .info-label{
  font-size:.7rem;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;
  color:#8a95ae;margin-bottom:2px;
}
.info-row .info-value{
  font-size:.95rem;font-weight:700;
  color:var(--navy);word-break:break-word;
}

/* LOADING */
.sk{
  border-radius:14px;
  background:linear-gradient(90deg,#eef2f9 25%,#e2e9f6 37%,#eef2f9 63%);
  background-size:400% 100%;
  animation:shimmer 1.25s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-block{height:120px;margin-top:16px;}
.sk-hero{height:280px;margin-top:16px;}
.sk-row{height:70px;margin-bottom:10px;}

/* EMPTY */
.empty{
  text-align:center;
  padding:40px 20px;
  background:var(--card);
  border:1px dashed #cfdcf5;
  border-radius:14px;
  color:var(--muted);
  font-size:13.5px;
  margin-top:16px;
}
.empty .empty-ico{
  font-size:3rem;color:#cfdcf5;margin-bottom:14px;display:block;
}
.empty strong{display:block;color:var(--navy);font-size:15px;margin-bottom:6px;}

/* FOOTER */
.app-footer{
  flex:none;margin-top:auto;
  background:#fff;border-top:1px solid var(--border);
  padding:18px 14px calc(20px + env(safe-area-inset-bottom));
  text-align:center;
}
.app-footer strong{
  display:block;font-size:12.5px;font-weight:800;
  color:var(--navy);letter-spacing:.7px;
}
.app-footer span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;}
.app-footer small{display:block;font-size:11px;color:#93a1bd;margin-top:8px;}

@media(min-width:600px){
  .hero-card{padding:38px 30px;}
  .hero-photo{width:150px;height:150px;}
  .hero-card h2{font-size:1.6rem;}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap header-inner">
    <button class="back-header-btn" onclick="history.back()" aria-label="Back">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="brand">
      <h1>QUEST COACHING CENTRE</h1>
      <p>About Us</p>
    </div>
    <span class="header-tag">About</span>
  </div>
</header>

<main>
  <div class="wrap" id="app">
    <div class="sk sk-hero"></div>
    <div class="sk sk-block"></div>
    <div class="sk sk-block"></div>
  </div>
</main>

<footer class="app-footer">
  <strong>QUEST COACHING CENTRE</strong>
  <span>Director: Mr. Ravi Sir</span>
  <small>© 2026 Quest Coaching Centre</small>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
  authDomain: "quest-coaching.firebaseapp.com",
  databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quest-coaching",
  storageBucket: "quest-coaching.firebasestorage.app",
  messagingSenderId: "131948734089",
  appId: "1:131948734089:web:f4ba25110c8b1298360858"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const esc = (s = '') => String(s).replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
));

const app = document.getElementById('app');
const DEFAULT_PHOTO = 'https://i.ibb.co/hF9tmnpB/20250903-202922.jpg';
const DEFAULT_DIRECTOR = 'MR. RAVI SIR';
const DEFAULT_PHONE = '+91 9708442525';

(async function loadAbout() {
  try {
    const snap = await db.collection('settings').doc('about_us').get();

    if (!snap.exists) {
      app.innerHTML = `
        <div class="empty" style="margin-top:16px;">
          <span class="empty-ico"><i class="fas fa-school"></i></span>
          <strong>About Us Coming Soon</strong>
          Content is not available right now.<br>
          <small>Please check back later.</small>
        </div>
      `;
      return;
    }

    const data = snap.data();
    const photoUrl = data.photoUrl || DEFAULT_PHOTO;
    const directorName = data.directorName || DEFAULT_DIRECTOR;
    const directorPhone = data.directorPhone || DEFAULT_PHONE;
    const aboutText = data.aboutText || '';
    const location = data.location || '';
    const year = data.year || '';

    const phoneDigits = directorPhone.replace(/\D/g, '');
    const phoneLink = phoneDigits.length >= 10 ? `tel:${directorPhone}` : '#';

    app.innerHTML = `
      <!-- HERO -->
      <div class="hero-card">
        <div class="hero-photo">
          <img src="${esc(photoUrl)}" alt="${esc(directorName)}" onerror="this.src='${DEFAULT_PHOTO}'">
        </div>
        <h2>${esc(directorName)}</h2>
        <div class="role">Director & Founder</div>
        ${directorPhone ? `
          <a class="phone" href="${phoneLink}">
            <i class="fas fa-phone"></i>
            <span>${esc(directorPhone)}</span>
          </a>
        ` : ''}
      </div>

      <!-- ABOUT TEXT -->
      ${aboutText ? `
        <div class="section-card">
          <div class="section-title">
            <i class="fas fa-quote-left"></i>
            <span>About Our Coaching</span>
          </div>
          <div class="about-text">${esc(aboutText)}</div>
        </div>
      ` : ''}

      <!-- INFO -->
      ${(location || year) ? `
        <div class="section-card">
          <div class="section-title">
            <i class="fas fa-info-circle"></i>
            <span>Details</span>
          </div>

          ${location ? `
            <div class="info-row">
              <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
              <div class="info-body">
                <div class="info-label">Location</div>
                <div class="info-value">${esc(location)}</div>
              </div>
            </div>
          ` : ''}

          ${year ? `
            <div class="info-row">
              <div class="info-icon"><i class="fas fa-calendar-alt"></i></div>
              <div class="info-body">
                <div class="info-label">Established</div>
                <div class="info-value">${esc(year)}</div>
              </div>
            </div>
          ` : ''}
        </div>
      ` : ''}
    `;
  } catch (err) {
    console.error('About fetch failed:', err);
    app.innerHTML = `
      <div class="empty" style="margin-top:16px;">
        <span class="empty-ico"><i class="fas fa-exclamation-triangle"></i></span>
        <strong>Unable to load</strong>
        Please check your internet connection and try again.
      </div>
    `;
  }
})();
</script>
</body>
</html>
