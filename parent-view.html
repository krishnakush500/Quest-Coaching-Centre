<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>👨‍👩‍👧 Parent View · Quest Coaching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f6ff;
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px;
      box-shadow: 0 20px 50px rgba(0, 40, 100, 0.12);
      padding: 30px 28px 32px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #e6effa;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(145deg, #0a2a66, #1f4b9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .search-section {
      background: #f4f9ff;
      padding: 20px 25px;
      border-radius: 60px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      border: 1px solid #d7e5fc;
    }
    .search-section label {
      font-weight: 600;
      color: #0f3b7a;
      font-size: 0.95rem;
    }
    .search-section input {
      border: 1px solid #b8cff0;
      border-radius: 40px;
      padding: 10px 20px;
      font-weight: 500;
      font-size: 0.95rem;
      width: 180px;
      outline: none;
      background: white;
    }
    .search-section input:focus {
      border-color: #1f4b9e;
      box-shadow: 0 0 0 3px rgba(26, 80, 180, 0.12);
    }
    .search-section button {
      background: #0a2a66;
      border: none;
      border-radius: 60px;
      padding: 10px 30px;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 14px rgba(10, 42, 102, 0.25);
      cursor: pointer;
      border: 1px solid #3f6ec0;
    }
    .search-section button:hover {
      background: #13458b;
      transform: scale(1.01);
    }
    .search-section button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result-card {
      background: #f8fafc;
      border-radius: 30px;
      padding: 25px 30px;
      border: 1px solid #e2e8f0;
      display: none;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-card .student-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0a2a66;
      margin-bottom: 5px;
    }
    .result-card .student-roll {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }
    .result-card .status-badge {
      display: inline-block;
      padding: 8px 24px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }
    .status-present { background: #d1fae5; color: #065f46; }
    .status-absent { background: #fee2e2; color: #991b1b; }
    .status-leave { background: #fef3c7; color: #92400e; }
    .status-holiday { background: #fecaca; color: #991b1b; }
    .status-notmarked { background: #f1f5f9; color: #64748b; }

    .fee-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      background: white;
      padding: 15px 20px;
      border-radius: 16px;
      margin: 15px 0;
      border: 1px solid #e2e8f0;
    }
    .fee-details .fee-item {
      text-align: center;
    }
    .fee-details .fee-item .label {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
    }
    .fee-details .fee-item .value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0a2a66;
    }
    .fee-details .fee-item .value.due { color: #dc3545; }
    .fee-details .fee-item .value.paid { color: #10b981; }

    .remark-box {
      background: #f1f5f9;
      padding: 12px 18px;
      border-radius: 16px;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #334155;
    }
    .remark-box i { color: #1f4b9e; margin-right: 8px; }

    .not-found {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      display: none;
    }
    .not-found i {
      font-size: 3rem;
      color: #cbd5e1;
      display: block;
      margin-bottom: 15px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #1f4b9e;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .back-link:hover { text-decoration: underline; }

    .loading-spinner {
      text-align: center;
      padding: 20px;
      display: none;
    }
    .loading-spinner i {
      font-size: 2rem;
      color: #1f4b9e;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a237e;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
      max-width: 90%;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container { padding: 20px 16px; }
      .header h1 { font-size: 1.5rem; }
      .search-section { flex-direction: column; border-radius: 30px; padding: 18px; }
      .search-section input { width: 100%; }
      .search-section button { width: 100%; justify-content: center; }
      .result-card { padding: 20px; }
      .fee-details { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><i class="fas fa-eye"></i> Parent View</h1>
    <p>Enter your child's Roll Number to check attendance &amp; fees</p>
  </div>

  <div class="search-section">
    <label><i class="fas fa-id-badge"></i> Roll No.</label>
    <input type="number" id="rollInput" placeholder="e.g. 101" autofocus>
    <button id="searchBtn"><i class="fas fa-search"></i> Check Attendance</button>
  </div>

  <div class="loading-spinner" id="loadingSpinner">
    <i class="fas fa-spinner"></i>
    <p style="margin-top:10px;color:#64748b;">Searching student records...</p>
  </div>

  <!-- Not Found -->
  <div class="not-found" id="notFound">
    <i class="fas fa-user-slash"></i>
    <h3>Student Not Found</h3>
    <p id="notFoundMsg">Please check the Roll Number and try again.</p>
  </div>

  <!-- Result Card -->
  <div class="result-card" id="resultCard">
    <div class="student-name" id="studentName">--</div>
    <div class="student-roll" id="studentRoll">Roll No: -- | Class: --</div>
    
    <div class="status-badge" id="statusBadge">⏳ Not Marked</div>
    
    <div class="fee-details">
      <div class="fee-item">
        <div class="label">Monthly Fee</div>
        <div class="value" id="monthlyFeeDisplay">₹--</div>
      </div>
      <div class="fee-item">
        <div class="label">Paid</div>
        <div class="value paid" id="paidFeeDisplay">₹--</div>
      </div>
      <div class="fee-item">
        <div class="label">Due</div>
        <div class="value due" id="dueFeeDisplay">₹--</div>
      </div>
    </div>

    <div class="remark-box" id="remarkBox">
      <i class="fas fa-comment"></i> <span id="remarkText">No remarks</span>
    </div>

    <div style="margin-top:15px; font-size:0.8rem; color:#94a3b8;">
      <i class="fas fa-calendar-day"></i> <span id="attendanceDate">--</span>
    </div>
  </div>

  <a class="back-link" onclick="window.close()"><i class="fas fa-arrow-left"></i> Close</a>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
  // ============================================================
  // FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
    authDomain: "quest-coaching.firebaseapp.com",
    databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quest-coaching",
    storageBucket: "quest-coaching.firebasestorage.app",
    messagingSenderId: "131948734089",
    appId: "1:131948734089:web:f4ba25110c8b1298360858"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ============================================================
  // DOM REFS
  // ============================================================
  const rollInput = document.getElementById('rollInput');
  const searchBtn = document.getElementById('searchBtn');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const resultCard = document.getElementById('resultCard');
  const notFound = document.getElementById('notFound');
  const notFoundMsg = document.getElementById('notFoundMsg');
  const studentName = document.getElementById('studentName');
  const studentRoll = document.getElementById('studentRoll');
  const statusBadge = document.getElementById('statusBadge');
  const monthlyFeeDisplay = document.getElementById('monthlyFeeDisplay');
  const paidFeeDisplay = document.getElementById('paidFeeDisplay');
  const dueFeeDisplay = document.getElementById('dueFeeDisplay');
  const remarkText = document.getElementById('remarkText');
  const attendanceDate = document.getElementById('attendanceDate');
  const toast = document.getElementById('toastMsg');

  // ============================================================
  // HELPER
  // ============================================================
  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.style.display = 'block';
    toast.style.background = isError ? '#dc3545' : '#1a237e';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  function getTodayDate() {
    const today = new Date();
    return today.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function formatDateDisplay(dateStr) {
    if (!dateStr) return '--';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ============================================================
  // GET URL PARAMETERS (Session & Class from attendance page)
  // ============================================================
  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      session: params.get('session') || '2026-27',
      class: params.get('class') || ''
    };
  }

  // ============================================================
  // SEARCH STUDENT FROM FIREBASE
  // ============================================================
  async function searchStudent() {
    const roll = parseInt(rollInput.value.trim());
    if (!roll || isNaN(roll)) {
      showToast('Please enter a valid Roll Number!', true);
      return;
    }

    const { session, class: className } = getUrlParams();
    
    if (!className) {
      showToast('Please select a class from attendance page first!', true);
      return;
    }

    // Show loading
    loadingSpinner.style.display = 'block';
    resultCard.style.display = 'none';
    notFound.style.display = 'none';
    searchBtn.disabled = true;
    searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';

    try {
      // 🔥 STEP 1: Find student by roll number in admissions collection
      let studentDoc = null;
      let studentData = null;

      // Query admissions with rollNumber and class
      const snapshot = await db.collection('admissions')
        .where('rollNumber', '==', String(roll))
        .where('classApplying', '==', className)
        .get();

      if (snapshot.empty) {
        // Try with 'class' field
        const snapshot2 = await db.collection('admissions')
          .where('rollNumber', '==', String(roll))
          .where('class', '==', className)
          .get();
        
        if (snapshot2.empty) {
          loadingSpinner.style.display = 'none';
          notFound.style.display = 'block';
          notFoundMsg.textContent = `Roll No. ${roll} not found in ${className} class. Please check the Roll Number.`;
          searchBtn.disabled = false;
          searchBtn.innerHTML = '<i class="fas fa-search"></i> Check Attendance';
          return;
        }
        studentDoc = snapshot2.docs[0];
        studentData = studentDoc.data();
      } else {
        studentDoc = snapshot.docs[0];
        studentData = studentDoc.data();
      }

      const studentNameVal = studentData.studentName || studentData.name || 'Unknown';
      const studentClass = studentData.classApplying || studentData.class || className;
      const studentRoll = studentData.rollNumber || studentData.rollNo || roll;

      // 🔥 STEP 2: Get today's attendance for this student
      const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
      
      const attendanceRef = db.collection('attendance')
        .doc(session)
        .collection('classes')
        .doc(studentClass)
        .collection('students')
        .doc(studentNameVal)
        .collection('attendance')
        .doc(today);

      const attendanceSnap = await attendanceRef.get();

      let status = 'notmarked';
      let remark = '';
      let monthlyFee = 0;
      let paidFee = 0;
      let dueFee = 0;

      if (attendanceSnap.exists) {
        const attData = attendanceSnap.data();
        status = attData.status || 'notmarked';
        remark = attData.remark || '';
        monthlyFee = attData.monthlyFee || 0;
        paidFee = attData.paidFee || 0;
        dueFee = attData.dueFee || (monthlyFee - paidFee);
      }

      // 🔥 STEP 3: Display result
      loadingSpinner.style.display = 'none';
      resultCard.style.display = 'block';
      notFound.style.display = 'none';

      studentName.textContent = studentNameVal;
      studentRoll.textContent = `Roll No: ${studentRoll} | Class: ${studentClass} | Session: ${session}`;
      attendanceDate.textContent = formatDateDisplay(today);

      // Status Badge
      const statusMap = {
        present: { label: '✅ Present', class: 'status-present' },
        absent: { label: '❌ Absent', class: 'status-absent' },
        leave: { label: '🟡 Leave', class: 'status-leave' },
        holiday: { label: '🎉 Holiday', class: 'status-holiday' },
        notmarked: { label: '⏳ Not Marked Yet', class: 'status-notmarked' }
      };
      const statusInfo = statusMap[status] || statusMap.notmarked;
      statusBadge.textContent = statusInfo.label;
      statusBadge.className = `status-badge ${statusInfo.class}`;

      // Fee Details
      monthlyFeeDisplay.textContent = `₹${monthlyFee || 0}`;
      paidFeeDisplay.textContent = `₹${paidFee || 0}`;
      const due = dueFee || (monthlyFee - paidFee);
      if (due <= 0) {
        dueFeeDisplay.textContent = '✅ Paid Full';
        dueFeeDisplay.style.color = '#10b981';
      } else {
        dueFeeDisplay.textContent = `₹${due}`;
        dueFeeDisplay.style.color = '#dc3545';
      }

      // Remark
      remarkText.textContent = remark || 'No remarks';

    } catch (error) {
      console.error('Error searching student:', error);
      loadingSpinner.style.display = 'none';
      showToast('Error searching: ' + error.message, true);
    } finally {
      searchBtn.disabled = false;
      searchBtn.innerHTML = '<i class="fas fa-search"></i> Check Attendance';
    }
  }

  // ============================================================
  // EVENT LISTENERS
  // ============================================================
  searchBtn.addEventListener('click', searchStudent);

  rollInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchStudent();
  });

  // Auto-focus on load
  window.addEventListener('load', function() {
    rollInput.focus();
    const { class: className } = getUrlParams();
    if (className) {
      // Show which class is being searched
      document.querySelector('.header p').textContent = 
        `Class: ${className} | Enter Roll Number to check attendance & fees`;
    }
  });

  console.log('✅ Parent View Loaded - Firebase Connected!');
  console.log('📌 Searching from Firebase admissions & attendance collections');
</script>
</body>
</html>
