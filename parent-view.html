<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>👨‍👩‍👧 Parent View · Quest Coaching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f6ff;
      min-height: 100vh;
      padding: 10px 6px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 40, 100, 0.12);
      padding: 16px 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .coaching-header {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #1a237e, #283593);
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(26, 35, 126, 0.28);
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
    }
    .coaching-header::before {
      content: '';
      position: absolute;
      top: -50%; right: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,193,7,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .coaching-header .logo-circle {
      width: 54px; height: 54px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #ffc107;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .coaching-header .logo-circle img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .coaching-header .coaching-text {
      text-align: left;
      color: white;
      position: relative;
      z-index: 1;
    }
    .coaching-header .coaching-text h2 {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }
    .coaching-header .coaching-text .director {
      font-size: 0.68rem;
      color: #ffc107;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .coaching-header .coaching-text .details {
      font-size: 0.6rem;
      opacity: 0.95;
      line-height: 1.4;
    }
    .coaching-header .coaching-text .details i {
      color: #ffc107;
      margin-right: 3px;
      font-size: 0.58rem;
    }

    .search-section {
      background: linear-gradient(135deg, #e8f0fe, #f4f9ff);
      padding: 14px 16px;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      border: 2px solid #d7e5fc;
      box-shadow: 0 4px 12px rgba(26, 80, 180, 0.06);
    }
    .search-section label {
      font-weight: 700;
      color: #0a2a66;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .search-section label i { color: #f59e0b; font-size: 0.95rem; }
    .search-section input {
      border: 2px solid #b8cff0;
      border-radius: 40px;
      padding: 9px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      width: 160px;
      outline: none;
      background: white;
      color: #0a2a66;
    }
    .search-section input:focus {
      border-color: #0a2a66;
      box-shadow: 0 0 0 3px rgba(10, 42, 102, 0.12);
    }
    .search-section button {
      background: linear-gradient(135deg, #0a2a66, #1f4b9e);
      border: none;
      border-radius: 60px;
      padding: 9px 22px;
      color: white;
      font-weight: 700;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(10, 42, 102, 0.25);
      cursor: pointer;
    }
    .search-section button:hover { transform: translateY(-1px); }
    .search-section button:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-card {
      background: linear-gradient(135deg, #f8fafc, #f4f9ff);
      border-radius: 16px;
      padding: 16px 14px;
      border: 2px solid #e2e8f0;
      display: none;
      animation: fadeIn 0.4s ease;
      box-shadow: 0 6px 18px rgba(0, 40, 100, 0.06);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .student-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #e2e8f0;
    }
    .student-photo-circle {
      width: 58px; height: 58px;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid #0a2a66;
      box-shadow: 0 0 0 2.5px rgba(255, 193, 7, 0.3);
      flex-shrink: 0;
      background: linear-gradient(135deg, #e8f0fe, #dbeafe);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .student-photo-circle img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .student-photo-circle .photo-fallback {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0a2a66;
      text-transform: uppercase;
    }
    .student-info { flex: 1; min-width: 0; }
    .student-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0a2a66;
      margin-bottom: 3px;
      word-wrap: break-word;
    }
    .student-roll {
      color: #475569;
      font-size: 0.68rem;
      font-weight: 500;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .student-roll i { color: #f59e0b; margin-right: 3px; }

    .attendance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      padding: 10px 14px;
      background: white;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      box-shadow: 0 3px 10px rgba(0, 40, 100, 0.04);
    }
    .attendance-row .today-label {
      font-size: 0.58rem;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }
    .attendance-row .today-date {
      font-size: 0.72rem;
      color: #0a2a66;
      font-weight: 700;
    }
    .attendance-row .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 60px;
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 0.3px;
    }
    .status-present { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #065f46; border: 1.5px solid #10b981; }
    .status-absent { background: linear-gradient(135deg, #fee2e2, #fecaca); color: #991b1b; border: 1.5px solid #dc3545; }
    .status-leave { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1.5px solid #f59e0b; }
    .status-holiday { background: linear-gradient(135deg, #c7d2fe, #a5b4fc); color: #3730a3; border: 1.5px solid #6366f1; }
    .status-notmarked { background: linear-gradient(135deg, #f1f5f9, #e2e8f0); color: #64748b; border: 1.5px solid #94a3b8; }

    .action-buttons-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }
    .details-btn {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      border: none;
      border-radius: 60px;
      padding: 8px 18px;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      justify-content: center;
    }
    .details-btn:hover { transform: translateY(-2px); }

    .download-pdf-btn {
      background: linear-gradient(135deg, #dc3545, #b91c1c);
      border: none;
      border-radius: 60px;
      padding: 8px 18px;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(220, 53, 69, 0.3);
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      justify-content: center;
    }
    .download-pdf-btn:hover { transform: translateY(-2px); }
    .download-pdf-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .fee-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .fee-details .fee-item {
      background: white;
      padding: 10px 8px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0, 40, 100, 0.05);
      border: 2px solid #e2e8f0;
    }
    .fee-details .fee-item .label {
      font-size: 0.58rem;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .fee-details .fee-item .label i { margin-right: 3px; }
    .fee-details .fee-item .value {
      font-size: 0.95rem;
      font-weight: 800;
      color: #0a2a66;
    }
    .fee-item.fee-monthly { border-color: #3b82f6; background: linear-gradient(135deg, #eff6ff, #dbeafe); }
    .fee-item.fee-monthly .label, .fee-item.fee-monthly .value { color: #1e40af; }
    .fee-item.fee-paid { border-color: #10b981; background: linear-gradient(135deg, #ecfdf5, #d1fae5); }
    .fee-item.fee-paid .label, .fee-item.fee-paid .value { color: #065f46; }
    .fee-item.fee-due { border-color: #dc3545; background: linear-gradient(135deg, #fef2f2, #fee2e2); }
    .fee-item.fee-due .label, .fee-item.fee-due .value { color: #991b1b; }
    .fee-item.fee-due.paid-full { border-color: #10b981; background: linear-gradient(135deg, #ecfdf5, #d1fae5); }
    .fee-item.fee-due.paid-full .label, .fee-item.fee-due.paid-full .value { color: #065f46; }

    .remark-box {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      padding: 10px 14px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #92400e;
      font-weight: 600;
      border: 2px solid #fde68a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .remark-box i { color: #f59e0b; font-size: 0.95rem; flex-shrink: 0; }

    .not-found {
      text-align: center;
      padding: 30px 16px;
      color: #64748b;
      display: none;
      background: linear-gradient(135deg, #fef2f2, #fef2f2);
      border-radius: 16px;
      border: 2px dashed #fecaca;
    }
    .not-found i { font-size: 2.5rem; color: #f87171; display: block; margin-bottom: 10px; }
    .not-found h3 { color: #991b1b; font-size: 1rem; margin-bottom: 6px; }

    .back-link {
      display: inline-block;
      margin-top: 12px;
      color: #1f4b9e;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 30px;
    }
    .back-link:hover { background: #e8f0fe; }

    .loading-spinner {
      text-align: center;
      padding: 20px 16px;
      display: none;
      background: linear-gradient(135deg, #e8f0fe, #f4f9ff);
      border-radius: 16px;
      border: 2px solid #d7e5fc;
    }
    .loading-spinner i {
      font-size: 1.8rem;
      color: #1f4b9e;
      animation: spin 1s linear infinite;
    }
    .loading-spinner p { margin-top: 8px; color: #1f4b9e; font-weight: 600; font-size: 0.8rem; }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .toast-msg {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a237e;
      color: white;
      padding: 10px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.75rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 9999;
      display: none;
      max-width: 90%;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 6px 3px 14px; }
      .container { padding: 12px 10px 16px; border-radius: 16px; max-width: 100%; }
      .coaching-header { padding: 10px 12px; gap: 10px; border-radius: 12px; margin-bottom: 12px; }
      .coaching-header .logo-circle { width: 46px; height: 46px; }
      .coaching-header .coaching-text h2 { font-size: 0.9rem; }
      .coaching-header .coaching-text .director { font-size: 0.62rem; }
      .coaching-header .coaching-text .details { font-size: 0.55rem; }
      .search-section { padding: 12px; border-radius: 14px; gap: 8px; flex-direction: column; align-items: stretch; margin-bottom: 12px; }
      .search-section label { font-size: 0.75rem; justify-content: center; }
      .search-section input { width: 100%; padding: 10px 16px; font-size: 0.85rem; text-align: center; }
      .search-section button { width: 100%; justify-content: center; padding: 10px 20px; font-size: 0.82rem; }
      .result-card { padding: 14px 12px; border-radius: 14px; }
      .student-photo-circle { width: 52px; height: 52px; border-width: 2px; }
      .student-photo-circle .photo-fallback { font-size: 1.35rem; }
      .student-name { font-size: 0.95rem; }
      .student-roll { font-size: 0.62rem; }
      .attendance-row { padding: 10px 12px; gap: 6px; border-radius: 10px; }
      .attendance-row .status-badge { font-size: 0.72rem; padding: 6px 14px; }
      .attendance-row .today-date { font-size: 0.68rem; }
      .action-buttons-row { gap: 6px; }
      .details-btn, .download-pdf-btn { font-size: 0.7rem; padding: 8px 14px; }
      .fee-details { gap: 6px; }
      .fee-details .fee-item { padding: 8px 6px; border-radius: 10px; }
      .fee-details .fee-item .label { font-size: 0.52rem; }
      .fee-details .fee-item .value { font-size: 0.85rem; }
      .remark-box { padding: 8px 12px; font-size: 0.68rem; border-radius: 10px; }
    }

    @media (max-width: 360px) {
      .container { padding: 10px 8px 12px; }
      .coaching-header .coaching-text h2 { font-size: 0.82rem; }
      .student-name { font-size: 0.88rem; }
      .fee-details .fee-item .value { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="coaching-header" id="coachingHeader">
    <div class="logo-circle">
      <img src="https://i.ibb.co/hF9tmnpB/20250903-202922.jpg" alt="Quest Coaching Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=&quot;color:#1a237e;font-weight:900;font-size:1.4rem;&quot;>Q</span>';">
    </div>
    <div class="coaching-text">
      <h2>QUEST COACHING CENTRE</h2>
      <div class="director">CEO & Founder: MR. RAVI SIR</div>
      <div class="details">
        <i class="fas fa-map-marker-alt"></i>Gopalganj &nbsp;|&nbsp;
        <i class="fas fa-phone"></i>+91 9708442525
      </div>
    </div>
  </div>

  <div class="search-section">
    <label><i class="fas fa-id-badge"></i> Roll No.</label>
    <input type="number" id="rollInput" placeholder="Enter Roll Number" autofocus>

  <div class="loading-spinner" id="loadingSpinner">

  <div class="not-found" id="notFound">

  <div class="result-card" id="resultCard">

      <div class="student-photo-circle" id="studentPhotoCircle">
        <img id="studentPhotoImg" src="" alt="Student Photo" style="display:none;">

      <div class="student-info">

        <div class="student-roll" id="studentRoll"><i class="fas fa-id-card"></i> --</div>
      </div>
    </div>

    <div class="attendance-row">
      <div>
        <div class="today-label">Today's Attendance</div>
        <div class="today-date" id="todayDateDisplay">--</div>
      </div>
      <div class="status-badge" id="statusBadge">⏳ Not Marked</div>
    </div>

    <div class="action-buttons-row">
      <button class="details-btn" id="detailsBtn">
        <i class="fas fa-calendar-alt"></i> Details
      </button>
      <button class="download-pdf-btn" id="downloadPdfBtn">
        <i class="fas fa-file-pdf"></i> Download PDF
      </button>
    </div>
    
    <div class="fee-details">
      <div class="fee-item fee-monthly">
        <div class="label"><i class="fas fa-money-bill-wave"></i> Monthly</div>
        <div class="value" id="monthlyFeeDisplay">₹--</div>
      </div>
      <div class="fee-item fee-paid">
        <div class="label"><i class="fas fa-check-circle"></i> Paid</div>
        <div class="value" id="paidFeeDisplay">₹--</div>
      </div>
      <div class="fee-item fee-due" id="dueFeeItem">
        <div class="label"><i class="fas fa-exclamation-triangle"></i> Due</div>

    <div class="remark-box" id="remarkBox">

  <a class="back-link" onclick="window.close()"><i class="fas fa-arrow-left"></i> Close</a>
</div>

<script>
  const COACHING_INFO = {
    logo: 'https://i.ibb.co/hF9tmnpB/20250903-202922.jpg',
    name: 'QUEST COACHING CENTRE',
    director: 'MR. RAVI SIR',
    directorTitle: 'CEO & Founder',
    address: 'In Front of S.S. Girls High School, Gopalganj',
    phone: '+91 9708442525'
  };

  let LOGO_BASE64 = null;

  function loadImageAsCircularDataURL(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        try {
          const size = Math.min(img.naturalWidth || 300, img.naturalHeight || 300);
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, 0, 0, size, size);
          const dataURL = canvas.toDataURL('image/png');
          resolve(dataURL);
        } catch (e) {
          reject(e);
        }
      };
      img.onerror = function() {
        reject(new Error('Image load failed: ' + url));
      };
      img.src = url;
    });
  }

  async function preloadLogo() {
    try {
      LOGO_BASE64 = await loadImageAsCircularDataURL(COACHING_INFO.logo);
      console.log('✅ Logo loaded');
    } catch (err) {
      console.warn('⚠️ Logo preload failed:', err);
    }
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
    authDomain: "quest-coaching.firebaseapp.com",
    databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quest-coaching",
    storageBucket: "quest-coaching.firebasestorage.app",
    messagingSenderId: "131948734089",
    appId: "1:131948734089:web:f4ba25110c8b1298360858"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const rollInput = document.getElementById('rollInput');
  const searchBtn = document.getElementById('searchBtn');
  const loadingSpinner = document.getElementById('loadingSpinner');
  const resultCard = document.getElementById('resultCard');
  const notFound = document.getElementById('notFound');
  const notFoundMsg = document.getElementById('notFoundMsg');
  const studentName = document.getElementById('studentName');
  const studentRoll = document.getElementById('studentRoll');
  const statusBadge = document.getElementById('statusBadge');
  const todayDateDisplay = document.getElementById('todayDateDisplay');
  const monthlyFeeDisplay = document.getElementById('monthlyFeeDisplay');
  const paidFeeDisplay = document.getElementById('paidFeeDisplay');
  const dueFeeDisplay = document.getElementById('dueFeeDisplay');
  const dueFeeItem = document.getElementById('dueFeeItem');
  const remarkText = document.getElementById('remarkText');
  const toast = document.getElementById('toastMsg');
  const coachingHeader = document.getElementById('coachingHeader');
  const detailsBtn = document.getElementById('detailsBtn');
  const downloadPdfBtn = document.getElementById('downloadPdfBtn');

  const studentPhotoImg = document.getElementById('studentPhotoImg');
  const photoFallback = document.getElementById('photoFallback');

  let currentStudent = null;

  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.style.display = 'block';
    toast.style.background = isError ? '#dc3545' : '#1a237e';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  function formatDateDisplay(dateStr) {
    if (!dateStr) return '--';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      session: params.get('session') || '2026-27',
      class: params.get('class') || ''
    };
  }

  function loadStudentPhoto(photoUrl, studentNameVal) {
    studentPhotoImg.style.display = 'none';
    studentPhotoImg.src = '';
    photoFallback.style.display = 'none';
    
    if (photoUrl && photoUrl.trim() !== '') {
      studentPhotoImg.onload = function() {
        studentPhotoImg.style.display = 'block';
        photoFallback.style.display = 'none';
      };
      studentPhotoImg.onerror = function() {
        studentPhotoImg.style.display = 'none';
        photoFallback.style.display = 'flex';
        photoFallback.textContent = (studentNameVal || 'S').charAt(0).toUpperCase();
      };
      studentPhotoImg.crossOrigin = 'anonymous';
      studentPhotoImg.src = photoUrl;
    } else {
      studentPhotoImg.style.display = 'none';
      photoFallback.style.display = 'flex';
      photoFallback.textContent = (studentNameVal || 'S').charAt(0).toUpperCase();
    }
  }

  // ============================================================
  // 🔥 MAIN SEARCH FUNCTION
  // Searches admissions + attendance + fees collections
  // ============================================================
  async function searchStudent() {
    const roll = parseInt(rollInput.value.trim());
    if (!roll || isNaN(roll)) {
      showToast('Please enter a valid Roll Number!', true);
      return;
    }

    const { session, class: className } = getUrlParams();
    
    if (!className) {
      showToast('Please select a class from attendance page first!', true);
      return;
    }

    loadingSpinner.style.display = 'block';
    resultCard.style.display = 'none';
    notFound.style.display = 'none';
    coachingHeader.style.display = 'none';
    searchBtn.disabled = true;
    searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';

    try {
      let studentData = null;
      let studentDocId = null;

      // ============================================================
      // STEP 1: Search student in admissions collection
      // ============================================================
      const snapshot = await db.collection('admissions')
        .where('rollNumber', '==', String(roll))
        .where('classApplying', '==', className)
        .get();

      if (snapshot.empty) {
        const snapshot2 = await db.collection('admissions')
          .where('rollNumber', '==', String(roll))
          .where('class', '==', className)
          .get();
        
        if (snapshot2.empty) {
          loadingSpinner.style.display = 'none';
          notFound.style.display = 'block';
          notFoundMsg.textContent = `Roll No. ${roll} not found in ${className} class.`;
          searchBtn.disabled = false;
          searchBtn.innerHTML = '<i class="fas fa-search"></i> Check Attendance';
          return;
        }
        studentData = snapshot2.docs[0].data();
        studentDocId = snapshot2.docs[0].id;
      } else {
        studentData = snapshot.docs[0].data();
        studentDocId = snapshot.docs[0].id;
      }

      const studentNameVal = studentData.studentName || studentData.name || 'Unknown';
      const studentClass = studentData.classApplying || studentData.class || className;
      const studentRollVal = studentData.rollNumber || studentData.rollNo || roll;
      const photoUrl = studentData.photoUrl || studentData.photo || '';
      const fatherName = studentData.fatherName || studentData.father || 'N/A';

      currentStudent = {
        id: studentDocId,
        name: studentNameVal,
        className: studentClass,
        roll: studentRollVal,
        session: session,
        fatherName: fatherName,
        photoUrl: photoUrl
      };

      // ============================================================
      // STEP 2: Fetch TODAY'S ATTENDANCE
      // ============================================================
      const today = new Date().toISOString().split('T')[0];
      
      const attendanceRef = db.collection('attendance')
        .doc(session)
        .collection('classes')
        .doc(studentClass)
        .collection('students')
        .doc(studentNameVal)
        .collection('attendance')
        .doc(today);

      const attendanceSnap = await attendanceRef.get();

      let status = 'notmarked';
      let remark = '';

      if (attendanceSnap.exists) {
        const attData = attendanceSnap.data();
        status = attData.status || 'notmarked';
        remark = attData.remark || '';
      }

      // ============================================================
      // 🔥 STEP 3: Fetch FEES data from 'fees' collection
      // ============================================================
      let monthlyFee = 0;
      let paidFee = 0;
      let dueFee = 0;
      let totalFee = 0;
      let totalReceived = 0;
      let totalDue = 0;
      let feeRemark = '';

      try {
        // Fees collection mein roll_number se search karo
        const feesSnap = await db.collection('fees')
          .where('roll_number', '==', String(roll))
          .get();

        if (!feesSnap.empty) {
          // Saare matching docs ka sum karo
          feesSnap.forEach(doc => {
            const feeData = doc.data();
            
            const docTotal = feeData.total_amount || feeData.totalFee || feeData.monthlyFee || 0;
            const docReceived = feeData.received_amount || feeData.paidFee || feeData.paid_amount || 0;
            const docDue = feeData.due_amount || feeData.dueFee || Math.max(0, docTotal - docReceived);

            totalFee += Number(docTotal) || 0;
            totalReceived += Number(docReceived) || 0;
            totalDue += Number(docDue) || 0;

            // Monthly fee (tuition) from breakdown
            if (feeData.fee_breakdown && feeData.fee_breakdown.tuition) {
              monthlyFee = feeData.fee_breakdown.tuition;
            } else if (feeData.fee_breakdown && feeData.fee_breakdown.subtotal) {
              monthlyFee = feeData.fee_breakdown.subtotal;
            } else if (feeData.monthlyFee) {
              monthlyFee = feeData.monthlyFee;
            }
            
            if (feeData.note) feeRemark = feeData.note;
            if (feeData.remark) feeRemark = feeData.remark;
          });

          // Agar monthly fee nahi mila to class ke hisaab se default
          if (!monthlyFee || monthlyFee === 0) {
            const classNum = studentClass.match(/\d+/);
            if (classNum) {
              const cls = parseInt(classNum[0]);
              if (cls === 10) monthlyFee = 7200;
              else if (cls === 11 || cls === 12) monthlyFee = 6000;
              else monthlyFee = 6000;
            }
          }

          paidFee = totalReceived;
          dueFee = totalDue;

        } else {
          // Agar fees collection mein nahi mila, to default calculate karo
          const classNum = studentClass.match(/\d+/);
          if (classNum) {
            const cls = parseInt(classNum[0]);
            if (cls === 10) monthlyFee = 7200;
            else if (cls === 11 || cls === 12) monthlyFee = 6000;
            else monthlyFee = 6000;
          }
          paidFee = 0;
          dueFee = monthlyFee;
        }
      } catch (feeErr) {
        console.warn('Fees fetch error:', feeErr);
        // Fallback: class ke hisaab se monthly fee
        const classNum = studentClass.match(/\d+/);
        if (classNum) {
          const cls = parseInt(classNum[0]);
          monthlyFee = (cls === 10) ? 7200 : 6000;
        }
        dueFee = monthlyFee;
      }

      // ============================================================
      // STEP 4: Display everything
      // ============================================================
      loadingSpinner.style.display = 'none';
      coachingHeader.style.display = 'flex';
      resultCard.style.display = 'block';
      notFound.style.display = 'none';

      loadStudentPhoto(photoUrl, studentNameVal);

      studentName.textContent = studentNameVal;
      studentRoll.innerHTML = `<i class="fas fa-id-card"></i> Roll: ${studentRollVal} | Class: ${studentClass}`;
      todayDateDisplay.textContent = formatDateDisplay(today);

      const statusMap = {
        present: { label: '✅ Present', class: 'status-present' },
        absent: { label: '❌ Absent', class: 'status-absent' },
        leave: { label: '🟡 Leave', class: 'status-leave' },
        holiday: { label: '🎉 Holiday', class: 'status-holiday' },
        notmarked: { label: '⏳ Not Marked', class: 'status-notmarked' }
      };
      const statusInfo = statusMap[status] || statusMap.notmarked;
      statusBadge.textContent = statusInfo.label;
      statusBadge.className = `status-badge ${statusInfo.class}`;

      // ✅ Fees display
      monthlyFeeDisplay.textContent = `₹${monthlyFee || 0}`;
      paidFeeDisplay.textContent = `₹${paidFee || 0}`;
      const finalDue = dueFee || Math.max(0, monthlyFee - paidFee);
      
      if (finalDue <= 0) {
        dueFeeDisplay.textContent = '✅ Paid';
        dueFeeItem.classList.add('paid-full');
      } else {
        dueFeeDisplay.textContent = `₹${finalDue}`;
        dueFeeItem.classList.remove('paid-full');
      }

      remarkText.textContent = remark || feeRemark || 'No remarks';

    } catch (error) {
      console.error('Error searching student:', error);
      loadingSpinner.style.display = 'none';
      showToast('Error searching: ' + error.message, true);
    } finally {
      searchBtn.disabled = false;
      searchBtn.innerHTML = '<i class="fas fa-search"></i> Check Attendance';
    }
  }

  detailsBtn.addEventListener('click', function() {
    if (!currentStudent) {
      showToast('Please search a student first!', true);
      return;
    }
    const params = new URLSearchParams({
      session: currentStudent.session,
      class: currentStudent.className,
      name: currentStudent.name,
      roll: currentStudent.roll
    });
    window.open(`student-calendar.html?${params.toString()}`, '_blank');
  });

  // ============================================================
  // 🔥 DOWNLOAD PDF - Calendar Style Layout
  // ============================================================
  async function downloadSingleStudentPDF() {
    if (!currentStudent) {
      showToast('Please search a student first!', true);
      return;
    }

    downloadPdfBtn.disabled = true;
    downloadPdfBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

    try {
      const { jsPDF } = window.jspdf;
      
      const doc = new jsPDF({ 
        orientation: 'portrait', 
        unit: 'mm', 
        format: 'a4' 
      });

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonthNum = now.getMonth();
      const monthName = now.toLocaleString('default', { month: 'long' });
      const currentDaysInMonth = new Date(currentYear, currentMonthNum + 1, 0).getDate();

      let logoData = LOGO_BASE64;
      if (!logoData) {
        try {
          logoData = await loadImageAsCircularDataURL(COACHING_INFO.logo);
          LOGO_BASE64 = logoData;
        } catch (err) {
          console.warn('Logo load failed:', err);
        }
      }

      // Fetch attendance
      const attendanceSnapshot = await db.collection('attendance')
        .doc(currentStudent.session)
        .collection('classes')
        .doc(currentStudent.className)
        .collection('students')
        .doc(currentStudent.name)
        .collection('attendance')
        .get();

      const studentMap = {};
      const holidayReasons = {};

      attendanceSnapshot.forEach(doc => {
        const dateParts = doc.id.split('-');
        if (dateParts.length === 3) {
          const docYear = parseInt(dateParts[0]);
          const docMonth = parseInt(dateParts[1]) - 1;
          const docDay = parseInt(dateParts[2]);
          
          if (docYear === currentYear && docMonth === currentMonthNum) {
            const data = doc.data();
            const status = data.status || '';
            let cell = '';
            if (status === 'present') cell = 'P';
            else if (status === 'absent') cell = 'A';
            else if (status === 'leave') cell = 'L';
            else if (status === 'holiday') {
              cell = 'H';
              holidayReasons[docDay] = data.holidayReason || data.remark || 'Holiday';
            }
            studentMap[docDay] = cell;
          }
        }
      });

      // Student photo
      let studentPhotoData = null;
      if (currentStudent.photoUrl) {
        try {
          studentPhotoData = await loadImageAsCircularDataURL(currentStudent.photoUrl);
        } catch (e) {
          console.warn('Student photo load failed');
        }
      }

      // ============================================================
      // 1) HEADER - CENTERED
      // ============================================================
      const headerHeight = 32;
      doc.setFillColor(26, 35, 126);
      doc.rect(0, 0, pageWidth, headerHeight, 'F');

      doc.setFillColor(255, 193, 7);
      doc.rect(0, headerHeight, pageWidth, 1, 'F');

      const logoSize = 20;
      const gap = 5;
      const titleWidth = 65;
      const totalWidth = logoSize + gap + titleWidth;
      const blockStartX = pageWidth / 2 - totalWidth / 2;
      const blockStartY = 4;

      const logoX = blockStartX;
      const logoY = blockStartY + 1;
      const logoCenterX = logoX + logoSize / 2;
      const logoCenterY = logoY + logoSize / 2;

      doc.setFillColor(255, 193, 7);
      doc.circle(logoCenterX, logoCenterY, logoSize / 2 + 0.7, 'F');

      if (logoData) {
        try {
          doc.addImage(logoData, 'PNG', logoX, logoY, logoSize, logoSize, undefined, 'FAST');
        } catch (e) {
          doc.setTextColor(26, 35, 126);
          doc.setFontSize(14);
          doc.setFont('helvetica', 'bold');
          doc.text('Q', logoCenterX, logoCenterY + 2.5, { align: 'center' });
        }
      }

      const textX = logoX + logoSize + gap;
      const textY = blockStartY + 4;

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(13);
      doc.setFont('helvetica', 'bold');
      doc.text(COACHING_INFO.name, textX, textY);

      doc.setFontSize(7.5);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(255, 193, 7);
      doc.text(`${COACHING_INFO.directorTitle}: ${COACHING_INFO.director}`, textX, textY + 5);

      doc.setFontSize(6.5);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(255, 255, 255);
      doc.text(COACHING_INFO.address, textX, textY + 9.5);
      doc.text(COACHING_INFO.phone, textX, textY + 13);

      // ============================================================
      // 2) STUDENT DETAILS AREA
      // ============================================================
      const detailsY = headerHeight + 4;
      const detailsHeight = 32;

      doc.setFillColor(248, 250, 252);
      doc.roundedRect(10, detailsY, pageWidth - 20, detailsHeight, 2, 2, 'F');
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.5);
      doc.roundedRect(10, detailsY, pageWidth - 20, detailsHeight, 2, 2, 'S');

      const photoSize = 22;
      const photoX = 15;
      const photoY = detailsY + 5;
      const photoCenterX = photoX + photoSize / 2;
      const photoCenterY = photoY + photoSize / 2;

      doc.setFillColor(255, 193, 7);
      doc.circle(photoCenterX, photoCenterY, photoSize / 2 + 0.8, 'F');

      if (studentPhotoData) {
        try {
          doc.addImage(studentPhotoData, 'PNG', photoX, photoY, photoSize, photoSize, undefined, 'FAST');
        } catch (e) {
          doc.setFillColor(232, 240, 254);
          doc.circle(photoCenterX, photoCenterY, photoSize / 2, 'F');
          doc.setTextColor(10, 42, 102);
          doc.setFontSize(14);
          doc.setFont('helvetica', 'bold');
          doc.text(currentStudent.name.charAt(0).toUpperCase(), photoCenterX, photoCenterY + 3, { align: 'center' });
        }
      } else {
        doc.setFillColor(232, 240, 254);
        doc.circle(photoCenterX, photoCenterY, photoSize / 2, 'F');
        doc.setTextColor(10, 42, 102);
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.text(currentStudent.name.charAt(0).toUpperCase(), photoCenterX, photoCenterY + 3, { align: 'center' });
      }

      const infoX = photoX + photoSize + 5;
      const infoY = detailsY + 7;

      doc.setTextColor(10, 42, 102);
      doc.setFontSize(12);
      doc.setFont('helvetica', 'bold');
      doc.text(currentStudent.name, infoX, infoY);

      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(71, 85, 105);
      doc.text(`Roll No: ${currentStudent.roll}   |   Class: ${currentStudent.className}   |   Session: ${currentStudent.session}`, infoX, infoY + 5);
      doc.text(`Father's Name: ${currentStudent.fatherName || 'N/A'}`, infoX, infoY + 10);
      
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(99, 102, 241);
      doc.setFontSize(9);
      doc.text(`Month: ${monthName} ${currentYear}`, infoX, infoY + 16);

      // ============================================================
      // 3) CALENDAR-STYLE ATTENDANCE AREA
      // ============================================================
      const calendarY = detailsY + detailsHeight + 6;
      
      doc.setFillColor(40, 53, 147);
      doc.rect(10, calendarY, pageWidth - 20, 8, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'bold');
      doc.text('📅 ATTENDANCE CALENDAR', pageWidth / 2, calendarY + 5.5, { align: 'center' });

      const gridStartY = calendarY + 10;
      const gridLeft = 10;
      const gridWidth = pageWidth - 20;
      const colWidth = gridWidth / 7;
      const rowHeight = 12;

      const dayHeaders = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      
      doc.setFillColor(26, 35, 126);
      doc.rect(gridLeft, gridStartY, gridWidth, 7, 'F');
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(7);
      doc.setFont('helvetica', 'bold');
      
      dayHeaders.forEach((dh, idx) => {
        const x = gridLeft + idx * colWidth + colWidth / 2;
        doc.text(dh, x, gridStartY + 4.5, { align: 'center' });
      });

      const firstDayOfWeek = new Date(currentYear, currentMonthNum, 1).getDay();
      const totalRows = Math.ceil((firstDayOfWeek + currentDaysInMonth) / 7);
      
      for (let row = 0; row < totalRows; row++) {
        const rowY = gridStartY + 7 + row * rowHeight;
        
        for (let col = 0; col < 7; col++) {
          const cellX = gridLeft + col * colWidth;
          const dayIndex = row * 7 + col;
          const dayNum = dayIndex - firstDayOfWeek + 1;
          
          doc.setDrawColor(203, 213, 225);
          doc.setLineWidth(0.2);
          doc.rect(cellX, rowY, colWidth, rowHeight);
          
          if (dayNum >= 1 && dayNum <= currentDaysInMonth) {
            const status = studentMap[dayNum] || '';
            const dateObj = new Date(currentYear, currentMonthNum, dayNum);
            const isSunday = dateObj.getDay() === 0;
            
            if (status === 'P') {
              doc.setFillColor(209, 250, 229);
              doc.rect(cellX + 0.2, rowY + 0.2, colWidth - 0.4, rowHeight - 0.4, 'F');
            } else if (status === 'A') {
              doc.setFillColor(254, 226, 226);
              doc.rect(cellX + 0.2, rowY + 0.2, colWidth - 0.4, rowHeight - 0.4, 'F');
            } else if (status === 'L') {
              doc.setFillColor(254, 243, 199);
              doc.rect(cellX + 0.2, rowY + 0.2, colWidth - 0.4, rowHeight - 0.4, 'F');
            } else if (status === 'H') {
              doc.setFillColor(224, 231, 255);
              doc.rect(cellX + 0.2, rowY + 0.2, colWidth - 0.4, rowHeight - 0.4, 'F');
            } else if (isSunday) {
              doc.setFillColor(248, 250, 252);
              doc.rect(cellX + 0.2, rowY + 0.2, colWidth - 0.4, rowHeight - 0.4, 'F');
            }
            
            doc.setFontSize(7);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(71, 85, 105);
            doc.text(String(dayNum), cellX + 1.5, rowY + 3.5);
            
            if (status) {
              doc.setFontSize(10);
              doc.setFont('helvetica', 'bold');
              
              if (status === 'P') doc.setTextColor(6, 95, 70);
              else if (status === 'A') doc.setTextColor(153, 27, 27);
              else if (status === 'L') doc.setTextColor(146, 64, 14);
              else if (status === 'H') doc.setTextColor(55, 48, 163);
              
              doc.text(status, cellX + colWidth / 2, rowY + rowHeight / 2 + 3, { align: 'center' });
            }
          } else {
            doc.setFillColor(250, 250, 250);
            doc.rect(cellX + 0.2, rowY + 0.2, colWidth - 0.4, rowHeight - 0.4, 'F');
          }
        }
      }

      // ============================================================
      // 4) SUMMARY AREA
      // ============================================================
      let presentCount = 0, absentCount = 0, leaveCount = 0, holidayCount = 0;
      Object.values(studentMap).forEach(s => {
        if (s === 'P') presentCount++;
        else if (s === 'A') absentCount++;
        else if (s === 'L') leaveCount++;
        else if (s === 'H') holidayCount++;
      });

      const summaryY = gridStartY + 7 + totalRows * rowHeight + 6;

      doc.setFillColor(40, 53, 147);
      doc.rect(10, summaryY, pageWidth - 20, 8, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'bold');
      doc.text('📊 MONTHLY SUMMARY', pageWidth / 2, summaryY + 5.5, { align: 'center' });

      const boxY = summaryY + 10;
      const boxWidth = (pageWidth - 20 - 9) / 4;
      const boxHeight = 18;
      const gap3 = 3;

      const pX = 10;
      doc.setFillColor(209, 250, 229);
      doc.roundedRect(pX, boxY, boxWidth, boxHeight, 2, 2, 'F');
      doc.setDrawColor(16, 185, 129);
      doc.setLineWidth(0.5);
      doc.roundedRect(pX, boxY, boxWidth, boxHeight, 2, 2, 'S');
      doc.setTextColor(6, 95, 70);
      doc.setFontSize(7);
      doc.setFont('helvetica', 'bold');
      doc.text('PRESENT', pX + boxWidth / 2, boxY + 6, { align: 'center' });
      doc.setFontSize(14);
      doc.text(String(presentCount), pX + boxWidth / 2, boxY + 15, { align: 'center' });

      const aX = pX + boxWidth + gap3;
      doc.setFillColor(254, 226, 226);
      doc.roundedRect(aX, boxY, boxWidth, boxHeight, 2, 2, 'F');
      doc.setDrawColor(220, 53, 69);
      doc.roundedRect(aX, boxY, boxWidth, boxHeight, 2, 2, 'S');
      doc.setTextColor(153, 27, 27);
      doc.setFontSize(7);
      doc.text('ABSENT', aX + boxWidth / 2, boxY + 6, { align: 'center' });
      doc.setFontSize(14);
      doc.text(String(absentCount), aX + boxWidth / 2, boxY + 15, { align: 'center' });

      const lX = aX + boxWidth + gap3;
      doc.setFillColor(254, 243, 199);
      doc.roundedRect(lX, boxY, boxWidth, boxHeight, 2, 2, 'F');
      doc.setDrawColor(245, 158, 11);
      doc.roundedRect(lX, boxY, boxWidth, boxHeight, 2, 2, 'S');
      doc.setTextColor(146, 64, 14);
      doc.setFontSize(7);
      doc.text('LEAVE', lX + boxWidth / 2, boxY + 6, { align: 'center' });
      doc.setFontSize(14);
      doc.text(String(leaveCount), lX + boxWidth / 2, boxY + 15, { align: 'center' });

      const hX = lX + boxWidth + gap3;
      doc.setFillColor(224, 231, 255);
      doc.roundedRect(hX, boxY, boxWidth, boxHeight, 2, 2, 'F');
      doc.setDrawColor(99, 102, 241);
      doc.roundedRect(hX, boxY, boxWidth, boxHeight, 2, 2, 'S');
      doc.setTextColor(55, 48, 163);
      doc.setFontSize(7);
      doc.text('HOLIDAY', hX + boxWidth / 2, boxY + 6, { align: 'center' });
      doc.setFontSize(14);
      doc.text(String(holidayCount), hX + boxWidth / 2, boxY + 15, { align: 'center' });

      // ============================================================
      // 5) HOLIDAYS LIST (if any)
      // ============================================================
      const holidayDays = Object.keys(holidayReasons).sort((a, b) => parseInt(a) - parseInt(b));
      let holidaysEndY = boxY + boxHeight;

      if (holidayDays.length > 0) {
        const holidayListY = boxY + boxHeight + 5;
        const holidayText = holidayDays.map(d => `${d} - ${holidayReasons[d]}`).join('  |  ');
        
        doc.setFillColor(224, 231, 255);
        const lines = doc.splitTextToSize(holidayText, pageWidth - 40);
        const boxH = 6 + lines.length * 4;

        doc.roundedRect(10, holidayListY, pageWidth - 20, boxH, 2, 2, 'F');
        doc.setDrawColor(99, 102, 241);
        doc.setLineWidth(0.5);
        doc.roundedRect(10, holidayListY, pageWidth - 20, boxH, 2, 2, 'S');
        
        doc.setTextColor(55, 48, 163);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        doc.text('🎉 Holidays:', 13, holidayListY + 4.5);
        
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7);
        let lineY = holidayListY + 4.5;
        lines.forEach(line => {
          doc.text(line, 34, lineY);
          lineY += 4;
        });

        holidaysEndY = holidayListY + boxH;
      }

      // ============================================================
      // 6) FOOTER
      // ============================================================
      const footerY = pageHeight - 10;
      
      doc.setDrawColor(180, 180, 180);
      doc.setLineWidth(0.3);
      doc.line(8, footerY - 3, pageWidth - 8, footerY - 3);

      doc.setFontSize(6.5);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(40, 53, 147);
      doc.text('Legend:', 10, footerY);

      doc.setFont('helvetica', 'normal');
      doc.setTextColor(100, 100, 100);
      doc.text('P = Present  |  A = Absent  |  L = Leave  |  H = Holiday  |  (blank) = Not Marked', 24, footerY);

      doc.setFontSize(6);
      doc.setTextColor(150, 150, 150);
      doc.text(
        `Generated: ${new Date().toLocaleString('en-IN')}`,
        pageWidth - 10,
        footerY + 4,
        { align: 'right' }
      );

      doc.setFillColor(255, 193, 7);
      doc.rect(0, pageHeight - 3, pageWidth, 3, 'F');

      doc.save(`Attendance_${currentStudent.name}_${monthName}_${currentYear}.pdf`);
      showToast('📥 PDF downloaded successfully!');

    } catch (error) {
      console.error('PDF error:', error);
      showToast('❌ Error: ' + error.message, true);
    } finally {
      downloadPdfBtn.disabled = false;
      downloadPdfBtn.innerHTML = '<i class="fas fa-file-pdf"></i> Download PDF';
    }
  }

  downloadPdfBtn.addEventListener('click', downloadSingleStudentPDF);

  searchBtn.addEventListener('click', searchStudent);
  rollInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchStudent();
  });

  window.addEventListener('load', function() {
    rollInput.focus();
    preloadLogo();
  });

  console.log('✅ Parent View Loaded with Fees Integration!');
</script>
</body>
</html>
