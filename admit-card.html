<body>
    <div id="authLoading" class="auth-loading"><div class="spinner"></div><p style="margin-top:15px;color:#1b4f9b;">Verifying access...</p></div>

    <script>
    const firebaseConfig = { apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg", authDomain: "quest-coaching.firebaseapp.com", projectId: "quest-coaching", storageBucket: "quest-coaching.firebasestorage.app" };

    let currentStudentData = null, subjects = [], allCards = [], progressInterval = null;
    
    // PUBLIC VIEW: No login required for shared links
    async function loadPublicCard(cardId) {
        try {
            const doc = await admitCardsCollection.doc(cardId).get();
            if(doc.exists) {
                const cardData = { id: doc.id, ...doc.data() };
                openAdmitCardInNewTab(cardData);
            } else {
                alert("Admit card not found or expired.");
            }
        } catch(e) { console.error(e); alert("Unable to load admit card"); }
    }
    
    function openAdmitCardInNewTab(data) {

        win.document.write(htmlContent);
        win.document.close();
    }

        const gender = data.gender === 'Male' ? 'MALE' : (data.gender === 'Female' ? 'FEMALE' : 'N/A');

        });

            .sign-box{text-align:center;width:160px;}
            .sign-line{border-top:1px solid #333;width:100%;margin-top:20px;padding-top:5px;}
            .stamp{width:75px;height:75px;border:2px solid #c5a059;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fef9e6;}
            .footer{background:#0f2b44;padding:8px;text-align:center;margin:0 12px 12px 12px;border-radius:0 0 16px 16px;color:white;font-size:8px;}
            .action-buttons{display:flex;gap:12px;justify-content:center;padding:20px;background:white;border-radius:24px;margin-top:10px;}
            .action-btn{padding:10px 24px;border:none;border-radius:40px;font-weight:600;cursor:pointer;}
            .print{background:#1b4f9b;color:white;} .pdf{background:#dc2626;color:white;} .share{background:#10b981;color:white;}
            @media print{ .no-print, .action-buttons{display:none;} body{padding:0;} }
        </style>
        </head>
        <body>
        <div id="cardContainer">
        <div class="admit-card"><div class="card-border"></div>
        <div class="card-header"><div class="header-flex"><div class="logo-circle"><img src="${LOGO_URL}"></div><div class="header-text"><h1>QUEST COACHING CENTRE</h1><p>Block More, Gopalganj | Ph: 9708442525</p></div></div></div>
        <div class="exam-title-bar">🎓 ${data.examName} ADMIT CARD 🎓</div>
        <div class="card-body">
            <div class="top-info-row">
                <div class="photo-section"><div class="student-photo">${photoHtml}</div></div>
                <div class="basic-info">
                    <div class="info-item"><div class="info-label">STUDENT NAME</div><div class="info-value">${data.studentName || 'N/A'}</div></div>
                    <div class="info-item"><div class="info-label">CLASS</div><div class="info-value">${className}</div></div>
                    <div class="info-item"><div class="info-label">ROLL NUMBER</div><div class="info-value">${data.rollNumber || 'N/A'}</div></div>
                    <div class="info-item"><div class="info-label">FATHER'S NAME</div><div class="info-value">${data.fatherName || 'N/A'}</div></div>
                    <div class="info-item"><div class="info-label">MOTHER'S NAME</div><div class="info-value">${data.motherName || 'N/A'}</div></div>
                    <div class="info-item"><div class="info-label">DATE OF BIRTH</div><div class="info-value">${dob}</div></div>
                    <div class="info-item"><div class="info-label">REGISTRATION NO</div><div class="info-value">${data.registrationNo || data.admissionNo || 'N/A'}</div></div>
                    <div class="info-item"><div class="info-label">GENDER</div><div class="info-value">${gender}</div></div>
                    <div class="info-item"><div class="info-label">EXAM CENTRE</div><div class="info-value">${data.examCentre || 'N/A'}</div></div>
                </div>
            </div>
            <div class="subjects-schedule"><div class="section-title">📅 परीक्षा कार्यक्रम</div><table class="schedule-table"><thead><tr><th>Code</th><th>Subject</th><th>Date</th><th>Time</th></tr></thead><tbody>${scheduleHtml || '<tr><td colspan="4">No subjects</td></tr>'}</tbody></table></div>
            <div class="rules-section"><div class="rules-title">📜 निर्देश</div><div class="rules-list">${rulesHtml}</div></div>
            <div class="signatures"><div class="sign-box"><div class="sign-line"></div><div class="sign-label">Director Signature</div></div><div class="stamp-box"><div class="stamp"><span>QUEST</span><span>COACHING</span></div></div><div class="sign-box"><div class="sign-line"></div><div class="sign-label">Student Signature</div></div></div>
        </div>
        <div class="footer"><p>★ SYSTEM GENERATED ADMIT CARD | VALID FOR EXAMINATION PURPOSE ONLY ★</p></div>
        </div>
        </div>
        <div class="action-buttons no-print">
            <button class="action-btn print" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
            <button class="action-btn pdf" onclick="downloadCardPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
            <button class="action-btn share" onclick="shareCardLink()"><i class="fas fa-share-alt"></i> Share</button>
        </div>
        <script>
            function downloadCardPDF(){ const el=document.getElementById('cardContainer'); html2canvas(el,{scale:2,useCORS:true}).then(canvas=>{ const img=canvas.toDataURL('image/png'); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4'); const w=210; const h=(canvas.height*w)/canvas.width; pdf.addImage(img,'PNG',0,0,w,h); pdf.save('AdmitCard_${data.rollNumber}.pdf'); alert('PDF Downloaded!'); }); }
            function shareCardLink(){ const url=window.location.href; if(navigator.share){ navigator.share({title:'Admit Card',text:'${data.studentName} - Roll ${data.rollNumber}',url:url}); } else { navigator.clipboard.writeText(url); alert('Link copied to clipboard!'); } }
        <\/script>
        </body></html>`;
    }
    
    // AUTHENTICATED USER AREA
    auth.onAuthStateChanged(user => { 
        if(!user){ Swal.fire('Access Denied!','Please login from main page','error').then(()=>window.location.href='index.html'); return; } 
        document.getElementById('authLoading').style.display='none'; 
        document.getElementById('mainContent').style.display='block'; 
        const logoutBtn=document.createElement('button'); logoutBtn.innerHTML='🚪 Logout'; logoutBtn.className='logout-btn'; logoutBtn.onclick=()=>auth.signOut().then(()=>window.location.href='index.html'); document.body.appendChild(logoutBtn); 
        loadExamConfig(); 
        getAllAdmitCards(); 
    });
    
    function startProgress(){ document.getElementById('progressOverlay').style.display='flex'; let p=0; if(progressInterval)clearInterval(progressInterval); progressInterval=setInterval(()=>{ p+=Math.floor(Math.random()*15)+5; if(p>=100)p=100; document.getElementById('progressBar').style.width=p+'%'; document.getElementById('progressText').innerText='Loading '+p+'%'; if(p>=100)clearInterval(progressInterval); },200); }
    function finishProgress(){ clearInterval(progressInterval); document.getElementById('progressBar').style.width='100%'; document.getElementById('progressText').innerText='Loading 100%'; setTimeout(()=>document.getElementById('progressOverlay').style.display='none',500); }
    
    async function loadExamConfig(){ startProgress(); try{ const snap=await examConfigCollection.doc('current_exam').get(); if(snap.exists){ const d=snap.data(); document.getElementById('examName').value=d.examName||''; document.getElementById('examCentre').value=d.examCentre||''; document.getElementById('classSelect').value=d.className||''; subjects=d.subjects||[]; } if(subjects.length===0)subjects=[{code:"101",name:"हिन्दी",date:"13/07/2025",startTime:"05:00",endTime:"08:15",ampm:"AM"},{code:"105",name:"संस्कृत",date:"14/07/2025",startTime:"05:00",endTime:"08:15",ampm:"AM"}]; renderSubjects(); }catch(e){ subjects=[]; renderSubjects(); } finishProgress(); }
    async function saveExamConfig(){ const examName=document.getElementById('examName').value, examCentre=document.getElementById('examCentre').value, className=document.getElementById('classSelect').value; try{ await examConfigCollection.doc('current_exam').set({examName,examCentre,className,subjects,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){} }
    function renderSubjects(){ const c=document.getElementById('subjectsContainer'); if(!c)return; c.innerHTML=''; subjects.forEach((s,i)=>{ const row=document.createElement('div'); row.className='subject-row'; row.innerHTML='<input type="text" placeholder="Code" value="'+ (s.code||'') +'" class="subject-code"><input type="text" placeholder="Subject Name" value="'+ (s.name||'') +'" class="subject-name"><input type="text" placeholder="Date" value="'+ (s.date||'') +'" class="subject-date"><div class="time-group"><input type="text" placeholder="Start" value="'+ (s.startTime||'') +'" class="start-time"><input type="text" placeholder="End" value="'+ (s.endTime||'') +'" class="end-time"><select class="ampm-select"><option value="AM" '+(s.ampm==='AM'?'selected':'')+'>AM</option><option value="PM" '+(s.ampm==='PM'?'selected':'')+'>PM</option></select></div><button class="btn-remove-subject"><i class="fas fa-trash"></i></button>'; c.appendChild(row); row.querySelector('.btn-remove-subject').onclick=()=>{ subjects.splice(i,1); renderSubjects(); saveExamConfig(); }; }); }
    document.getElementById('addSubjectBtn').onclick=()=>{ subjects.push({code:"",name:"",date:"",startTime:"",endTime:"",ampm:"AM"}); renderSubjects(); saveExamConfig(); };
    document.getElementById('examName').addEventListener('input',saveExamConfig); document.getElementById('examCentre').addEventListener('input',saveExamConfig); document.getElementById('classSelect').addEventListener('change',saveExamConfig);
    
    document.getElementById('rollNumberInput').addEventListener('input',async function(){ 
        const roll=this.value.trim(); const preview=document.getElementById('studentPreview'); const spin=document.getElementById('loadingSpinner'); 
        if(roll.length<2){ preview.classList.remove('show'); currentStudentData=null; return; } 
        spin.classList.add('show'); 
        try{ 
            const snap=await admissionsCollection.where('rollNumber','==',roll).get(); 
            if(!snap.empty){ 
                let stu=null; snap.forEach(d=>{stu={id:d.id,...d.data()};}); 
                currentStudentData = {
                    id: stu.id, studentName: stu.studentName, rollNumber: stu.rollNumber, admissionNo: stu.admissionNo,
                    fatherName: stu.fatherName, motherName: stu.motherName, dob: stu.dob, gender: stu.gender, photoUrl: stu.photoUrl,
                    className: stu.className
                };
                preview.innerHTML='<div style="display:flex;gap:15px;"><div style="width:55px;height:55px;border-radius:50%;overflow:hidden;border:2px solid #c5a059;">'+(stu.photoUrl?`<img src="${stu.photoUrl}" style="width:100%;height:100%;object-fit:cover;">`:'<i class="fas fa-user" style="font-size:35px;display:flex;align-items:center;justify-content:center;height:100%;"></i>')+'</div><div><strong>'+stu.studentName+'</strong><br>Class: '+(stu.className||'N/A')+'<br>Roll: '+stu.rollNumber+'</div></div>';
                preview.classList.add('show'); 
            } else { preview.innerHTML='<div style="color:#dc2626;">❌ No student found</div>'; preview.classList.add('show'); currentStudentData=null; }
        } catch(e){ preview.innerHTML='<div style="color:#dc2626;">Error fetching student</div>'; preview.classList.add('show'); } 
        finally{ spin.classList.remove('show'); } 
    });
    
    async function saveAdmitCardToFirebase(student,examName,examCentre,className,subjectsData){ 
        const data={studentId:student.id,studentName:student.studentName,rollNumber:student.rollNumber,registrationNo:student.admissionNo,fatherName:student.fatherName,motherName:student.motherName,dob:student.dob,gender:student.gender,photoUrl:student.photoUrl,examName,examCentre,className,subjects:subjectsData,createdAt:firebase.firestore.FieldValue.serverTimestamp()}; 
        const ref=await admitCardsCollection.add(data); 
        return ref.id; 
    }
    async function getAllAdmitCards(){ const snap=await admitCardsCollection.orderBy('createdAt','desc').get(); const cards=[]; snap.forEach(d=>cards.push({id:d.id,...d.data()})); allCards=cards; return cards; }
    function openCardsModal(){ document.getElementById('cardsModal').style.display='flex'; loadCardsModal(); }
    function closeCardsModal(){ document.getElementById('cardsModal').style.display='none'; }
    function filterCards(){ const search=document.getElementById('searchRollInput').value.trim().toLowerCase(); const filtered=allCards.filter(c=>c.rollNumber?.toString().toLowerCase().includes(search)); displayCardsInModal(filtered); }
    function displayCardsInModal(cards){ const body=document.getElementById('cardsModalBody'); if(!cards.length){ body.innerHTML='<div style="text-align:center;padding:20px;">No admit cards found</div>'; return; } let html='<div class="cards-grid">'; cards.forEach(c=>{ const date=c.createdAt?new Date(c.createdAt.toDate()).toLocaleDateString('en-IN'):'Unknown'; html+='<div class="card-record"><div class="record-details"><div class="record-name">'+c.studentName+' <span class="record-badge">Roll: '+c.rollNumber+'</span></div><div class="record-meta"><span>Class: '+(c.className||'-')+'</span><span>Date: '+date+'</span><span>Exam: '+c.examName+'</span></div></div><div class="record-actions"><button class="btn-view-record" onclick="viewAdmitCard(\''+c.id+'\')"><i class="fas fa-eye"></i> View</button><button class="btn-delete-record" onclick="deleteAdmitCard(\''+c.id+'\')"><i class="fas fa-trash-alt"></i> Delete</button></div></div>'; }); body.innerHTML=html+'</div>'; }
    async function loadCardsModal(){ const body=document.getElementById('cardsModalBody'); body.innerHTML='<div class="spinner" style="margin:20px auto;"></div>'; const cards=await getAllAdmitCards(); displayCardsInModal(cards); }
    window.viewAdmitCard=async function(id){ const card=allCards.find(c=>c.id===id); if(card) openAdmitCardInNewTab(card); closeCardsModal(); };
    window.deleteAdmitCard=async function(id){ const res=await Swal.fire({title:'Confirm',text:'Delete permanently?',icon:'warning',showCancelButton:true}); if(res.isConfirmed){ await admitCardsCollection.doc(id).delete(); Swal.fire('Deleted!'); await loadCardsModal(); await getAllAdmitCards(); } };
    document.getElementById('generateBtn').addEventListener('click',async()=>{ 
        const roll=document.getElementById('rollNumberInput').value.trim(); 
        const examName=document.getElementById('examName').value.trim(); 
        const examCentre=document.getElementById('examCentre').value.trim(); 
        const className=document.getElementById('classSelect').value; 
        if(!roll||!currentStudentData){ Swal.fire('Error','Valid Roll Number required','error'); return; } 
        if(!examName||!examCentre||!className){ Swal.fire('Error','Please fill Exam Name, Centre and Class','error'); return; } 
        const validSubs=subjects.filter(s=>s.name?.trim()); 
        Swal.fire({title:'Generating...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()}); 
        const cardId=await saveAdmitCardToFirebase(currentStudentData,examName,examCentre,className,validSubs); 
        if(cardId){ Swal.fire('Success!','Admit Card saved','success'); const fullData={...currentStudentData,examName,examCentre,className,subjects:validSubs,id:cardId}; openAdmitCardInNewTab(fullData); await getAllAdmitCards(); } 
        else{ Swal.fire('Error','Failed to save','error'); } 
    });
    document.getElementById('viewCardsBtn').addEventListener('click',openCardsModal);
    
    window.addEventListener('DOMContentLoaded',()=>{ const urlParams=new URLSearchParams(window.location.search); const sharedId=urlParams.get('viewCard'); if(sharedId){ loadPublicCard(sharedId); } });
    </script>
</body>
</html>
