<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d2b6b" />
<title>Our Toppers · Quest Coaching Centre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --navy:#0d2b6b;
  --navy-2:#16409b;
  --gold:#ffc42e;
  --gold-2:#f7b500;
  --gold-ink:#3a2a00;
  --bg:#f2f5fb;
  --card:#ffffff;
  --text:#0f2452;
  --muted:#5f6f90;
  --border:#e3e9f5;
  --radius:14px;
  --shadow:0 2px 10px rgba(13,43,107,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Roboto","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:0 14px}

/* HEADER */
.app-header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#0d2b6b 0%,#16409b 100%);
  border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(8,31,82,.20);
}
.header-inner{
  display:flex;align-items:center;gap:10px;
  min-height:56px;padding:7px 0;
}
.back-header-btn{
  width:34px;height:34px;flex:none;border-radius:9px;
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.26);
  color:#fff;font-size:14px;display:grid;place-items:center;cursor:pointer;
  transition:all .2s;
}
.back-header-btn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.back-header-btn:active{transform:scale(.94);}
.brand{flex:1;min-width:0;text-align:center;}
.brand h1{
  font-size:14px;font-weight:800;color:#fff;letter-spacing:.7px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  font-size:11px;color:#c3d2f2;line-height:1.35;
}
.header-tag{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.6px;
  color:var(--gold-ink);
  background:linear-gradient(135deg,#ffd257,#f7b500);
  padding:4px 9px;border-radius:20px;text-transform:uppercase;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}

main{flex:1 0 auto;padding-bottom:26px}

/* PAGE HEAD */
.page-head{
  padding:20px 0 14px;
  text-align:center;
}
.page-head h2{
  font-size:1.5rem;font-weight:800;color:var(--navy);
  letter-spacing:-.2px;
  display:inline-flex;align-items:center;gap:10px;
}
.page-head h2 i{color:var(--gold);}
.page-head p{
  font-size:13px;color:var(--muted);margin-top:6px;
}
.page-head::after{
  content:"";display:block;width:50px;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-2));
  border-radius:2px;
  margin:12px auto 0;
}

/* TOPPERS GRID */
.toppers-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  padding-bottom:20px;
}
@media(min-width:600px){
  .toppers-grid{grid-template-columns:repeat(3, 1fr);gap:16px;}
}
@media(min-width:900px){
  .toppers-grid{grid-template-columns:repeat(4, 1fr);}
}

/* TOPPER CARD */
.topper-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:all .25s ease;
  position:relative;
  text-align:center;
  padding:16px 12px 14px;
}
.topper-card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(13,43,107,.14);
  border-color:#cfdcf5;
}

.topper-rank{
  position:absolute;
  top:10px;right:10px;
  background:linear-gradient(135deg,#ffd257,#f7b500);
  color:var(--navy);
  font-size:.68rem;font-weight:800;
  padding:4px 10px;
  border-radius:20px;
  letter-spacing:.5px;
  box-shadow:0 3px 8px rgba(247,181,0,.35);
  text-transform:uppercase;
}
.topper-rank.top1{
  background:linear-gradient(135deg,#ffd700,#ff9d00);
  color:#fff;
}
.topper-rank.top2{
  background:linear-gradient(135deg,#c0c0c0,#a0a0a0);
  color:#fff;
}
.topper-rank.top3{
  background:linear-gradient(135deg,#cd7f32,#a05a1f);
  color:#fff;
}

.topper-photo{
  width:80px;height:80px;
  border-radius:50%;
  margin:6px auto 12px;
  overflow:hidden;
  border:3px solid var(--gold);
  box-shadow:0 4px 12px rgba(13,43,107,.15);
  background:#f0f4fb;
  flex-shrink:0;
}
.topper-photo img{width:100%;height:100%;object-fit:cover;}
@media(min-width:600px){
  .topper-photo{width:95px;height:95px;}
}

.topper-name{
  font-size:.92rem;font-weight:800;
  color:var(--navy);
  line-height:1.3;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 4px;
}
@media(min-width:600px){
  .topper-name{font-size:1rem;}
}

.topper-meta{
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-top:8px;
}
.topper-meta-row{
  display:flex;align-items:center;justify-content:center;
  gap:6px;
  font-size:.74rem;
  color:var(--muted);
  font-weight:600;
}
.topper-meta-row i{
  color:var(--gold);
  font-size:.8rem;
}

.topper-marks{
  background:linear-gradient(135deg,#eef3ff,#dde7ff);
  border:1px solid #dbe6ff;
  color:var(--navy);
  font-size:.82rem;
  font-weight:800;
  padding:6px 12px;
  border-radius:20px;
  display:inline-block;
  margin-top:10px;
  letter-spacing:.3px;
}
.topper-marks i{
  color:var(--gold);
  margin-right:4px;
}

/* LOADING / EMPTY */
.sk{
  border-radius:16px;
  background:linear-gradient(90deg,#eef2f9 25%,#e2e9f6 37%,#eef2f9 63%);
  background-size:400% 100%;
  animation:shimmer 1.25s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-card{height:220px;}

.empty{
  text-align:center;
  padding:50px 20px;
  background:var(--card);
  border:1px dashed #cfdcf5;
  border-radius:14px;
  color:var(--muted);
  font-size:13.5px;
  margin-bottom:20px;
}
.empty .empty-ico{
  font-size:3rem;color:#cfdcf5;margin-bottom:14px;display:block;
}
.empty strong{display:block;color:var(--navy);font-size:16px;margin-bottom:8px;}

/* FOOTER */
.app-footer{
  flex:none;margin-top:auto;
  background:#fff;border-top:1px solid var(--border);
  padding:18px 14px calc(20px + env(safe-area-inset-bottom));
  text-align:center;
}
.app-footer strong{
  display:block;font-size:12.5px;font-weight:800;
  color:var(--navy);letter-spacing:.7px;
}
.app-footer span{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;}
.app-footer small{display:block;font-size:11px;color:#93a1bd;margin-top:8px;}

@media(max-width:359px){
  .topper-card{padding:12px 8px;}
  .topper-name{font-size:.82rem;}
  .topper-photo{width:70px;height:70px;}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap header-inner">
    <button class="back-header-btn" onclick="history.back()" aria-label="Back">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="brand">
      <h1>QUEST COACHING CENTRE</h1>
      <p>Our Toppers</p>
    </div>
    <span class="header-tag">Toppers</span>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h2><i class="fas fa-trophy"></i> Our Toppers</h2>
      <p>Meet our best students who made us proud</p>
    </div>
    <div class="toppers-grid" id="toppersGrid">
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
      <div class="sk sk-card"></div>
    </div>
  </div>
</main>

<footer class="app-footer">
  <strong>QUEST COACHING CENTRE</strong>
  <span>Director: Mr. Ravi Sir</span>
  <small>© 2026 Quest Coaching Centre</small>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
  authDomain: "quest-coaching.firebaseapp.com",
  databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quest-coaching",
  storageBucket: "quest-coaching.firebasestorage.app",
  messagingSenderId: "131948734089",
  appId: "1:131948734089:web:f4ba25110c8b1298360858"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const esc = (s = '') => String(s).replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
));

const grid = document.getElementById('toppersGrid');
const DEFAULT_PHOTO = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23eef3ff"/><circle cx="50" cy="38" r="20" fill="%23cfdcf5"/><ellipse cx="50" cy="90" rx="32" ry="26" fill="%23cfdcf5"/></svg>';

function rankClass(rank) {
  if (!rank) return '';
  const r = String(rank).toLowerCase();
  if (r.includes('1') || r === 'first') return 'top1';
  if (r.includes('2') || r === 'second') return 'top2';
  if (r.includes('3') || r === 'third') return 'top3';
  return '';
}

(async function loadToppers() {
  try {
    const snap = await db.collection('toppers').orderBy('display_order').get();

    if (snap.empty) {
      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1;">
          <span class="empty-ico"><i class="fas fa-trophy"></i></span>
          <strong>Toppers Coming Soon</strong>
          Our toppers will be listed here shortly.<br>
          <small>Please check back later.</small>
        </div>
      `;
      return;
    }

    const toppers = [];
    snap.forEach(doc => toppers.push({ id: doc.id, ...doc.data() }));

    grid.innerHTML = toppers.map(t => {
      const photo = t.photoUrl || DEFAULT_PHOTO;
      const rank = t.rank || '';
      const rankCls = rankClass(rank);
      const marks = t.marks || '';
      const cls = t.class || '';
      const year = t.year || '';

      return `
        <div class="topper-card">
          ${rank ? `<div class="topper-rank ${rankCls}">${esc(rank)}</div>` : ''}
          <div class="topper-photo">
            <img src="${esc(photo)}" alt="${esc(t.name || 'Topper')}" onerror="this.src='${DEFAULT_PHOTO}'">
          </div>
          <div class="topper-name">${esc(t.name || 'Student')}</div>
          <div class="topper-meta">
            ${cls ? `<div class="topper-meta-row"><i class="fas fa-graduation-cap"></i> ${esc(cls)}</div>` : ''}
            ${year ? `<div class="topper-meta-row"><i class="fas fa-calendar"></i> ${esc(year)}</div>` : ''}
          </div>
          ${marks ? `<div class="topper-marks"><i class="fas fa-star"></i>${esc(marks)}</div>` : ''}
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Toppers fetch failed:', err);
    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        <span class="empty-ico"><i class="fas fa-exclamation-triangle"></i></span>
        <strong>Unable to load</strong>
        Please check your internet connection and try again.
      </div>
    `;
  }
})();
</script>
</body>
</html>
