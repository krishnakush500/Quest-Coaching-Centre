<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➕ Add Student · Fee Manager</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; }
        body{ background:#f0f5fa; padding:24px 16px; display:flex; flex-direction:column; align-items:center; }
        .form-card{ background:white; max-width:950px; width:100%; margin:20px auto; border-radius:48px; padding:36px 30px; box-shadow:0 25px 40px -15px #1e3b5b; }
        h2{ display:flex; align-items:center; gap:12px; color:#174873; margin-bottom:28px; font-size:1.9rem; }
        .field{ margin-bottom:22px; }
        label{ font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:10px; color:#1b4a77; font-size:1.05rem; }
        input, select{ width:100%; padding:14px 20px; font-size:1rem; background:#f3f8ff; border:1px solid #b8ceec; border-radius:60px; outline:none; transition: all 0.2s ease; }
        input:focus, select:focus{ border-color:#1b5e9e; background:white; box-shadow:0 0 0 3px rgba(27,94,158,0.1); }
        .row2{ display:flex; gap:15px; flex-wrap:wrap; }
        .row2 .field{ flex:1 1 200px; }
        
        .fees-section{ background:#f8fbfe; border-radius:32px; padding:18px 20px; margin:20px 0 12px 0; border:1px solid #d9e6f5; }
        .section-title{ font-size:1.25rem; font-weight:800; color:#174873; margin-bottom:16px; display:flex; align-items:center; gap:8px; border-left:4px solid #1b4f9b; padding-left:14px; }
        .subjects-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:12px 20px; margin-bottom:20px; }
        .subject-item{ display:flex; align-items:center; gap:12px; background:white; padding:8px 16px; border-radius:50px; border:1px solid #cde1f0; transition:0.1s; cursor:pointer; }
        .subject-item:hover{ background:#eef4fc; border-color:#9bb7d4; }
        .subject-item input{ width:20px; height:20px; margin:0; cursor:pointer; accent-color:#1b4f9b; }
        .subject-item label{ margin:0; font-weight:500; font-size:0.95rem; color:#1e3a5f; cursor:pointer; flex:1; }
        .subject-price{ font-weight:700; color:#0f5c3e; background:#e2f0e8; padding:2px 10px; border-radius:40px; font-size:0.8rem; }
        .extra-charges{ display:flex; flex-wrap:wrap; gap:15px; margin-top:8px; border-top:1px dashed #c2d6ea; padding-top:18px; }
        .extra-item{ background:#fef7e0; border-radius:40px; padding:6px 20px 6px 16px; display:flex; align-items:center; gap:10px; border:1px solid #ffe2a4; }
        .extra-item input{ width:18px; height:18px; margin:0; cursor:pointer; }
        .extra-item label{ margin:0; font-weight:600; font-size:0.9rem; color:#7a5c00; }
        .total-box{ background:#e6f0fa; border-radius:50px; padding:16px 24px; margin:20px 0 10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
        .total-label{ font-weight:800; font-size:1.3rem; color:#0a3a60; }
        .total-amount{ font-size:2rem; font-weight:800; color:#1b4f9b; background:white; padding:5px 20px; border-radius:60px; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
        .checkbox-fees-box{ background:#eef3fc; border-radius:28px; padding:20px; margin:15px 0; }
        .fee-checkbox-item{ display:flex; align-items:center; gap:15px; background:white; padding:12px 20px; border-radius:50px; margin-bottom:10px; border:1px solid #cde1f0; }
        .fee-checkbox-item input{ width:20px; height:20px; cursor:pointer; accent-color:#1b4f9b; }
        .fee-checkbox-item label{ margin:0; font-weight:500; font-size:1rem; cursor:pointer; flex:1; }
        .fee-price{ font-weight:700; color:#0f5c3e; background:#e2f0e8; padding:2px 12px; border-radius:40px; font-size:0.85rem; }
        .discount-box{ background:#fff3cd; border-radius:50px; padding:12px 20px; margin-top:15px; border:1px solid #ffe2a4; }
        .due-highlight{ background:#eef2f5; color:#b44; font-weight:700; cursor:default; border-color:#d4e0ec; }
        .btn-submit{ background:#1b4f9b; border:none; color:white; font-size:1.3rem; font-weight:700; padding:18px; width:100%; border-radius:60px; display:flex; align-items:center; justify-content:center; gap:12px; margin-top:18px; cursor:pointer; box-shadow:0 15px 20px -8px #123a60; transition:0.2s; }
        .btn-submit:hover{ background:#0f3d73; transform:translateY(-2px); }
        .btn-submit:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }
        .info-note{ text-align:center; margin-top:20px; color:#2c577c; }
        a{ color:#1b4f9b; font-weight:600; text-decoration:none; border-bottom:1px dotted #1b4f9b; }
        .loading{ text-align:center; padding:14px; background:#eef2f8; border-radius:50px; margin-top:12px; font-weight:500; display:none; }
        .error-msg{ color:#c0392b; background:#fdecea; border-radius:40px; padding:10px 16px; margin-top:12px; text-align:center; display:none; }
        .success-toast{ position:fixed; bottom:25px; left:50%; transform:translateX(-50%); background:#1e6f3f; color:white; padding:12px 28px; border-radius:60px; font-weight:600; z-index:1000; opacity:0; transition:opacity 0.2s; pointer-events:none; }
        .class-warning{ background:#fff3cd; border-left:4px solid #ffc107; padding:10px 15px; border-radius:12px; margin-bottom:15px; font-size:0.85rem; color:#856404; display:none; }
        hr{ margin:10px 0; }
        @media (max-width:650px){ .form-card{ padding:24px 18px; } .subjects-grid{ grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="form-card">
    <h2>📋 Add New Student</h2>
    
    <div class="field">
        <label>🔢 Roll Number</label>
        <input type="text" id="rollNumber" placeholder="e.g. 24" required>
    </div>
    <div class="field">
        <label>🧑 Student Name</label>
        <input type="text" id="studentName" placeholder="Full name" required>
    </div>
    <div class="field">
        <label>👨 Father Name</label>
        <input type="text" id="fatherName" placeholder="Father's name" required>
    </div>
    <div class="row2">
        <div class="field">
            <label>📅 Session</label>
            <select id="sessionSelect">
                <option value="2024-25">2024-25</option>
                <option value="2025-26" selected>2025-26</option>
                <option value="2026-27">2026-27</option>
            </select>
        </div>
        <div class="field">
            <label>🏫 Class</label>
            <select id="classSelect">
                <option value="Class 6">Class 6</option>
                <option value="Class 7">Class 7</option>
                <option value="Class 8">Class 8</option>
                <option value="Class 9">Class 9</option>
                <option value="Class 10">Class 10</option>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
            </select>
        </div>
    </div>

    <div id="classWarning" class="class-warning">⚠️ For Class 11 & 12, fee will be calculated based on selected subjects & charges below.</div>

    <div id="dynamicFeeSection"></div>

    <button class="btn-submit" id="addStudentBtn">➕ Add Student & Save to Firebase</button>
    <div class="info-note">↩ <a href="dashboard.html">Back to dashboard</a></div>
    <div id="loadingMessage" class="loading">⏳ Saving to Firebase...</div>
    <div id="errorMessage" class="error-msg"></div>
</div>
<div id="successToast" class="success-toast">✅ Student added successfully!</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
        authDomain: "quest-coaching.firebaseapp.com",
        databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "quest-coaching",
        storageBucket: "quest-coaching.firebasestorage.app",
        messagingSenderId: "131948734089",
        appId: "1:131948734089:web:f4ba25110c8b1298360858"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const feesCollection = db.collection('fees');

    // For Class 11 & 12 - Subject based
    const SUBJECTS = [
        { name: "PHYSICS", price: 3000 },
        { name: "CHEMISTRY", price: 3000 },
        { name: "BIOLOGY", price: 3000 },
        { name: "MATHS", price: 3000 },
        { name: "HINDI", price: 3000 },
        { name: "ENGLISH", price: 3000 }
    ];
    const EXTRA_FEES = [
        { name: "ADMISSION FEE", price: 500 },
        { name: "EXAM FEE (Half Yearly + Annual)", price: 500 },
        { name: "ASSIGNMENT FEE", price: 500 }
    ];

    // For Class 6-10 - Checkbox based fees
    const getTuitionFee = (className) => {
        if (className === 'Class 10') return 7200;
        return 6000; // For Class 6,7,8,9
    };

    const BASE_FEES = {
        tuition: { price: 0, label: "📚 Tuition Fee" },
        admission: { price: 500, label: "📋 Admission Fee" },
        exam: { price: 500, label: "📝 Exam Fee (Half Yearly + Annual)" },
        assignment: { price: 500, label: "📖 Assignment Fee" }
    };

    const dynamicSection = document.getElementById('dynamicFeeSection');
    const classSelect = document.getElementById('classSelect');
    const classWarning = document.getElementById('classWarning');
    const addBtn = document.getElementById('addStudentBtn');
    const loadingMsg = document.getElementById('loadingMessage');
    const errorDiv = document.getElementById('errorMessage');
    const successToast = document.getElementById('successToast');
    const rollInput = document.getElementById('rollNumber');
    const nameInput = document.getElementById('studentName');
    const fatherInput = document.getElementById('fatherName');
    const sessionSelect = document.getElementById('sessionSelect');

    // For Advanced Mode (11/12)
    let subjectCheckboxes = [];
    let extraCheckboxes = [];
    let advancedDiscountInput = null;
    let advancedReceivedInput = null;
    let advancedDueInput = null;
    
    // For Checkbox Mode (6-10)
    let feeCheckboxes = {};
    let discountInput = null;
    let receivedInput = null;
    let dueInput = null;
    let currentTuitionFee = 6000;
    
    let currentMode = 'simple';

    let toastTimeout;
    function showToast(message) {
        successToast.textContent = message;
        successToast.style.opacity = '1';
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { successToast.style.opacity = '0'; }, 2500);
    }

    function showError(message) {
        errorDiv.textContent = message;
        errorDiv.style.display = 'block';
        setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
    }

    // Calculate total for advanced mode (11/12) with discount
    function calculateAdvancedTotal() {
        let total = 0;
        subjectCheckboxes.forEach(checkbox => {
            if (checkbox.checked) total += parseInt(checkbox.getAttribute('data-price')) || 0;
        });
        extraCheckboxes.forEach(checkbox => {
            if (checkbox.checked) total += parseInt(checkbox.getAttribute('data-price')) || 0;
        });
        
        // Apply discount
        let discount = 0;
        if (advancedDiscountInput) discount = parseFloat(advancedDiscountInput.value) || 0;
        total = Math.max(0, total - discount);
        
        return total;
    }

    // Calculate total for checkbox mode (6-10)
    function calculateCheckboxTotal() {
        let total = 0;
        if (feeCheckboxes.tuition && feeCheckboxes.tuition.checked) total += currentTuitionFee;
        if (feeCheckboxes.admission && feeCheckboxes.admission.checked) total += BASE_FEES.admission.price;
        if (feeCheckboxes.exam && feeCheckboxes.exam.checked) total += BASE_FEES.exam.price;
        if (feeCheckboxes.assignment && feeCheckboxes.assignment.checked) total += BASE_FEES.assignment.price;
        
        // Apply discount
        let discount = 0;
        if (discountInput) discount = parseFloat(discountInput.value) || 0;
        total = Math.max(0, total - discount);
        
        return total;
    }

    function updateDue() {
        let total = 0;
        let received = 0;
        
        if (currentMode === 'advanced') {
            total = calculateAdvancedTotal();
            const totalSpan = document.getElementById('advancedTotalAmount');
            if (totalSpan) totalSpan.innerText = total;
            received = advancedReceivedInput ? (parseFloat(advancedReceivedInput.value) || 0) : 0;
            if (advancedDueInput) advancedDueInput.value = Math.max(0, total - received);
        } else if (currentMode === 'checkbox') {
            total = calculateCheckboxTotal();
            const totalSpan = document.getElementById('checkboxTotalAmount');
            if (totalSpan) totalSpan.innerText = total;
            received = receivedInput ? (parseFloat(receivedInput.value) || 0) : 0;
            if (dueInput) dueInput.value = Math.max(0, total - received);
        }
    }

    // Render Checkbox Mode for Class 6-10
    function renderCheckboxMode(className) {
        currentMode = 'checkbox';
        currentTuitionFee = getTuitionFee(className);
        
        dynamicSection.innerHTML = `
            <div class="checkbox-fees-box">
                <div class="section-title" style="margin-bottom:15px;">💰 Select Fees Components</div>
                
                <div class="fee-checkbox-item">
                    <input type="checkbox" id="fee_tuition" checked>
                    <label for="fee_tuition">${BASE_FEES.tuition.label}</label>
                    <span class="fee-price">₹${currentTuitionFee}/-</span>
                </div>
                
                <div class="fee-checkbox-item">
                    <input type="checkbox" id="fee_admission" checked>
                    <label for="fee_admission">${BASE_FEES.admission.label}</label>
                    <span class="fee-price">₹${BASE_FEES.admission.price}/-</span>
                </div>
                
                <div class="fee-checkbox-item">
                    <input type="checkbox" id="fee_exam" checked>
                    <label for="fee_exam">${BASE_FEES.exam.label}</label>
                    <span class="fee-price">₹${BASE_FEES.exam.price}/-</span>
                </div>
                
                <div class="fee-checkbox-item">
                    <input type="checkbox" id="fee_assignment" checked>
                    <label for="fee_assignment">${BASE_FEES.assignment.label}</label>
                    <span class="fee-price">₹${BASE_FEES.assignment.price}/-</span>
                </div>
                
                <div class="discount-box">
                    <label style="font-weight:600; margin-bottom:8px; display:block;">🎁 Discount (₹)</label>
                    <input type="number" id="discountAmount" value="0" min="0" step="1" placeholder="Enter discount amount" style="width:100%; padding:10px 15px; border-radius:40px; border:1px solid #ffe2a4; background:white;">
                </div>
                
                <div class="total-box" style="margin-top:20px;">
                    <span class="total-label">💰 Total Fees:</span>
                    <span class="total-amount" id="checkboxTotalAmount">0</span>
                </div>
                
                <div class="field" style="margin-top:15px;">
                    <label>💵 Received Amount (₹)</label>
                    <input type="number" id="receivedAmountCheckbox" value="0" min="0" step="1">
                </div>
                <div class="field">
                    <label>⏳ Due Amount (Auto)</label>
                    <input type="number" id="dueAmountCheckbox" class="due-highlight" readonly value="0">
                </div>
            </div>
        `;
        
        // Get all elements
        feeCheckboxes = {
            tuition: document.getElementById('fee_tuition'),
            admission: document.getElementById('fee_admission'),
            exam: document.getElementById('fee_exam'),
            assignment: document.getElementById('fee_assignment')
        };
        
        discountInput = document.getElementById('discountAmount');
        receivedInput = document.getElementById('receivedAmountCheckbox');
        dueInput = document.getElementById('dueAmountCheckbox');
        
        // Add event listeners
        Object.values(feeCheckboxes).forEach(cb => {
            if (cb) cb.addEventListener('change', updateDue);
        });
        if (discountInput) discountInput.addEventListener('input', updateDue);
        if (receivedInput) receivedInput.addEventListener('input', updateDue);
        
        updateDue();
    }

    // Render Advanced Mode for Class 11/12 with Discount
    function renderAdvancedMode() {
        currentMode = 'advanced';
        dynamicSection.innerHTML = `
            <div class="fees-section">
                <div class="section-title">📖 Subjects (₹3000 each)</div>
                <div class="subjects-grid" id="subjectsGrid"></div>
                <div class="section-title" style="margin-top:6px;">📌 Additional Charges</div>
                <div class="extra-charges" id="extraChargesContainer"></div>
                
                <div class="discount-box" style="margin-top:15px;">
                    <label style="font-weight:600; margin-bottom:8px; display:block;">🎁 Discount (₹)</label>
                    <input type="number" id="advancedDiscountAmount" value="0" min="0" step="1" placeholder="Enter discount amount" style="width:100%; padding:10px 15px; border-radius:40px; border:1px solid #ffe2a4; background:white;">
                </div>
                
                <div class="total-box">
                    <span class="total-label">💰 Total Fees (Auto-Calculated):</span>
                    <span class="total-amount" id="advancedTotalAmount">0</span>
                </div>
                <div class="field" style="margin-top:5px;">
                    <label>💵 Received Amount (₹)</label>
                    <input type="number" id="receivedAmountAdvanced" value="0" min="0" step="1">
                </div>
                <div class="field">
                    <label>⏳ Due Amount (Auto)</label>
                    <input type="number" id="dueAmountAdvanced" class="due-highlight" readonly value="0">
                </div>
            </div>
        `;
        
        const subjectsGrid = document.getElementById('subjectsGrid');
        subjectCheckboxes = [];
        SUBJECTS.forEach(sub => {
            const div = document.createElement('div');
            div.className = 'subject-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.id = `sub_${sub.name}`;
            cb.setAttribute('data-price', sub.price);
            cb.addEventListener('change', updateDue);
            const label = document.createElement('label');
            label.htmlFor = `sub_${sub.name}`;
            label.innerText = sub.name;
            const priceSpan = document.createElement('span');
            priceSpan.className = 'subject-price';
            priceSpan.innerText = `₹${sub.price}`;
            div.appendChild(cb);
            div.appendChild(label);
            div.appendChild(priceSpan);
            subjectsGrid.appendChild(div);
            subjectCheckboxes.push(cb);
        });
        
        const extraContainer = document.getElementById('extraChargesContainer');
        extraCheckboxes = [];
        EXTRA_FEES.forEach(extra => {
            const div = document.createElement('div');
            div.className = 'extra-item';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.id = `extra_${extra.name.replace(/\s/g, '_')}`;
            cb.setAttribute('data-price', extra.price);
            cb.addEventListener('change', updateDue);
            const label = document.createElement('label');
            label.htmlFor = cb.id;
            label.innerText = extra.name;
            const priceSpan = document.createElement('span');
            priceSpan.style.fontWeight = 'bold';
            priceSpan.style.marginLeft = '6px';
            priceSpan.innerText = `(+₹${extra.price})`;
            div.appendChild(cb);
            div.appendChild(label);
            div.appendChild(priceSpan);
            extraContainer.appendChild(div);
            extraCheckboxes.push(cb);
        });
        
        advancedDiscountInput = document.getElementById('advancedDiscountAmount');
        advancedReceivedInput = document.getElementById('receivedAmountAdvanced');
        advancedDueInput = document.getElementById('dueAmountAdvanced');
        
        if (advancedDiscountInput) advancedDiscountInput.addEventListener('input', updateDue);
        if (advancedReceivedInput) advancedReceivedInput.addEventListener('input', updateDue);
        
        updateDue();
    }

    function getSelectedSubjects() {
        if (currentMode !== 'advanced') return [];
        const selected = [];
        subjectCheckboxes.forEach((cb, idx) => {
            if (cb.checked) selected.push(SUBJECTS[idx].name);
        });
        return selected;
    }

    function getSelectedExtraFees() {
        if (currentMode !== 'advanced') return [];
        const selected = [];
        extraCheckboxes.forEach((cb, idx) => {
            if (cb.checked) selected.push(EXTRA_FEES[idx].name);
        });
        return selected;
    }

    function getTotalAmount() {
        if (currentMode === 'advanced') {
            return calculateAdvancedTotal();
        } else if (currentMode === 'checkbox') {
            return calculateCheckboxTotal();
        }
        return 0;
    }

    function getReceivedAmount() {
        if (currentMode === 'advanced') {
            return advancedReceivedInput ? (parseFloat(advancedReceivedInput.value) || 0) : 0;
        } else if (currentMode === 'checkbox') {
            return receivedInput ? (parseFloat(receivedInput.value) || 0) : 0;
        }
        return 0;
    }

    function getDiscountAmount() {
        if (currentMode === 'advanced') {
            return advancedDiscountInput ? (parseFloat(advancedDiscountInput.value) || 0) : 0;
        } else if (currentMode === 'checkbox') {
            return discountInput ? (parseFloat(discountInput.value) || 0) : 0;
        }
        return 0;
    }

    function getFeeBreakdown() {
        if (currentMode === 'advanced') {
            const subjectsTotal = getSelectedSubjects().length * 3000;
            const extraTotal = (extraCheckboxes[0]?.checked ? 500 : 0) + 
                              (extraCheckboxes[1]?.checked ? 500 : 0) + 
                              (extraCheckboxes[2]?.checked ? 500 : 0);
            const subtotal = subjectsTotal + extraTotal;
            const discount = getDiscountAmount();
            
            return {
                type: 'subject_based',
                subjects: getSelectedSubjects(),
                subjects_total: subjectsTotal,
                admission_fee: extraCheckboxes[0]?.checked ? 500 : 0,
                exam_fee: extraCheckboxes[1]?.checked ? 500 : 0,
                assignment_fee: extraCheckboxes[2]?.checked ? 500 : 0,
                subtotal: subtotal,
                discount: discount,
                total: Math.max(0, subtotal - discount)
            };
        } else if (currentMode === 'checkbox') {
            let breakdown = {
                type: 'checkbox_based',
                tuition: feeCheckboxes.tuition?.checked ? currentTuitionFee : 0,
                admission: feeCheckboxes.admission?.checked ? BASE_FEES.admission.price : 0,
                exam: feeCheckboxes.exam?.checked ? BASE_FEES.exam.price : 0,
                assignment: feeCheckboxes.assignment?.checked ? BASE_FEES.assignment.price : 0,
                discount: getDiscountAmount()
            };
            breakdown.subtotal = breakdown.tuition + breakdown.admission + breakdown.exam + breakdown.assignment;
            breakdown.total = Math.max(0, breakdown.subtotal - breakdown.discount);
            return breakdown;
        }
        return {};
    }

    function resetForm() {
        rollInput.value = '';
        nameInput.value = '';
        fatherInput.value = '';
        
        if (currentMode === 'advanced') {
            subjectCheckboxes.forEach(cb => cb.checked = false);
            extraCheckboxes.forEach(cb => cb.checked = false);
            if (advancedDiscountInput) advancedDiscountInput.value = '0';
            if (advancedReceivedInput) advancedReceivedInput.value = '0';
        } else if (currentMode === 'checkbox') {
            if (feeCheckboxes.tuition) feeCheckboxes.tuition.checked = true;
            if (feeCheckboxes.admission) feeCheckboxes.admission.checked = true;
            if (feeCheckboxes.exam) feeCheckboxes.exam.checked = true;
            if (feeCheckboxes.assignment) feeCheckboxes.assignment.checked = true;
            if (discountInput) discountInput.value = '0';
            if (receivedInput) receivedInput.value = '0';
        }
        
        updateDue();
        rollInput.focus();
    }

    function onClassChange() {
        const selectedClass = classSelect.value;
        
        if (selectedClass === 'Class 11' || selectedClass === 'Class 12') {
            classWarning.style.display = 'block';
            renderAdvancedMode();
        } else {
            classWarning.style.display = 'none';
            renderCheckboxMode(selectedClass);
        }
    }

    addBtn.addEventListener('click', async function() {
        errorDiv.style.display = 'none';
        
        const roll = rollInput.value.trim();
        const name = nameInput.value.trim();
        const father = fatherInput.value.trim();
        const session = sessionSelect.value;
        const classVal = classSelect.value;
        
        if (!roll || !name || !father) {
            showError('❌ Please fill Roll Number, Student Name and Father Name');
            return;
        }
        
        const totalAmount = getTotalAmount();
        const receivedAmount = getReceivedAmount();
        const dueAmount = Math.max(0, totalAmount - receivedAmount);
        
        let studentData = {
            roll_number: roll,
            student_name: name,
            father_name: father,
            class: classVal,
            session: session,
            total_amount: totalAmount,
            received_amount: receivedAmount,
            due_amount: dueAmount,
            discount_applied: getDiscountAmount(),
            fee_breakdown: getFeeBreakdown(),
            created_at: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        loadingMsg.style.display = 'block';
        addBtn.disabled = true;
        
        try {
            await feesCollection.add(studentData);
            showToast(`✅ ${name} added successfully! (Total: ₹${totalAmount})`);
            resetForm();
        } catch (error) {
            console.error("Firestore error:", error);
            showError(`❌ Save failed: ${error.message}`);
        } finally {
            loadingMsg.style.display = 'none';
            addBtn.disabled = false;
        }
    });
    
    classSelect.addEventListener('change', onClassChange);
    onClassChange();
    
    const fields = ['rollNumber', 'studentName', 'fatherName'];
    fields.forEach(id => {
        const el = document.getElementById(id);
        if(el) el.addEventListener('keypress', (e) => { if(e.key === 'Enter') addBtn.click(); });
    });
</script>
</body>
</html>
