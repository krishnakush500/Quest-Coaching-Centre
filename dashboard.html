<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>GYAN SEVA — Result Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background:linear-gradient(to bottom, #f5f5f5, #e0e7ff); min-height:100vh; padding:20px; }
    .container { max-width:1200px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 5px 20px rgba(0,0,0,0.1); overflow:hidden; }
    
    /* Header with single logo */
    .header { background:linear-gradient(to right,#1a237e,#283593,#303f9f); color:white; padding:25px 20px; text-align:center; }
    .header-main { display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; }
    .coaching-logo { width:80px; height:80px; border-radius:50%; border:3px solid #ffc107; object-fit:cover; background:#fff; }
    .school-name { font-size:1.8rem; font-weight:700; }
    .location { font-size:0.9rem; margin-top:5px; opacity:0.9; }
    
    /* Director info - with phone number */
    .director-info { display:flex; align-items:center; justify-content:center; margin-top:15px; gap:12px; flex-wrap:wrap; }
    .director-details { text-align:center; }
    .director-details h3 { font-size:1rem; color:#ffc107; margin-bottom:4px; }
    .director-details p { font-size:0.85rem; opacity:0.9; }
    
    /* Tabs */
    .main-tabs { display:flex; background:white; border-bottom:2px solid #1a237e; flex-wrap:wrap; }
    .tab-btn { flex:1; padding:15px; font-size:1rem; font-weight:600; border:none; background:transparent; color:#666; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; border-bottom:3px solid transparent; }
    .tab-btn.active { color:#1a237e; border-bottom:3px solid #1a237e; background:#f0f7ff; }
    .tab-content { display:none; padding:25px; background:#f9f9f9; min-height:500px; }
    .tab-content.active { display:block; }
    
    /* Results */
    .section-title { font-size:1.4rem; color:#1a237e; text-align:center; margin-bottom:20px; display:flex; align-items:center; justify-content:center; gap:8px; }
    .results-list { display:grid; gap:12px; margin-bottom:20px; }
    .result-item { background:white; padding:15px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); cursor:pointer; border-left:4px solid #1a237e; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
    .roll-input-section { background:white; padding:20px; border-radius:10px; margin-top:15px; text-align:center; display:none; }
    .input-group { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .input-group input { padding:10px; border-radius:8px; border:1px solid #ccc; width:200px; }
    .result-btn { padding:10px 20px; background:#1a237e; color:white; border:none; border-radius:8px; cursor:pointer; }
    .result-card { display:none; background:white; border-radius:12px; padding:20px; margin-top:20px; box-shadow:0 5px 15px rgba(0,0,0,0.1); overflow-x:auto; }
    .result-card-header { text-align:center; border-bottom:2px solid #1a237e; padding-bottom:10px; margin-bottom:15px; }
    .student-info { background:#f5f5f5; padding:10px; border-radius:8px; margin-bottom:15px; display:flex; flex-wrap:wrap; gap:15px; justify-content:space-between; }
    .marks-table { width:100%; border-collapse:collapse; min-width:400px; }
    .marks-table th { background:#1a237e; color:white; padding:8px; text-align:left; }
    .marks-table td { padding:8px; border-bottom:1px solid #ddd; }
    .total-marks { background:#e8f5e8 !important; font-weight:bold; }
    .percentage-display { text-align:center; font-size:1.2rem; font-weight:bold; margin-top:15px; }
    .action-buttons { display:flex; justify-content:center; gap:10px; margin-top:20px; flex-wrap:wrap; }
    .download-btn { background:#28a745; color:white; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; }
    .back-btn { background:#6c757d; color:white; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; }
    
    /* Create Result */
    .create-result-form { background:white; padding:20px; border-radius:12px; }
    .create-result-form input, .create-result-form textarea { width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:8px; }
    .btn-publish { background:#10b981; color:white; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
    footer { text-align:center; padding:15px; color:#666; font-size:0.8rem; background:#f5f5f5; }
    
    /* Mobile Responsive */
    @media (max-width:768px){
      .school-name{ font-size:1.3rem; }
      .coaching-logo{ width:60px; height:60px; }
      .tab-btn{ font-size:0.8rem; padding:10px; }
      .header-main{ gap:10px; }
      .director-details h3{ font-size:0.9rem; }
    }
    @media (max-width:480px){
      .school-name{ font-size:1.1rem; }
      .coaching-logo{ width:50px; height:50px; }
      .tab-btn{ font-size:0.7rem; padding:8px; }
      .section-title{ font-size:1.1rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header" id="coachingHeader">
    <div class="header-main">
      <img id="coachingLogo" class="coaching-logo" src="https://via.placeholder.com/80?text=GYAN" alt="Logo" onerror="this.src='https://via.placeholder.com/80?text=GYAN'">
      <div>
        <h1 class="school-name" id="coachingName">GYAN SEVA</h1>
        <p class="location" id="coachingLocation">Loading...</p>
      </div>
    </div>
    <div class="director-info">
      <div class="director-details">
        <h3><i class="fas fa-user-tie"></i> <span id="directorName">Director</span></h3>
        <p><i class="fas fa-phone"></i> <span id="directorPhone">---</span></p>
      </div>
    </div>
  </div>

  <div class="main-tabs">
    <button class="tab-btn active" onclick="switchTab('published')"><i class="fas fa-chart-line"></i> Published Results</button>
    <button class="tab-btn" onclick="switchTab('create')"><i class="fas fa-plus-circle"></i> Create Result</button>
  </div>

  <div id="publishedTab" class="tab-content active">
    <div class="results-section">
      <h2 class="section-title"><i class="fas fa-history"></i> Previous Results</h2>
      <div id="resultsList" class="results-list">Loading results...</div>
      <div id="rollInputSection" class="roll-input-section" style="display:none;">
        <h3 id="selectedExamName">Enter Roll Number</h3>
        <div class="input-group"><input type="text" id="rollInput" placeholder="Enter Roll Number"><button class="result-btn" onclick="fetchResult()">📑 Get Result</button><button class="result-btn" onclick="goBack()" style="background:#666;">⬅ Back</button></div>
      </div>
      <div id="resultCard" class="result-card" style="display:none;">
        <div class="result-card-header"><h2 id="resultExamName">Exam Name</h2></div>
        <div class="student-info"><div><strong>Student Name:</strong> <span id="studentName">-</span></div><div><strong>Roll Number:</strong> <span id="studentRoll">-</span></div></div>
        <table class="marks-table"><thead><tr><th>Subject</th><th>Marks</th><th>Total</th><th>Percentage</th></tr></thead><tbody id="marksBody"></tbody></table>
        <div class="percentage-display" id="totalPercent">Total: 0%</div>
        <div class="action-buttons"><button class="download-btn" onclick="downloadPDF()">📥 Download PDF</button><button class="back-btn" onclick="goBack()">⬅ Back</button></div>
      </div>
    </div>
  </div>

  <div id="createTab" class="tab-content">
    <div class="create-result-form">
      <h2><i class="fas fa-edit"></i> Create New Result</h2>
      <input type="text" id="examName" placeholder="Exam Name (e.g., March 2025)">
      <input type="date" id="examDate">
      <input type="text" id="subjects" placeholder="Subjects (comma separated, e.g., Hindi,English,Maths,Science)">
      <textarea id="marksData" rows="6" placeholder='[{"rollNo":"101","name":"Ram","marks":{"Hindi":85,"English":90,"Maths":78}}]'></textarea>
      <button class="btn-publish" onclick="publishResult()"><i class="fas fa-cloud-upload-alt"></i> Publish Result</button>
      <div id="publishStatus"></div>
    </div>
  </div>
  <footer>Powered by GYAN SEVA — Result ki seva, Gyan ki seva</footer>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, addDoc, getDocs, query, where, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const urlParams = new URLSearchParams(window.location.search);
  const coachingId = urlParams.get('id');
  let coachingData = null;
  let currentResultId = null;

  async function loadCoaching() {
    if(!coachingId) return;
    const docRef = doc(db, "coachings", coachingId);
    const snap = await getDoc(docRef);
    if(snap.exists()) {
      coachingData = snap.data();
      document.getElementById('coachingName').innerText = coachingData.name || "GYAN SEVA";
      document.getElementById('coachingLocation').innerText = coachingData.location || "Bihar, India";
      document.getElementById('directorName').innerText = coachingData.director || 'Director';
      document.getElementById('directorPhone').innerText = coachingData.phone || 'Not provided';
      if(coachingData.logo && coachingData.logo.trim() !== '') {
        document.getElementById('coachingLogo').src = coachingData.logo;
      }
    }
    loadResults();
  }

  async function loadResults() {
    const q = query(collection(db, "results"), where("coachingId", "==", coachingId));
    const snap = await getDocs(q);
    const container = document.getElementById('resultsList');
    if(snap.empty) { container.innerHTML = '<p>No results published yet.</p>'; return; }
    let html = '';
    snap.forEach(docSnap => { const r = docSnap.data(); html += `<div class="result-item" onclick="selectExam('${docSnap.id}', '${r.examName}')"><div><strong>${r.examName}</strong><br>${r.examDate}</div><i class="fas fa-chevron-right"></i></div>`; });
    container.innerHTML = html;
  }

  window.selectExam = (resultId, examName) => {
    currentResultId = resultId;
    document.getElementById('selectedExamName').innerHTML = `Enter Roll Number for: ${examName}`;
    document.getElementById('resultsList').style.display = 'none';
    document.getElementById('rollInputSection').style.display = 'block';
    document.getElementById('resultCard').style.display = 'none';
  };

  window.fetchResult = async () => {
    const roll = document.getElementById('rollInput').value.trim();
    if(!roll) { alert("Enter roll number"); return; }
    const marksRef = collection(db, "results", currentResultId, "marks");
    const snap = await getDocs(marksRef);
    let student = null;
    snap.forEach(d => { if(d.id === roll) student = d.data(); });
    if(!student) { alert("Roll number not found"); return; }
    document.getElementById('rollInputSection').style.display = 'none';
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('studentName').innerText = student.name;
    document.getElementById('studentRoll').innerText = roll;
    let html = '', total=0, count=0;
    for(let [sub, mark] of Object.entries(student.marks)) { html += `<tr><td>${sub}</td><td>${mark}</td><td>100</td><td>${mark}%</td></tr>`; total += mark; count++; }
    const percent = (total/(count*100))*100;
    html += `<tr class="total-marks"><td><strong>Total</strong></td><td><strong>${total}</strong></td><td><strong>${count*100}</strong></td><td><strong>${percent.toFixed(2)}%</strong></td></tr>`;
    document.getElementById('marksBody').innerHTML = html;
    document.getElementById('totalPercent').innerHTML = `Total Percentage: ${percent.toFixed(2)}%`;
  };

  window.publishResult = async () => {
    const examName = document.getElementById('examName').value;
    const examDate = document.getElementById('examDate').value;
    const subjectsStr = document.getElementById('subjects').value;
    const marksJson = document.getElementById('marksData').value;
    if(!examName || !marksJson) { alert("Fill exam name and marks data"); return; }
    let students; try { students = JSON.parse(marksJson); } catch(e) { alert("Invalid JSON"); return; }
    const newResult = await addDoc(collection(db, "results"), { coachingId, examName, examDate, subjects: subjectsStr.split(','), publishedAt: new Date().toISOString() });
    for(let s of students) await setDoc(doc(db, "results", newResult.id, "marks", s.rollNo), { name: s.name, marks: s.marks });
    document.getElementById('publishStatus').innerHTML = `<p style="color:green;">✅ Result published! <a href="dashboard.html?id=${coachingId}" target="_blank">View Dashboard</a></p>`;
    document.getElementById('examName').value = ''; document.getElementById('marksData').value = '';
    loadResults();
  };

  window.goBack = () => { location.reload(); };
  window.switchTab = (tab) => {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(tab+'Tab').classList.add('active');
    document.querySelectorAll('.tab-btn').forEach((btn,i) => { if((tab==='published' && i===0) || (tab==='create' && i===1)) btn.classList.add('active'); else btn.classList.remove('active'); });
  };
  window.downloadPDF = () => { window.print(); };
  loadCoaching();
</script>
</body>
</html>
