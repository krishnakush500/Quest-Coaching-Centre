<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>📚 Previous Attendance · Quest Coaching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f6ff;
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0, 40, 100, 0.12);
      padding: 20px 22px 28px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e6effa;
      padding-bottom: 14px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(145deg, #0a2a66, #1f4b9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 i {
      background: #8b5cf6;
      -webkit-text-fill-color: white;
      padding: 6px 10px;
      border-radius: 40px;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.25);
    }
    .header .close-btn {
      background: #e2e8f0;
      border: none;
      border-radius: 40px;
      padding: 8px 20px;
      font-weight: 600;
      color: #1a237e;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header .close-btn:hover { background: #cbd5e1; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      background: #f4f9ff;
      padding: 12px 18px;
      border-radius: 60px;
      margin-bottom: 20px;
      border: 1px solid #d7e5fc;
    }
    .filters label {
      font-weight: 600;
      color: #0f3b7a;
      font-size: 0.85rem;
    }
    .filters select, .filters input[type="date"] {
      background: white;
      border: 1px solid #b8cff0;
      border-radius: 40px;
      padding: 8px 16px;
      font-weight: 500;
      color: #0a2a66;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .filters .load-btn {
      background: #8b5cf6;
      border: none;
      border-radius: 40px;
      padding: 8px 24px;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }
    .filters .load-btn:hover { background: #7c3aed; }

    .date-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .date-item {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 130px;
    }
    .date-item:hover {
      border-color: #8b5cf6;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.15);
    }
    .date-item.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
      color: white;
    }
    .date-item .day {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .date-item .month {
      font-size: 0.75rem;
      opacity: 0.8;
    }
    .date-item .status {
      font-size: 0.65rem;
      margin-top: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      background: #d1fae5;
      color: #065f46;
      font-weight: 600;
    }
    .date-item.active .status {
      background: rgba(255,255,255,0.3);
      color: white;
    }

    .attendance-detail {
      display: none;
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      margin-top: 15px;
    }
    .attendance-detail .detail-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .attendance-detail .detail-header h3 {
      color: #0a2a66;
      font-size: 1.1rem;
    }
    .attendance-detail .detail-header .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 40px;
      padding: 6px 18px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-edit { background: #f59e0b; color: white; }
    .btn-edit:hover { background: #d97706; }
    .btn-delete { background: #dc3545; color: white; }
    .btn-delete:hover { background: #b91c1c; }
    .btn-download { background: #10b981; color: white; }
    .btn-download:hover { background: #059669; }
    .btn-save { background: #1b4f9b; color: white; }
    .btn-save:hover { background: #0a2a66; }
    .btn-cancel { background: #e2e8f0; color: #1a237e; }
    .btn-cancel:hover { background: #cbd5e1; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      padding: 10px 8px;
      font-weight: 600;
      color: #0a2a66;
      background: #e7f0fe;
      border-bottom: 1.5px solid #bdd2f0;
    }
    td {
      padding: 8px 8px;
      border-bottom: 1px solid #e2ecfc;
      vertical-align: middle;
    }
    .roll-badge {
      background: #e3edfe;
      padding: 2px 10px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.7rem;
      color: #0a2a66;
      display: inline-block;
    }
    .status-badge {
      padding: 3px 12px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.7rem;
      display: inline-block;
    }
    .status-present { background: #d1fae5; color: #065f46; }
    .status-absent { background: #fee2e2; color: #991b1b; }
    .status-leave { background: #fef3c7; color: #92400e; }
    .status-notmarked { background: #f1f5f9; color: #64748b; }

    .edit-select {
      border: 1px solid #c8dbf7;
      border-radius: 30px;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: white;
      color: #0a2a66;
      outline: none;
      cursor: pointer;
    }
    .edit-input {
      border: 1px solid #c8dbf7;
      border-radius: 30px;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: white;
      color: #0a2a66;
      outline: none;
      width: 100px;
    }

    .toast-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a237e;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
      max-width: 90%;
      text-align: center;
    }
    .loading-msg {
      text-align: center;
      padding: 40px 20px;
      color: #1f4b9e;
      font-size: 0.9rem;
    }
    .loading-msg i {
      font-size: 2rem;
      display: block;
      margin-bottom: 10px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      .container { padding: 14px 12px 20px; }
      .header h1 { font-size: 1.1rem; }
      .filters { padding: 10px 14px; gap: 8px 10px; border-radius: 20px; }
      .filters select, .filters input[type="date"] { font-size: 0.75rem; padding: 6px 12px; }
      .date-item { min-width: 100px; padding: 10px 14px; }
      .date-item .day { font-size: 1rem; }
      .attendance-detail { padding: 14px; }
      table { font-size: 0.7rem; }
      th, td { padding: 6px 4px; }
      .btn { font-size: 0.65rem; padding: 4px 12px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><i class="fas fa-history"></i> Previous Attendance</h1>
    <button class="close-btn" onclick="window.close()"><i class="fas fa-times"></i> Close</button>
  </div>

  <div class="filters">
    <label>Class:</label>
    <select id="classSelect">
      <option value="6th">6th</option><option value="7th">7th</option>
      <option value="8th">8th</option><option value="9th">9th</option>
      <option value="10th">10th</option>
      <option value="11th (Science)">11th (Science)</option>
      <option value="11th (Commerce)">11th (Commerce)</option>
      <option value="11th (Arts)">11th (Arts)</option>
      <option value="12th (Science)">12th (Science)</option>
      <option value="12th (Commerce)">12th (Commerce)</option>
      <option value="12th (Arts)">12th (Arts)</option>
    </select>
    <label>Month:</label>
    <input type="month" id="monthSelect">
    <button class="load-btn" id="loadBtn"><i class="fas fa-search"></i> Load</button>
  </div>

  <div id="dateListContainer">
    <div class="loading-msg"><i class="fas fa-spinner"></i> Select class and month, then click Load</div>
  </div>

  <!-- Attendance Detail -->
  <div class="attendance-detail" id="attendanceDetail">
    <div class="detail-header">
      <h3 id="detailTitle">Date: --</h3>
      <div class="actions">
        <button class="btn btn-edit" id="editBtn"><i class="fas fa-edit"></i> Edit</button>
        <button class="btn btn-save" id="saveBtn" style="display:none;"><i class="fas fa-save"></i> Save</button>
        <button class="btn btn-cancel" id="cancelBtn" style="display:none;"><i class="fas fa-times"></i> Cancel</button>
        <button class="btn btn-download" id="downloadBtn"><i class="fas fa-download"></i> Download PDF</button>
        <button class="btn btn-delete" id="deleteBtn"><i class="fas fa-trash"></i> Delete</button>
      </div>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
  // ============================================================
  // FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
    authDomain: "quest-coaching.firebaseapp.com",
    databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quest-coaching",
    storageBucket: "quest-coaching.firebasestorage.app",
    messagingSenderId: "131948734089",
    appId: "1:131948734089:web:f4ba25110c8b1298360858"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ============================================================
  // URL PARAMS
  // ============================================================
  const urlParams = new URLSearchParams(window.location.search);
  const sessionParam = urlParams.get('session') || '2026-27';
  const classParam = urlParams.get('class') || '';

  // ============================================================
  // DOM REFS
  // ============================================================
  const classSelect = document.getElementById('classSelect');
  const monthSelect = document.getElementById('monthSelect');
  const loadBtn = document.getElementById('loadBtn');
  const dateListContainer = document.getElementById('dateListContainer');
  const attendanceDetail = document.getElementById('attendanceDetail');
  const detailTitle = document.getElementById('detailTitle');
  const detailContent = document.getElementById('detailContent');
  const editBtn = document.getElementById('editBtn');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const toast = document.getElementById('toastMsg');

  // ============================================================
  // STATE
  // ============================================================
  let currentClass = '';
  let currentMonth = '';
  let currentDate = '';
  let currentStudents = [];
  let currentAttendance = {};
  let isEditing = false;
  let availableDates = [];

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    // Set default class
    if (classParam) {
      classSelect.value = classParam;
    } else {
      classSelect.value = '10th';
    }
    
    // Set default month (current month)
    const now = new Date();
    const monthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    monthSelect.value = monthStr;

    // Show session info
    detailTitle.textContent = `Session: ${sessionParam}`;
  }

  // ============================================================
  // TOAST
  // ============================================================
  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.style.display = 'block';
    toast.style.background = isError ? '#dc3545' : '#1a237e';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  // ============================================================
  // LOAD DATES FOR MONTH
  // ============================================================
  async function loadDatesForMonth() {
    currentClass = classSelect.value;
    currentMonth = monthSelect.value;

    if (!currentClass || !currentMonth) {
      showToast('Select class and month!', true);
      return;
    }

    const [year, month] = currentMonth.split('-');
    const monthNum = parseInt(month) - 1;

    dateListContainer.innerHTML = `<div class="loading-msg"><i class="fas fa-spinner"></i> Loading dates...</div>`;
    attendanceDetail.style.display = 'none';

    try {
      // 🔥 Get all students first
      let studentSnapshot = await db.collection('admissions')
        .where('classApplying', '==', currentClass)
        .where('session', '==', sessionParam)
        .get();

      if (studentSnapshot.empty) {
        studentSnapshot = await db.collection('admissions')
          .where('class', '==', currentClass)
          .where('session', '==', sessionParam)
          .get();
      }

      if (studentSnapshot.empty) {
        dateListContainer.innerHTML = `<div class="loading-msg"><i class="fas fa-users"></i> No students found in ${currentClass}</div>`;
        return;
      }

      const studentNames = [];
      studentSnapshot.forEach(doc => {
        const data = doc.data();
        studentNames.push(data.studentName || data.name || 'Unknown');
      });

      // 🔥 Check each date in the month
      const daysInMonth = new Date(parseInt(year), monthNum + 1, 0).getDate();
      availableDates = [];

      // 🔥 Parallel fetch all dates
      const datePromises = [];
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(monthNum + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        // Check first student only to know if attendance exists
        const firstStudentName = studentNames[0];
        const docRef = db.collection('attendance')
          .doc(sessionParam)
          .collection('classes')
          .doc(currentClass)
          .collection('students')
          .doc(firstStudentName)
          .collection('attendance')
          .doc(dateStr);
        datePromises.push({ date: dateStr, promise: docRef.get() });
      }

      const results = await Promise.all(datePromises.map(d => d.promise));

      results.forEach((snap, index) => {
        if (snap.exists) {
          availableDates.push(datePromises[index].date);
        }
      });

      // Render date list
      renderDateList(availableDates);

    } catch (error) {
      console.error('Error:', error);
      dateListContainer.innerHTML = `<div class="loading-msg"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
    }
  }

  // ============================================================
  // RENDER DATE LIST
  // ============================================================
  function renderDateList(dates) {
    if (dates.length === 0) {
      dateListContainer.innerHTML = `<div class="loading-msg"><i class="fas fa-calendar-times"></i> No attendance records found for this month.</div>`;
      return;
    }

    // Sort dates descending (latest first)
    dates.sort((a, b) => new Date(b) - new Date(a));

    let html = '';
    dates.forEach(dateStr => {
      const d = new Date(dateStr);
      const day = d.getDate();
      const monthName = d.toLocaleString('default', { month: 'short' });
      html += `<div class="date-item" data-date="${dateStr}">
        <div class="day">${day}</div>
        <div class="month">${monthName}</div>
        <div class="status">✓ Marked</div>
      </div>`;
    });

    dateListContainer.innerHTML = `<div class="date-list">${html}</div>`;

    // Attach click listeners
    document.querySelectorAll('.date-item').forEach(item => {
      item.addEventListener('click', function() {
        const date = this.dataset.date;
        loadAttendanceForDate(date);
        document.querySelectorAll('.date-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });
  }

  // ============================================================
  // LOAD ATTENDANCE FOR DATE
  // ============================================================
  async function loadAttendanceForDate(date) {
    currentDate = date;
    isEditing = false;

    detailTitle.textContent = `Date: ${new Date(date).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}`;
    attendanceDetail.style.display = 'block';
    detailContent.innerHTML = `<div class="loading-msg"><i class="fas fa-spinner"></i> Loading...</div>`;

    try {
      // Get students
      let studentSnapshot = await db.collection('admissions')
        .where('classApplying', '==', currentClass)
        .where('session', '==', sessionParam)
        .get();

      if (studentSnapshot.empty) {
        studentSnapshot = await db.collection('admissions')
          .where('class', '==', currentClass)
          .where('session', '==', sessionParam)
          .get();
      }

      currentStudents = [];
      studentSnapshot.forEach(doc => {
        const data = doc.data();
        currentStudents.push({
          id: doc.id,
          roll: data.rollNumber || data.rollNo || 0,
          name: data.studentName || data.name || 'Unknown'
        });
      });
      currentStudents.sort((a, b) => a.roll - b.roll);

      // 🔥 Parallel fetch attendance
      const promises = currentStudents.map(s => {
        return db.collection('attendance')
          .doc(sessionParam)
          .collection('classes')
          .doc(currentClass)
          .collection('students')
          .doc(s.name)
          .collection('attendance')
          .doc(date)
          .get();
      });

      const snaps = await Promise.all(promises);

      currentAttendance = {};
      currentStudents.forEach((s, i) => {
        if (snaps[i].exists) {
          const data = snaps[i].data();
          currentAttendance[s.roll] = {
            status: data.status || '',
            remark: data.remark || ''
          };
        } else {
          currentAttendance[s.roll] = { status: '', remark: '' };
        }
      });

      renderDetailTable();
      showViewMode();

    } catch (error) {
      console.error('Error:', error);
      detailContent.innerHTML = `<div class="loading-msg"><i class="fas fa-exclamation-circle"></i> Error: ${error.message}</div>`;
    }
  }

  // ============================================================
  // RENDER DETAIL TABLE
  // ============================================================
  function renderDetailTable() {
    let html = `<div style="overflow-x:auto;"><table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Roll</th>
          <th>Status</th>
          <th>Remark</th>
        </tr>
      </thead>
      <tbody>`;

    currentStudents.forEach(s => {
      const rec = currentAttendance[s.roll] || { status: '', remark: '' };
      const status = rec.status || 'not marked';

      if (isEditing) {
        html += `<tr>
          <td>${s.name}</td>
          <td><span class="roll-badge">${s.roll}</span></td>
          <td>
            <select class="edit-select" data-roll="${s.roll}">
              <option value="">--</option>
              <option value="present" ${status==='present'?'selected':''}>✅ Present</option>
              <option value="absent" ${status==='absent'?'selected':''}>❌ Absent</option>
              <option value="leave" ${status==='leave'?'selected':''}>🟡 Leave</option>
            </select>
          </td>
          <td>
            <input class="edit-input" type="text" value="${rec.remark || ''}" data-roll="${s.roll}" placeholder="Remark">
          </td>
        </tr>`;
      } else {
        const statusClass = status === 'present' ? 'status-present' : status === 'absent' ? 'status-absent' : status === 'leave' ? 'status-leave' : 'status-notmarked';
        const statusLabel = status === 'present' ? '✅ Present' : status === 'absent' ? '❌ Absent' : status === 'leave' ? '🟡 Leave' : '⏳ Not Marked';
        html += `<tr>
          <td>${s.name}</td>
          <td><span class="roll-badge">${s.roll}</span></td>
          <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
          <td>${rec.remark || '-'}</td>
        </tr>`;
      }
    });

    html += `</tbody></table></div>`;
    detailContent.innerHTML = html;

    if (isEditing) {
      // Attach edit listeners
      document.querySelectorAll('.edit-select').forEach(sel => {
        sel.addEventListener('change', function() {
          const roll = parseInt(this.dataset.roll);
          currentAttendance[roll] = currentAttendance[roll] || {};
          currentAttendance[roll].status = this.value;
        });
      });
      document.querySelectorAll('.edit-input').forEach(inp => {
        inp.addEventListener('input', function() {
          const roll = parseInt(this.dataset.roll);
          currentAttendance[roll] = currentAttendance[roll] || {};
          currentAttendance[roll].remark = this.value;
        });
      });
    }
  }

  // ============================================================
  // SHOW VIEW MODE
  // ============================================================
  function showViewMode() {
    isEditing = false;
    editBtn.style.display = 'flex';
    saveBtn.style.display = 'none';
    cancelBtn.style.display = 'none';
    downloadBtn.style.display = 'flex';
    deleteBtn.style.display = 'flex';
  }

  // ============================================================
  // SHOW EDIT MODE
  // ============================================================
  function showEditMode() {
    isEditing = true;
    editBtn.style.display = 'none';
    saveBtn.style.display = 'flex';
    cancelBtn.style.display = 'flex';
    downloadBtn.style.display = 'none';
    deleteBtn.style.display = 'none';
    renderDetailTable();
  }

  // ============================================================
  // BUTTON LISTENERS
  // ============================================================
  loadBtn.addEventListener('click', loadDatesForMonth);

  editBtn.addEventListener('click', function() {
    showEditMode();
    showToast('✏️ Edit mode enabled');
  });

  cancelBtn.addEventListener('click', function() {
    loadAttendanceForDate(currentDate);
    showToast('❌ Edit cancelled');
  });

  saveBtn.addEventListener('click', async function() {
    try {
      const batch = db.batch();
      for (const s of currentStudents) {
        const rec = currentAttendance[s.roll] || { status: '', remark: '' };
        const docRef = db.collection('attendance')
          .doc(sessionParam)
          .collection('classes')
          .doc(currentClass)
          .collection('students')
          .doc(s.name)
          .collection('attendance')
          .doc(currentDate);
        batch.set(docRef, {
          status: rec.status || '',
          remark: rec.remark || '',
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          roll: s.roll,
          date: currentDate,
          session: sessionParam,
          class: currentClass
        });
      }
      await batch.commit();
      showToast('✅ Attendance updated!');
      loadAttendanceForDate(currentDate);
    } catch (error) {
      showToast('❌ Error: ' + error.message, true);
    }
  });

  deleteBtn.addEventListener('click', async function() {
    if (!confirm(`Delete attendance for ${new Date(currentDate).toLocaleDateString('en-IN')}?`)) return;

    try {
      const batch = db.batch();
      for (const s of currentStudents) {
        const docRef = db.collection('attendance')
          .doc(sessionParam)
          .collection('classes')
          .doc(currentClass)
          .collection('students')
          .doc(s.name)
          .collection('attendance')
          .doc(currentDate);
        batch.delete(docRef);
      }
      await batch.commit();
      showToast('🗑️ Attendance deleted!');
      attendanceDetail.style.display = 'none';
      loadDatesForMonth();
    } catch (error) {
      showToast('❌ Error: ' + error.message, true);
    }
  });

  // ============================================================
  // DOWNLOAD PDF
  // ============================================================
  downloadBtn.addEventListener('click', function() {
    if (currentStudents.length === 0) {
      showToast('No data to download!', true);
      return;
    }

    const dateStr = new Date(currentDate).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

    let content = `📋 ATTENDANCE REPORT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🏫 QUEST COACHING CENTRE
📚 Class: ${currentClass}  |  📆 Session: ${sessionParam}  |  📅 Date: ${dateStr}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;

    let present = 0, absent = 0, leave = 0, notMarked = 0;

    content += `  ┌─────────────────────────────────┬──────────┬──────────────┬────────────────────┐\n`;
    content += `  │ Student Name                    │ Roll No  │ Status       │ Remarks            │\n`;
    content += `  ├─────────────────────────────────┼──────────┼──────────────┼────────────────────┤\n`;

    currentStudents.forEach(s => {
      const rec = currentAttendance[s.roll] || { status: '', remark: '' };
      const status = rec.status || 'NOT MARKED';
      content += `  │ ${s.name.padEnd(31)} │ ${String(s.roll).padEnd(8)} │ ${status.toUpperCase().padEnd(12)} │ ${(rec.remark || '-').padEnd(18)} │\n`;
      if (status === 'present') present++;
      else if (status === 'absent') absent++;
      else if (status === 'leave') leave++;
      else notMarked++;
    });

    content += `  └─────────────────────────────────┴──────────┴──────────────┴────────────────────┘\n\n`;
    content += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    content += `📊 SUMMARY: ✅ Present: ${present} | ❌ Absent: ${absent} | 🟡 Leave: ${leave} | ⏳ Not Marked: ${notMarked} | 📌 Total: ${currentStudents.length}\n`;
    content += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    content += `📅 Generated: ${new Date().toLocaleString()}\n`;
    content += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

    const blob = new Blob([content], { type: 'application/pdf;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if (!win) {
      const a = document.createElement('a');
      a.href = url;
      a.download = `Attendance_${currentClass}_${currentDate}.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    showToast('📥 PDF downloaded!');
  });

  // ============================================================
  // INIT CALL
  // ============================================================
  init();
  console.log('✅ Previous Attendance Page Loaded!');
</script>
</body>
</html>
