<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>📋 Attendance · Quest Coaching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f6ff;
      min-height: 100vh;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px 32px 28px 28px;
      box-shadow: 0 20px 50px rgba(0, 40, 100, 0.12);
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.6);
      height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .fixed-header {
      padding: 10px 14px 0 14px;
      flex-shrink: 0;
      background: white;
      border-radius: 32px 32px 0 0;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1.5px solid #e6effa;
      padding-bottom: 8px;
    }
    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(145deg, #0a2a66, #1f4b9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header h1 i {
      background: #1f4b9e;
      -webkit-text-fill-color: white;
      padding: 4px 8px;
      border-radius: 40px;
      font-size: 0.9rem;
      box-shadow: 0 4px 10px rgba(20, 60, 150, 0.2);
    }
    .header .date-display {
      background: #eef5fe;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 600;
      color: #0a2a66;
      border: 1px solid #c7daf5;
      font-size: 0.7rem;
    }
    .header .date-display i { margin-right: 4px; }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      background: #f4f9ff;
      padding: 6px 12px;
      border-radius: 40px;
      margin-bottom: 8px;
      border: 1px solid #d7e5fc;
    }
    .top-controls .session-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .top-controls .session-group label {
      font-weight: 600;
      color: #0f3b7a;
      font-size: 0.7rem;
    }
    .top-controls .session-group select {
      border: 1px solid #b8cff0;
      border-radius: 30px;
      padding: 4px 10px;
      font-weight: 500;
      color: #0a2a66;
      font-size: 0.75rem;
      outline: none;
      background: white;
      cursor: pointer;
    }
    .top-controls .prev-attendance-btn {
      background: #8b5cf6;
      border: none;
      border-radius: 40px;
      padding: 4px 14px;
      color: white;
      font-weight: 600;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2);
      cursor: pointer;
      border: 1px solid #a78bfa;
    }
    .top-controls .prev-attendance-btn:hover { background: #7c3aed; }
    .top-controls .view-parent-btn {
      margin-left: auto;
      background: #0a2a66;
      border: none;
      border-radius: 40px;
      padding: 4px 14px;
      color: white;
      font-weight: 600;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(10, 42, 102, 0.2);
      cursor: pointer;
      border: 1px solid #3f6ec0;
    }
    .top-controls .view-parent-btn:hover { background: #13458b; }

    .class-filter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      background: #f4f9ff;
      padding: 6px 12px;
      border-radius: 40px;
      margin-bottom: 8px;
      border: 1px solid #d7e5fc;
    }
    .class-filter label {
      font-weight: 600;
      color: #0f3b7a;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
    }
    .class-filter select {
      background: white;
      border: 1px solid #b8cff0;
      border-radius: 30px;
      padding: 4px 12px 4px 10px;
      font-weight: 500;
      color: #0a2a66;
      font-size: 0.75rem;
      outline: none;
      cursor: pointer;
      min-width: 100px;
    }

    .class-holiday-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fee2e2;
      padding: 2px 10px 2px 8px;
      border-radius: 30px;
      border: 1px solid #fecaca;
    }
    .class-holiday-group input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: #dc3545;
      cursor: pointer;
    }
    .class-holiday-group label {
      font-weight: 600;
      color: #991b1b;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .holiday-reason-group {
      display: none;
      align-items: center;
      gap: 4px;
      background: #fff5f5;
      padding: 2px 10px 2px 8px;
      border-radius: 30px;
      border: 2px solid #dc3545;
    }
    .holiday-reason-group input {
      border: none;
      background: transparent;
      padding: 3px 6px;
      font-size: 0.7rem;
      color: #991b1b;
      font-weight: 600;
      width: 100px;
      outline: none;
    }
    .holiday-reason-group input::placeholder { color: #f87171; font-weight: 400; }
    .holiday-reason-group i { color: #dc3545; font-size: 0.7rem; }

    .holiday-msg {
      background: #fef2f2;
      border: 2px solid #fecaca;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      color: #991b1b;
      margin-bottom: 8px;
      display: none;
    }
    .holiday-msg i { font-size: 1.5rem; display: block; margin-bottom: 4px; }
    .holiday-msg h2 { font-size: 1rem; }
    .holiday-msg .reason-text { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: #dc3545; 
      background: white; 
      padding: 4px 14px; 
      border-radius: 30px; 
      display: inline-block;
      margin-top: 4px;
    }

    .attendance-done-msg {
      background: #d1fae5;
      border: 2px solid #10b981;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      color: #065f46;
      margin-bottom: 8px;
      display: none;
    }
    .attendance-done-msg i { font-size: 1.5rem; display: block; margin-bottom: 4px; color: #10b981; }
    .attendance-done-msg h2 { font-size: 1rem; }

    .checking-msg {
      background: #e0f2fe;
      border: 2px solid #0ea5e9;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      color: #0369a1;
      margin-bottom: 8px;
      display: none;
    }
    .checking-msg i { font-size: 1.5rem; display: block; margin-bottom: 4px; color: #0ea5e9; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .save-btn-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .save-btn {
      background: #10b981;
      border: none;
      padding: 5px 16px;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      cursor: pointer;
    }
    .save-btn:hover { background: #059669; }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 🔥 SAVE HOLIDAY BUTTON */
    .save-holiday-btn {
      background: #dc3545;
      border: none;
      padding: 5px 18px;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      font-size: 0.75rem;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
      cursor: pointer;
    }
    .save-holiday-btn:hover { background: #b91c1c; }
    .save-holiday-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .refresh-btn {
      background: #e2e8f0;
      border: none;
      padding: 5px 12px;
      border-radius: 40px;
      color: #1a237e;
      font-weight: 600;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #cbd5e1; }

    .summary-counter {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      background: #f8fafc;
      padding: 4px 12px;
      border-radius: 40px;
      margin-bottom: 6px;
      border: 1px solid #e2e8f0;
      font-size: 0.65rem;
      font-weight: 600;
    }
    .summary-counter .count-item {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .summary-counter .count-item .num {
      font-weight: 700;
      font-size: 0.8rem;
    }
    .count-total { color: #1a237e; }
    .count-present { color: #10b981; }
    .count-absent { color: #dc3545; }
    .count-leave { color: #2563eb; }
    .count-pending { color: #f59e0b; }

    .table-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px 8px;
      margin: 0 6px 6px 6px;
      border-radius: 16px;
      background: #fafcff;
      border: 1px solid #e2e8f0;
    }
    .table-scroll::-webkit-scrollbar { width: 4px; }
    .table-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .table-scroll::-webkit-scrollbar-thumb { background: #b8cff0; border-radius: 10px; }
    .table-scroll::-webkit-scrollbar-thumb:hover { background: #1f4b9e; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      min-width: 500px;
    }
    th {
      text-align: left;
      padding: 8px 6px 6px 6px;
      font-weight: 600;
      color: #0a2a66;
      background: #e7f0fe;
      border-bottom: 1.5px solid #bdd2f0;
      position: sticky;
      top: 0;
      z-index: 5;
      font-size: 0.7rem;
    }
    td {
      padding: 6px 6px;
      border-bottom: 1px solid #e2ecfc;
      vertical-align: middle;
      background: white;
    }
    tr:last-child td { border-bottom: none; }

    .student-name {
      font-weight: 600;
      color: #0a2a66;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
    }
    .roll-badge {
      background: #e3edfe;
      padding: 2px 8px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.6rem;
      color: #0a2a66;
      display: inline-block;
    }

    .attendance-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 6px;
      align-items: center;
    }
    .attendance-actions label {
      display: flex;
      align-items: center;
      gap: 2px;
      font-weight: 600;
      font-size: 0.65rem;
      cursor: pointer;
      padding: 2px 6px 2px 4px;
      border-radius: 30px;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .attendance-actions label input[type="radio"] {
      width: 12px;
      height: 12px;
      cursor: pointer;
      margin: 0;
    }
    .attendance-actions label.present-option {
      background: #ecfdf5;
      border-color: #d1fae5;
      color: #065f46;
    }
    .attendance-actions label.present-option:has(input:checked) {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }
    .attendance-actions label.present-option:has(input:checked) input[type="radio"] { accent-color: white; }
    .attendance-actions label.absent-option {
      background: #fef2f2;
      border-color: #fee2e2;
      color: #991b1b;
    }
    .attendance-actions label.absent-option:has(input:checked) {
      background: #dc3545;
      border-color: #dc3545;
      color: white;
    }
    .attendance-actions label.absent-option:has(input:checked) input[type="radio"] { accent-color: white; }
    .attendance-actions label.leave-option {
      background: #eff6ff;
      border-color: #dbeafe;
      color: #1e40af;
    }
    .attendance-actions label.leave-option:has(input:checked) {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }
    .attendance-actions label.leave-option:has(input:checked) input[type="radio"] { accent-color: white; }

    .remark-input {
      border: 1px solid #c8dbf7;
      border-radius: 30px;
      padding: 3px 8px;
      font-size: 0.65rem;
      background: white;
      width: 60px;
      color: #0a2a66;
    }
    .remark-input:focus {
      border-color: #0a2a66;
      outline: none;
      box-shadow: 0 0 0 2px rgba(10, 42, 102, 0.1);
    }

    .toast-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a237e;
      color: white;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
      max-width: 90%;
      text-align: center;
    }
    .no-students-msg {
      text-align: center;
      padding: 30px 20px;
      color: #666;
      font-size: 0.8rem;
    }
    .no-students-msg i {
      font-size: 2rem;
      color: #cbd5e1;
      display: block;
      margin-bottom: 8px;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.95);
      z-index: 9999;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .loading-card {
      background: white;
      padding: 30px 45px;
      border-radius: 24px;
      text-align: center;
      min-width: 280px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .loading-card i {
      font-size: 2.2rem;
      color: #1b4f9b;
      animation: spin 1s linear infinite;
      display: block;
      margin-bottom: 12px;
    }
    .loading-card p {
      color: #334155;
      font-size: 0.9rem;
    }
    .loading-percent {
      font-size: 2rem;
      font-weight: 700;
      color: #1a237e;
      margin-top: 8px;
    }

    @media (max-width: 720px) {
      .fixed-header { padding: 6px 10px 0 10px; }
      .header h1 { font-size: 0.95rem; }
      .header h1 i { font-size: 0.75rem; padding: 3px 6px; }
      .header .date-display { font-size: 0.6rem; padding: 3px 10px; }
      .top-controls { padding: 4px 10px; gap: 4px 8px; }
      .top-controls .session-group select { font-size: 0.65rem; padding: 3px 8px; }
      .top-controls .view-parent-btn { font-size: 0.6rem; padding: 3px 10px; }
      .top-controls .prev-attendance-btn { font-size: 0.6rem; padding: 3px 10px; }
      .class-filter { padding: 4px 10px; gap: 4px 8px; }
      .class-filter select { font-size: 0.65rem; padding: 3px 8px; min-width: 80px; }
      .class-holiday-group label { font-size: 0.6rem; }
      .holiday-reason-group input { font-size: 0.6rem; width: 70px; }
      .summary-counter { font-size: 0.55rem; padding: 3px 10px; gap: 3px 8px; }
      .summary-counter .count-item .num { font-size: 0.7rem; }
      .table-scroll { padding: 0 4px 4px 4px; margin: 0 4px 4px 4px; }
      table { font-size: 0.65rem; min-width: 400px; }
      th { font-size: 0.6rem; padding: 5px 4px; }
      td { padding: 4px 4px; }
      .student-name { font-size: 0.65rem; }
      .roll-badge { font-size: 0.5rem; padding: 1px 6px; }
      .attendance-actions label { font-size: 0.55rem; padding: 1px 4px 1px 3px; }
      .attendance-actions label input[type="radio"] { width: 10px; height: 10px; }
      .remark-input { width: 40px; font-size: 0.55rem; padding: 2px 5px; }
      .save-btn { font-size: 0.65rem; padding: 4px 12px; }
      .save-holiday-btn { font-size: 0.65rem; padding: 4px 12px; }
      .refresh-btn { font-size: 0.6rem; padding: 4px 10px; }
      .holiday-msg { padding: 8px; }
      .holiday-msg h2 { font-size: 0.85rem; }
      .attendance-done-msg { padding: 8px; }
      .attendance-done-msg h2 { font-size: 0.85rem; }
      .loading-card { padding: 20px 28px; min-width: 200px; }
      .loading-percent { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="fixed-header">
    <div class="header">
      <h1><i class="fas fa-clipboard-check"></i> Attendance</h1>
      <div class="date-display">
        <i class="fas fa-calendar-day"></i> <span id="todayDate">Loading...</span>
      </div>
    </div>

    <div class="top-controls">
      <div class="session-group">
        <label>Session:</label>
        <select id="sessionSelect">
          <option value="2026-27" selected>2026-27</option>
          <option value="2027-28">2027-28</option>
          <option value="2028-29">2028-29</option>
          <option value="2029-30">2029-30</option>
        </select>
      </div>
      <button class="prev-attendance-btn" id="prevAttendanceBtn">
        <i class="fas fa-history"></i> Previous
      </button>
      <button class="view-parent-btn" id="parentViewBtn">
        <i class="fas fa-eye"></i> Parent
      </button>
    </div>

    <div class="class-filter" id="classFilterRow">
      <label><i class="fas fa-users"></i> Class</label>
      <select id="classSelect">
        <option value="">-- Select --</option>
        <option value="6th">6th</option><option value="7th">7th</option>
        <option value="8th">8th</option><option value="9th">9th</option>
        <option value="10th">10th</option>
        <option value="11th (Science)">11th (Science)</option>
        <option value="11th (Commerce)">11th (Commerce)</option>
        <option value="11th (Arts)">11th (Arts)</option>
        <option value="12th (Science)">12th (Science)</option>
        <option value="12th (Commerce)">12th (Commerce)</option>
        <option value="12th (Arts)">12th (Arts)</option>
      </select>

      <div class="class-holiday-group">
        <input type="checkbox" id="classHolidayCheck">
        <label for="classHolidayCheck"><i class="fas fa-calendar-times"></i> Holiday</label>
      </div>
      <div class="holiday-reason-group" id="holidayReasonGroup">
        <i class="fas fa-pen"></i>
        <input type="text" id="holidayReason" placeholder="Reason...">
      </div>
    </div>

    <div class="holiday-msg" id="holidayMsg">
      <i class="fas fa-calendar-times"></i>
      <h2>🎉 Class Holiday!</h2>
      <div class="reason-text" id="holidayReasonDisplay">HOLIDAY</div>
    </div>

    <div class="checking-msg" id="checkingMsg">
      <i class="fas fa-spinner"></i>
      <h2>Checking Attendance Status...</h2>
    </div>

    <div class="attendance-done-msg" id="attendanceDoneMsg">
      <i class="fas fa-check-circle"></i>
      <h2>✅ Attendance Already Done!</h2>
      <p id="attendanceDoneInfo">All students marked for today.</p>
    </div>

    <div class="summary-counter" id="summaryCounter" style="display:none;">
      <span class="count-item count-total">📌 <span class="num" id="totalCount">0</span></span>
      <span class="count-item count-present">✅ <span class="num" id="presentCount">0</span></span>
      <span class="count-item count-absent">❌ <span class="num" id="absentCount">0</span></span>
      <span class="count-item count-leave">🟡 <span class="num" id="leaveCount">0</span></span>
      <span class="count-item count-pending">⏳ <span class="num" id="pendingCount">0</span></span>
    </div>

    <!-- 🔥 SAVE BUTTONS (Attendance + Holiday) -->
    <div class="save-btn-container" id="saveBtnContainer" style="display:none;">
      <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync"></i></button>
      <button class="save-btn" id="saveAttendanceBtn">
        <i class="fas fa-save"></i> Save
      </button>
      <button class="save-holiday-btn" id="saveHolidayBtn">
        <i class="fas fa-calendar-times"></i> Save Holiday
      </button>
    </div>
  </div>

  <div class="table-scroll" id="tableScroll" style="display:none;">
    <table id="attendanceTable">
      <thead>
        <tr>
          <th style="width:35%;">Student</th>
          <th style="width:12%;">Roll</th>
          <th style="width:33%;">Status</th>
          <th style="width:20%;">Remarks</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" style="text-align:center;padding:25px;color:#1f4b9e;font-size:0.8rem;">
          <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;display:block;margin-bottom:6px;"></i>
          Loading...
        </td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-card">
    <i class="fas fa-spinner"></i>
    <p id="loadingStatus">Loading students...</p>
    <div class="loading-percent" id="loadingPercent">0%</div>
  </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
    authDomain: "quest-coaching.firebaseapp.com",
    databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quest-coaching",
    storageBucket: "quest-coaching.firebasestorage.app",
    messagingSenderId: "131948734089",
    appId: "1:131948734089:web:f4ba25110c8b1298360858"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const tbody = document.getElementById('tableBody');
  const classSelect = document.getElementById('classSelect');
  const sessionSelect = document.getElementById('sessionSelect');
  const dateDisplay = document.getElementById('todayDate');
  const classHolidayCheck = document.getElementById('classHolidayCheck');
  const holidayReason = document.getElementById('holidayReason');
  const holidayReasonGroup = document.getElementById('holidayReasonGroup');
  const holidayMsg = document.getElementById('holidayMsg');
  const holidayReasonDisplay = document.getElementById('holidayReasonDisplay');
  const checkingMsg = document.getElementById('checkingMsg');
  const attendanceDoneMsg = document.getElementById('attendanceDoneMsg');
  const attendanceDoneInfo = document.getElementById('attendanceDoneInfo');
  const tableScroll = document.getElementById('tableScroll');
  const summaryCounter = document.getElementById('summaryCounter');
  const saveBtnContainer = document.getElementById('saveBtnContainer');
  const parentViewBtn = document.getElementById('parentViewBtn');
  const prevAttendanceBtn = document.getElementById('prevAttendanceBtn');
  const saveBtn = document.getElementById('saveAttendanceBtn');
  const saveHolidayBtn = document.getElementById('saveHolidayBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const toast = document.getElementById('toastMsg');

  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingStatus = document.getElementById('loadingStatus');
  const loadingPercent = document.getElementById('loadingPercent');

  const totalCount = document.getElementById('totalCount');
  const presentCount = document.getElementById('presentCount');
  const absentCount = document.getElementById('absentCount');
  const leaveCount = document.getElementById('leaveCount');
  const pendingCount = document.getElementById('pendingCount');

  let students = [];
  let attendanceData = {};
  let isSaving = false;
  let currentDate = '';
  let isAttendanceDone = false;
  let holidaySaved = false;

  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.style.display = 'block';
    toast.style.background = isError ? '#dc3545' : '#1a237e';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  function getTodayDate() {
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, '0');
    const d = String(today.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatDateDisplay(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  function updateDateDisplay() {
    currentDate = getTodayDate();
    dateDisplay.textContent = formatDateDisplay(currentDate);
  }

  function updateLoading(percent, status) {
    loadingPercent.textContent = percent + '%';
    if (status) loadingStatus.textContent = status;
  }

  function updateSummary() {
    const total = students.length;
    let present = 0, absent = 0, leave = 0, pending = 0;
    students.forEach(s => {
      const rec = attendanceData[s.roll] || { status: '', remark: '' };
      if (rec.status === 'present') present++;
      else if (rec.status === 'absent') absent++;
      else if (rec.status === 'leave') leave++;
      else pending++;
    });
    totalCount.textContent = total;
    presentCount.textContent = present;
    absentCount.textContent = absent;
    leaveCount.textContent = leave;
    pendingCount.textContent = pending;
  }

  async function fetchAllAttendanceForDate(selectedSession, selectedClass, today) {
    try {
      let snapshot = await db.collection('admissions')
        .where('classApplying', '==', selectedClass)
        .where('session', '==', selectedSession)
        .get();

      if (snapshot.empty) {
        snapshot = await db.collection('admissions')
          .where('class', '==', selectedClass)
          .where('session', '==', selectedSession)
          .get();
      }

      if (snapshot.empty) return { students: [], attendance: {}, markedCount: 0, total: 0 };

      const studentsList = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        studentsList.push({
          id: doc.id,
          roll: data.rollNumber || data.rollNo || parseInt(doc.id.slice(-3)) || 0,
          name: data.studentName || data.name || 'Unknown',
          class: data.classApplying || data.class || selectedClass
        });
      });
      studentsList.sort((a, b) => a.roll - b.roll);

      const attendancePromises = studentsList.map(student => {
        const docRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('students')
          .doc(student.name)
          .collection('attendance')
          .doc(today);
        return docRef.get();
      });

      const attendanceSnaps = await Promise.all(attendancePromises);

      const attendanceMap = {};
      let markedCount = 0;

      studentsList.forEach((student, index) => {
        const snap = attendanceSnaps[index];
        if (snap.exists) {
          const data = snap.data();
          attendanceMap[student.roll] = {
            status: data.status || '',
            remark: data.remark || ''
          };
          markedCount++;
        } else {
          attendanceMap[student.roll] = { status: '', remark: '' };
        }
      });

      return { students: studentsList, attendance: attendanceMap, markedCount, total: studentsList.length };

    } catch (error) {
      console.error('fetchAllAttendance error:', error);
      return { students: [], attendance: {}, markedCount: 0, total: 0 };
    }
  }

  prevAttendanceBtn.addEventListener('click', function() {
    const session = sessionSelect.value;
    const className = classSelect.value;
    window.open(`previous-attendance.html?session=${session}&class=${className}`, '_blank');
  });

  parentViewBtn.addEventListener('click', function() {
    const session = sessionSelect.value;
    const className = classSelect.value;
    if (!className) { showToast('Select class first!', true); return; }
    window.open(`parent-view.html?session=${session}&class=${className}`, '_blank');
  });

  // 🔥 HOLIDAY TOGGLE HANDLER
  function handleClassHoliday() {
    if (classHolidayCheck.checked) {
      holidayReasonGroup.style.display = 'flex';
      holidayMsg.style.display = 'block';
      tableScroll.style.display = 'none';
      summaryCounter.style.display = 'none';
      attendanceDoneMsg.style.display = 'none';
      checkingMsg.style.display = 'none';
      
      // 🔥 Show Save Holiday button, hide Save Attendance
      saveBtnContainer.style.display = 'flex';
      saveBtn.style.display = 'none';
      saveHolidayBtn.style.display = 'flex';
      
      const reason = holidayReason.value.trim() || 'Holiday';
      holidayReasonDisplay.textContent = reason.toUpperCase();
    } else {
      holidayReasonGroup.style.display = 'none';
      holidayMsg.style.display = 'none';
      saveBtn.style.display = 'flex';
      saveHolidayBtn.style.display = 'none';
      handleClassSelect();
    }
  }

  async function handleClassSelect() {
    if (classHolidayCheck.checked) return;

    const selectedClass = classSelect.value;
    const selectedSession = sessionSelect.value;

    if (!selectedClass || !selectedSession) {
      tableScroll.style.display = 'none';
      summaryCounter.style.display = 'none';
      saveBtnContainer.style.display = 'none';
      attendanceDoneMsg.style.display = 'none';
      checkingMsg.style.display = 'none';
      loadingOverlay.style.display = 'none';
      return;
    }

    loadingOverlay.style.display = 'flex';
    updateLoading(10, 'Fetching students...');
    tableScroll.style.display = 'none';
    summaryCounter.style.display = 'none';
    saveBtnContainer.style.display = 'none';
    attendanceDoneMsg.style.display = 'none';
    checkingMsg.style.display = 'none';

    const today = getTodayDate();

    try {
      updateLoading(30, 'Loading student data...');
      
      const result = await fetchAllAttendanceForDate(selectedSession, selectedClass, today);

      updateLoading(80, 'Checking attendance status...');

      if (result.total === 0) {
        loadingOverlay.style.display = 'none';
        tableScroll.style.display = 'block';
        tbody.innerHTML = `<tr><td colspan="4" class="no-students-msg">
          <i class="fas fa-users"></i> No students in <strong>${selectedClass}</strong>
        </td></tr>`;
        summaryCounter.style.display = 'flex';
        saveBtnContainer.style.display = 'flex';
        saveBtn.style.display = 'flex';
        saveHolidayBtn.style.display = 'none';
        students = [];
        attendanceData = {};
        updateSummary();
        return;
      }

      students = result.students;
      attendanceData = result.attendance;

      updateLoading(100, 'Done!');

      const allMarked = result.markedCount === result.total && result.total > 0;

      setTimeout(() => {
        loadingOverlay.style.display = 'none';

        if (allMarked) {
          attendanceDoneMsg.style.display = 'block';
          attendanceDoneInfo.textContent = `✅ ${result.markedCount} students marked for ${formatDateDisplay(today)}`;
          tableScroll.style.display = 'none';
          summaryCounter.style.display = 'none';
          saveBtnContainer.style.display = 'none';
          isAttendanceDone = true;
        } else {
          attendanceDoneMsg.style.display = 'none';
          tableScroll.style.display = 'block';
          summaryCounter.style.display = 'flex';
          saveBtnContainer.style.display = 'flex';
          saveBtn.style.display = 'flex';
          saveHolidayBtn.style.display = 'none';
          isAttendanceDone = false;
          renderTable();
          updateSummary();
        }
      }, 200);

    } catch (error) {
      console.error('Error:', error);
      loadingOverlay.style.display = 'none';
      showToast('Error loading: ' + error.message, true);
    }
  }

  function renderTable() {
    if (students.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="no-students-msg">
        <i class="fas fa-users"></i> No students found.
      </td></tr>`;
      return;
    }

    let html = '';
    students.forEach((s) => {
      const rec = attendanceData[s.roll] || { status: '', remark: '' };
      const status = rec.status || '';
      const remark = rec.remark || '';

      html += `<tr>
        <td>
          <div class="student-name">
            <i class="fas fa-user-graduate"></i> ${s.name}
          </div>
        </td>
        <td><span class="roll-badge">${s.roll}</span></td>
        <td>
          <div class="attendance-actions">
            <label class="present-option"><input type="radio" name="status_${s.roll}" value="present" ${status==='present'?'checked':''}> P</label>
            <label class="absent-option"><input type="radio" name="status_${s.roll}" value="absent" ${status==='absent'?'checked':''}> A</label>
            <label class="leave-option"><input type="radio" name="status_${s.roll}" value="leave" ${status==='leave'?'checked':''}> L</label>
          </div>
        </td>
        <td>
          <input class="remark-input" type="text" placeholder="..." value="${remark}" data-roll="${s.roll}">
        </td>
      </tr>`;
    });
    tbody.innerHTML = html;

    document.querySelectorAll('#attendanceTable tbody tr').forEach(row => {
      const roll = parseInt(row.querySelector('.roll-badge').textContent);
      
      const radios = row.querySelectorAll(`input[name="status_${roll}"]`);
      radios.forEach(r => {
        r.addEventListener('change', function() {
          if (this.checked) {
            attendanceData[roll] = attendanceData[roll] || {};
            attendanceData[roll].status = this.value;
            updateSummary();
          }
        });
      });

      const remarkInput = row.querySelector('.remark-input');
      if (remarkInput) {
        remarkInput.addEventListener('input', function() {
          const r = parseInt(this.dataset.roll);
          attendanceData[r] = attendanceData[r] || {};
          attendanceData[r].remark = this.value;
        });
      }
    });
  }

  // 🔥 SAVE HOLIDAY
  async function saveHoliday() {
    if (isSaving) return;
    
    const selectedSession = sessionSelect.value;
    const selectedClass = classSelect.value;
    const today = getTodayDate();
    const reason = holidayReason.value.trim() || 'Holiday';

    if (!selectedSession || !selectedClass) {
      showToast('Select Session & Class!', true);
      return;
    }

    isSaving = true;
    saveHolidayBtn.disabled = true;
    saveHolidayBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
      const holidayDocRef = db.collection('attendance')
        .doc(selectedSession)
        .collection('classes')
        .doc(selectedClass)
        .collection('holidays')
        .doc(today);
      
      await holidayDocRef.set({
        reason: reason,
        date: today,
        session: selectedSession,
        class: selectedClass,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      holidaySaved = true;
      showToast(`🎉 Holiday saved: ${reason.toUpperCase()}`);
      
      saveHolidayBtn.innerHTML = '<i class="fas fa-check"></i> Holiday Saved';
      saveHolidayBtn.style.background = '#10b981';
      
    } catch (error) {
      console.error('Error saving holiday:', error);
      showToast('❌ Error: ' + error.message, true);
      saveHolidayBtn.disabled = false;
      saveHolidayBtn.innerHTML = '<i class="fas fa-calendar-times"></i> Save Holiday';
    } finally {
      isSaving = false;
    }
  }

  async function saveAttendance() {
    if (isSaving) return;
    if (students.length === 0) {
      showToast('No students to save!', true);
      return;
    }

    const selectedSession = sessionSelect.value;
    const selectedClass = classSelect.value;
    const today = getTodayDate();

    if (!selectedSession || !selectedClass) {
      showToast('Select Session & Class!', true);
      return;
    }

    isSaving = true;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
      const batch = db.batch();
      let savedCount = 0;

      for (const student of students) {
        const rec = attendanceData[student.roll] || { status: '', remark: '' };
        
        const docRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('students')
          .doc(student.name)
          .collection('attendance')
          .doc(today);

        batch.set(docRef, {
          status: rec.status || '',
          remark: rec.remark || '',
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          roll: student.roll,
          date: today,
          session: selectedSession,
          class: selectedClass
        });
        savedCount++;
      }

      await batch.commit();
      
      showToast(`✅ Attendance saved for ${savedCount} students!`);
      setTimeout(() => handleClassSelect(), 500);

    } catch (error) {
      console.error('Error:', error);
      showToast('❌ Error: ' + error.message, true);
    } finally {
      isSaving = false;
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Save';
    }
  }

  async function init() {
    updateDateDisplay();
    sessionSelect.value = '2026-27';
    await handleClassSelect();
  }

  classSelect.addEventListener('change', function() {
    if (!classHolidayCheck.checked) handleClassSelect();
  });

  sessionSelect.addEventListener('change', function() {
    if (!classHolidayCheck.checked) handleClassSelect();
  });

  classHolidayCheck.addEventListener('change', handleClassHoliday);

  holidayReason.addEventListener('input', function() {
    const reason = this.value.trim() || 'Holiday';
    holidayReasonDisplay.textContent = reason.toUpperCase();
  });

  saveBtn.addEventListener('click', saveAttendance);
  saveHolidayBtn.addEventListener('click', saveHoliday);

  refreshBtn.addEventListener('click', function() {
    if (!classHolidayCheck.checked) handleClassSelect();
    showToast('🔄 Refreshed!');
  });

  setInterval(updateDateDisplay, 60000);

  auth.onAuthStateChanged((user) => {
    if (!user) {
      showToast('⚠️ Please login!', true);
      setTimeout(() => window.location.href = 'index.html', 2000);
      return;
    }
    init();
  });

  console.log('✅ Attendance System Loaded!');
  console.log('📌 Holiday Save button added');
</script>
</body>
</html>
