<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>📋 Attendance · Quest Coaching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f6ff;
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px 40px 32px 32px;
      box-shadow: 0 20px 50px rgba(0, 40, 100, 0.12);
      padding: 24px 22px 32px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e6effa;
      padding-bottom: 18px;
    }
    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(145deg, #0a2a66, #1f4b9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 i {
      background: #1f4b9e;
      -webkit-text-fill-color: white;
      padding: 10px 12px;
      border-radius: 60px;
      font-size: 1.4rem;
      box-shadow: 0 6px 14px rgba(20, 60, 150, 0.25);
    }
    .header .date-display {
      background: #eef5fe;
      padding: 8px 20px;
      border-radius: 60px;
      font-weight: 600;
      color: #0a2a66;
      border: 1px solid #c7daf5;
      font-size: 0.9rem;
    }
    .header .date-display i { margin-right: 8px; }

    /* TOP CONTROLS */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      background: #f4f9ff;
      padding: 12px 20px;
      border-radius: 60px;
      margin-bottom: 16px;
      border: 1px solid #d7e5fc;
    }
    .top-controls .session-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-controls .session-group label {
      font-weight: 600;
      color: #0f3b7a;
      font-size: 0.9rem;
    }
    .top-controls .session-group select {
      border: 1px solid #b8cff0;
      border-radius: 40px;
      padding: 8px 16px;
      font-weight: 500;
      color: #0a2a66;
      font-size: 0.9rem;
      outline: none;
      background: white;
      cursor: pointer;
    }
    .top-controls .holiday-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fee2e2;
      padding: 4px 16px 4px 12px;
      border-radius: 40px;
      border: 1px solid #fecaca;
      cursor: pointer;
    }
    .top-controls .holiday-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #dc3545;
      cursor: pointer;
    }
    .top-controls .holiday-group label {
      font-weight: 600;
      color: #991b1b;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .top-controls .view-parent-btn {
      margin-left: auto;
      background: #0a2a66;
      border: none;
      border-radius: 60px;
      padding: 8px 24px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 14px rgba(10, 42, 102, 0.25);
      cursor: pointer;
      border: 1px solid #3f6ec0;
    }
    .top-controls .view-parent-btn:hover {
      background: #13458b;
      transform: scale(1.01);
    }

    .class-filter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 18px;
      background: #f4f9ff;
      padding: 12px 20px;
      border-radius: 60px;
      margin-bottom: 16px;
      border: 1px solid #d7e5fc;
    }
    .class-filter label {
      font-weight: 600;
      color: #0f3b7a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .class-filter select {
      background: white;
      border: 1px solid #b8cff0;
      border-radius: 40px;
      padding: 8px 24px 8px 18px;
      font-weight: 500;
      color: #0a2a66;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      min-width: 160px;
    }

    .parent-view-box {
      background: #e3efff;
      border-radius: 60px;
      padding: 12px 24px;
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      border: 1px solid #b7cef3;
    }
    .parent-view-box span {
      font-weight: 600;
      color: #0a2a66;
    }
    .parent-view-box input {
      border: 1px solid #b0caf0;
      border-radius: 60px;
      padding: 8px 20px;
      font-weight: 500;
      width: 140px;
      background: white;
    }
    .parent-view-box button {
      background: #0a2a66;
      border: none;
      border-radius: 60px;
      color: white;
      padding: 8px 24px;
      font-weight: 600;
      cursor: pointer;
    }

    .holiday-msg {
      background: #fef2f2;
      border: 2px solid #fecaca;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      color: #991b1b;
      margin-bottom: 16px;
      display: none;
    }
    .holiday-msg i { font-size: 3rem; display: block; margin-bottom: 10px; }
    .holiday-msg h2 { font-size: 1.5rem; }

    .save-btn-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .save-btn {
      background: #10b981;
      border: none;
      padding: 10px 28px;
      border-radius: 60px;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      transition: 0.15s;
    }
    .save-btn:hover { background: #059669; transform: scale(1.01); }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .refresh-btn {
      background: #e2e8f0;
      border: none;
      padding: 10px 20px;
      border-radius: 60px;
      color: #1a237e;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #cbd5e1; }

    .table-wrap {
      overflow-x: auto;
      border-radius: 28px;
      background: #fafcff;
      padding: 4px 2px 6px 2px;
      box-shadow: inset 0 0 0 1px rgba(60, 120, 210, 0.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      min-width: 620px;
    }
    th {
      text-align: left;
      padding: 16px 12px 12px 12px;
      font-weight: 600;
      color: #0a2a66;
      background: #e7f0fe;
      border-bottom: 2px solid #bdd2f0;
    }
    td {
      padding: 12px 12px;
      border-bottom: 1px solid #e2ecfc;
      vertical-align: middle;
      background: white;
    }
    tr:last-child td { border-bottom: none; }
    .student-name {
      font-weight: 600;
      color: #0a2a66;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .student-name:hover { color: #0033aa; text-decoration: underline; }
    .roll-badge {
      background: #e3edfe;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.75rem;
      color: #0a2a66;
      display: inline-block;
    }
    .attendance-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
    }
    .attendance-actions label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      font-size: 0.85rem;
      color: #1f4170;
      cursor: pointer;
      background: #f2f8ff;
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
      border: 1px solid transparent;
    }
    .attendance-actions label input[type="radio"] {
      accent-color: #0a2a66;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .attendance-actions label:has(input:checked) {
      background: #d4e4fe;
      border-color: #1f4b9e;
      box-shadow: 0 0 0 2px rgba(26, 80, 180, 0.15);
    }
    .remark-input {
      border: 1px solid #c8dbf7;
      border-radius: 40px;
      padding: 6px 14px;
      font-size: 0.8rem;
      background: white;
      width: 100px;
      color: #0a2a66;
    }
    .remark-input:focus {
      border-color: #0a2a66;
      outline: none;
      box-shadow: 0 0 0 3px rgba(10, 42, 102, 0.12);
    }

    .report-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      gap: 18px 12px;
      background: #edf5ff;
      padding: 14px 20px;
      border-radius: 60px;
      border: 1px solid #c7dbfa;
    }
    .report-actions .left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
    }
    .report-actions .left .monthly-btn {
      background: white;
      border: 1px solid #b1caf0;
      padding: 8px 28px;
      border-radius: 60px;
      font-weight: 600;
      color: #0a2a66;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .report-actions .left .monthly-btn:hover {
      background: #e2edfe;
      border-color: #1f4b9e;
    }
    .report-actions .right {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .download-btn {
      background: #0a2a66;
      border: none;
      padding: 8px 24px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 16px rgba(10, 42, 102, 0.25);
      cursor: pointer;
      border: 1px solid #3c6fc0;
      font-size: 0.9rem;
    }
    .download-btn:hover { background: #13458b; transform: scale(1.01); }
    .download-btn.outline {
      background: white;
      color: #0a2a66;
      border: 1px solid #b8cef0;
      box-shadow: none;
    }
    .download-btn.outline:hover { background: #e8f0fe; }
    .download-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a237e;
      color: white;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
    }
    .no-students-msg {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .no-students-msg i {
      font-size: 3rem;
      color: #cbd5e1;
      display: block;
      margin-bottom: 15px;
    }

    @media (max-width: 720px) {
      .container { padding: 18px 14px; }
      .header h1 { font-size: 1.6rem; }
      .header .date-display { font-size: 0.75rem; padding: 6px 14px; }
      .top-controls { border-radius: 30px; padding: 14px; flex-direction: column; align-items: stretch; }
      .top-controls .view-parent-btn { margin-left: 0; justify-content: center; }
      .class-filter { border-radius: 30px; padding: 14px; flex-direction: column; align-items: stretch; }
      .report-actions { flex-direction: column; align-items: stretch; border-radius: 30px; }
      .report-actions .left { flex-wrap: wrap; justify-content: center; }
      .report-actions .right { justify-content: center; }
      .parent-view-box { flex-direction: column; align-items: stretch; }
      td, th { padding: 10px 8px; }
      .attendance-actions label { padding: 2px 8px; font-size: 0.75rem; }
      .remark-input { width: 70px; }
      .save-btn-container { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <h1><i class="fas fa-clipboard-check"></i> Attendance</h1>
    <div class="date-display" id="dateDisplay">
      <i class="fas fa-calendar-day"></i> <span id="todayDate">Loading...</span>
    </div>
  </div>

  <!-- TOP CONTROLS: Session + Holiday + Parent View -->
  <div class="top-controls">
    <div class="session-group">
      <label><i class="fas fa-calendar-alt"></i> Session:</label>
      <select id="sessionSelect">
        <option value="2026-27" selected>2026-27</option>
        <option value="2027-28">2027-28</option>
        <option value="2028-29">2028-29</option>
        <option value="2029-30">2029-30</option>
        <option value="2030-31">2030-31</option>
      </select>
    </div>
    <div class="holiday-group" id="holidayGroup">
      <input type="checkbox" id="holidayCheck">
      <label for="holidayCheck"><i class="fas fa-calendar-times"></i> Holiday</label>
    </div>
    <button class="view-parent-btn" id="parentViewBtn">
      <i class="fas fa-eye"></i> Parent View (Roll No.)
    </button>
  </div>

  <!-- Parent View Box -->
  <div id="parentViewBox" class="parent-view-box">
    <span><i class="fas fa-id-badge"></i> Parent access · Roll No.</span>
    <input type="text" placeholder="e.g. 101" id="rollInput">
    <button id="parentViewSubmit"><i class="fas fa-search"></i> Show</button>
  </div>

  <!-- Holiday Message -->
  <div class="holiday-msg" id="holidayMsg">
    <i class="fas fa-calendar-times"></i>
    <h2>🎉 Today is Holiday!</h2>
    <p>No attendance will be marked today.</p>
  </div>

  <!-- CLASS FILTER -->
  <div class="class-filter" id="classFilterRow">
    <label><i class="fas fa-users"></i> Class</label>
    <select id="classSelect">
      <option value="">-- Select Class --</option>
      <option value="6th">6th</option>
      <option value="7th">7th</option>
      <option value="8th">8th</option>
      <option value="9th">9th</option>
      <option value="10th">10th</option>
      <option value="11th (Science)">11th (Science)</option>
      <option value="11th (Commerce)">11th (Commerce)</option>
      <option value="11th (Arts)">11th (Arts)</option>
      <option value="12th (Science)">12th (Science)</option>
      <option value="12th (Commerce)">12th (Commerce)</option>
      <option value="12th (Arts)">12th (Arts)</option>
    </select>
  </div>

  <!-- SAVE BUTTON -->
  <div class="save-btn-container" id="saveBtnContainer">
    <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync"></i> Refresh</button>
    <button class="save-btn" id="saveAttendanceBtn">
      <i class="fas fa-save"></i> Save Attendance
    </button>
  </div>

  <!-- ATTENDANCE TABLE -->
  <div class="table-wrap" id="tableWrap">
    <table id="attendanceTable">
      <thead>
        <tr>
          <th>Student</th>
          <th>Roll</th>
          <th>Status</th>
          <th>Remarks</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" style="text-align:center;padding:40px;color:#1f4b9e;">
          <i class="fas fa-spinner fa-spin" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
          Select session and class to load students...
        </td></tr>
      </tbody>
    </table>
  </div>

  <!-- REPORT & DOWNLOAD -->
  <div class="report-actions">
    <div class="left">
      <button class="monthly-btn" id="monthlyReportBtn">
        <i class="fas fa-file-alt"></i> Monthly Report
      </button>
      <span style="color:#1f4170; font-weight:500;">
        <i class="fas fa-print"></i> Daily attendance
      </span>
    </div>
    <div class="right">
      <button class="download-btn outline" id="downloadDailyBtn">
        <i class="fas fa-download"></i> Daily PDF
      </button>
      <button class="download-btn" id="downloadMonthlyBtn">
        <i class="fas fa-file-pdf"></i> Monthly PDF
      </button>
    </div>
  </div>
</div>

<!-- Toast Message -->
<div id="toastMsg" class="toast-msg"></div>

<script>
  // ============================================================
  // FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
    authDomain: "quest-coaching.firebaseapp.com",
    databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quest-coaching",
    storageBucket: "quest-coaching.firebasestorage.app",
    messagingSenderId: "131948734089",
    appId: "1:131948734089:web:f4ba25110c8b1298360858"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // ============================================================
  // DOM REFS
  // ============================================================
  const tbody = document.getElementById('tableBody');
  const classSelect = document.getElementById('classSelect');
  const sessionSelect = document.getElementById('sessionSelect');
  const dateDisplay = document.getElementById('todayDate');
  const holidayCheck = document.getElementById('holidayCheck');
  const holidayMsg = document.getElementById('holidayMsg');
  const tableWrap = document.getElementById('tableWrap');
  const saveBtnContainer = document.getElementById('saveBtnContainer');
  const classFilterRow = document.getElementById('classFilterRow');
  const parentViewBtn = document.getElementById('parentViewBtn');
  const parentViewBox = document.getElementById('parentViewBox');
  const rollInput = document.getElementById('rollInput');
  const parentViewSubmit = document.getElementById('parentViewSubmit');
  const saveBtn = document.getElementById('saveAttendanceBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const toast = document.getElementById('toastMsg');

  // ============================================================
  // STATE
  // ============================================================
  let students = [];
  let attendanceData = {};
  let isSaving = false;
  let currentDate = '';

  // ============================================================
  // HELPER: Show Toast
  // ============================================================
  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.style.display = 'block';
    toast.style.background = isError ? '#dc3545' : '#1a237e';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  // ============================================================
  // GET TODAY'S DATE (Auto Update)
  // ============================================================
  function getTodayDate() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function formatDateDisplay(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ============================================================
  // UPDATE DATE DISPLAY (Auto)
  // ============================================================
  function updateDateDisplay() {
    const today = getTodayDate();
    currentDate = today;
    dateDisplay.textContent = formatDateDisplay(today);
  }

  // ============================================================
  // FETCH STUDENTS FROM ADMISSIONS
  // ============================================================
  async function fetchStudents() {
    if (holidayCheck.checked) return;
    
    const selectedClass = classSelect.value;
    const selectedSession = sessionSelect.value;
    
    if (!selectedClass || !selectedSession) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:#666;">
        <i class="fas fa-info-circle" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
        Please select Session and Class.
      </td></tr>`;
      return;
    }

    try {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:#1f4b9e;">
        <i class="fas fa-spinner fa-spin" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
        Loading students for ${selectedClass} (${selectedSession})...
      </td></tr>`;

      // Query admissions with both class and session
      let snapshot = await db.collection('admissions')
        .where('classApplying', '==', selectedClass)
        .where('session', '==', selectedSession)
        .get();

      if (snapshot.empty) {
        // Try with 'class' field
        snapshot = await db.collection('admissions')
          .where('class', '==', selectedClass)
          .where('session', '==', selectedSession)
          .get();
      }

      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="4" class="no-students-msg">
          <i class="fas fa-users"></i>
          No students found in <strong>${selectedClass}</strong> (${selectedSession}).<br>
          Please add admissions first.
        </td></tr>`;
        students = [];
        attendanceData = {};
        return;
      }

      students = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        students.push({
          id: doc.id,
          roll: data.rollNumber || data.rollNo || parseInt(doc.id.slice(-3)) || 0,
          name: data.studentName || data.name || 'Unknown',
          class: data.classApplying || data.class || selectedClass
        });
      });

      students.sort((a, b) => a.roll - b.roll);

      // Initialize attendance data
      attendanceData = {};
      students.forEach(s => {
        attendanceData[s.roll] = { status: 'present', remark: '' };
      });

      // Load existing attendance for today
      await loadExistingAttendance();
      renderTable();

    } catch (error) {
      console.error('Error fetching students:', error);
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:#dc3545;">
        <i class="fas fa-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
        Error loading students: ${error.message}
      </td></tr>`;
    }
  }

  // ============================================================
  // LOAD EXISTING ATTENDANCE (Student-wise collection)
  // ============================================================
  async function loadExistingAttendance() {
    try {
      const selectedSession = sessionSelect.value;
      const selectedClass = classSelect.value;
      const today = getTodayDate();

      if (!selectedSession || !selectedClass || students.length === 0) return;

      // For each student, check if attendance exists for today
      for (const student of students) {
        const docRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('students')
          .doc(student.name) // Student name as document ID
          .collection('attendance')
          .doc(today);

        const docSnap = await docRef.get();
        if (docSnap.exists) {
          const data = docSnap.data();
          attendanceData[student.roll] = {
            status: data.status || 'present',
            remark: data.remark || ''
          };
        }
      }
    } catch (error) {
      console.warn('Could not load existing attendance:', error);
    }
  }

  // ============================================================
  // RENDER TABLE
  // ============================================================
  function renderTable() {
    if (students.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="no-students-msg">
        <i class="fas fa-users"></i>
        No students found.
      </td></tr>`;
      return;
    }

    let html = '';
    students.forEach((s) => {
      const rec = attendanceData[s.roll] || { status: 'present', remark: '' };
      const status = rec.status || 'present';
      const remark = rec.remark || '';

      html += `<tr>
        <td>
          <div class="student-name" data-roll="${s.roll}" data-name="${s.name}">
            <i class="fas fa-user-graduate"></i> ${s.name}
          </div>
        </td>
        <td><span class="roll-badge">${s.roll}</span></td>
        <td>
          <div class="attendance-actions">
            <label><input type="radio" name="status_${s.roll}" value="present" ${status==='present'?'checked':''}> P</label>
            <label><input type="radio" name="status_${s.roll}" value="absent" ${status==='absent'?'checked':''}> A</label>
            <label><input type="radio" name="status_${s.roll}" value="leave" ${status==='leave'?'checked':''}> L</label>
          </div>
        </td>
        <td>
          <input class="remark-input" type="text" placeholder="remark" value="${remark}" data-roll="${s.roll}">
        </td>
      </tr>`;
    });
    tbody.innerHTML = html;

    // Attach event listeners
    document.querySelectorAll('#attendanceTable tbody tr').forEach(row => {
      const nameDiv = row.querySelector('.student-name');
      if (!nameDiv) return;
      const roll = parseInt(nameDiv.dataset.roll);

      const radios = row.querySelectorAll(`input[name="status_${roll}"]`);
      radios.forEach(r => {
        r.addEventListener('change', function() {
          if (this.checked) {
            attendanceData[roll] = attendanceData[roll] || {};
            attendanceData[roll].status = this.value;
          }
        });
      });

      const remarkInput = row.querySelector('.remark-input');
      if (remarkInput) {
        remarkInput.addEventListener('input', function() {
          const r = parseInt(this.dataset.roll);
          attendanceData[r] = attendanceData[r] || {};
          attendanceData[r].remark = this.value;
        });
      }

      nameDiv.addEventListener('click', function() {
        const roll = parseInt(this.dataset.roll);
        const name = this.dataset.name;
        generateIndividualReport(roll, name);
      });
    });
  }

  // ============================================================
  // GENERATE INDIVIDUAL REPORT
  // ============================================================
  function generateIndividualReport(roll, name) {
    const rec = attendanceData[roll] || { status: 'present', remark: '' };
    const dateStr = formatDateDisplay(currentDate);
    const classVal = classSelect.value;
    const session = sessionSelect.value;

    const content = `📋 INDIVIDUAL ATTENDANCE REPORT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🏫 Quest Coaching Centre
👤 Student: ${name}
🎯 Roll No: ${roll}
📚 Class: ${classVal}
📆 Session: ${session}
📅 Date: ${dateStr}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
✅ Status: ${rec.status.toUpperCase()}
📝 Remark: ${rec.remark || '—'}

  // ============================================================
  // SAVE ATTENDANCE (Student-wise collection)
  // ============================================================
  async function saveAttendance() {
    if (isSaving) return;
    if (students.length === 0) {
      showToast('No students to save!', true);
      return;
    }

    const selectedSession = sessionSelect.value;
    const selectedClass = classSelect.value;
    const today = getTodayDate();

    if (!selectedSession || !selectedClass) {
      showToast('Please select Session and Class!', true);
      return;
    }

    isSaving = true;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
      // Save each student's attendance
      const batch = db.batch();
      let savedCount = 0;

      for (const student of students) {
        const rec = attendanceData[student.roll] || { status: 'present', remark: '' };
        
        const docRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('students')
          .doc(student.name) // Student name as document ID
          .collection('attendance')
          .doc(today);

        batch.set(docRef, {
          status: rec.status || 'present',
          remark: rec.remark || '',
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          roll: student.roll,
          date: today,
          session: selectedSession,
          class: selectedClass
        });
        savedCount++;
      }

      await batch.commit();
      showToast(`✅ Attendance saved for ${savedCount} students (${formatDateDisplay(today)})!`);
    } catch (error) {
      console.error('Error saving attendance:', error);
      showToast('❌ Error saving attendance: ' + error.message, true);
    } finally {
      isSaving = false;
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Attendance';
    }
  }

  // ============================================================
  // PARENT VIEW (Fast lookup from student's collection)
  // ============================================================
  parentViewBtn.addEventListener('click', function() {
    parentViewBox.style.display = parentViewBox.style.display === 'none' ? 'flex' : 'none';
  });

  parentViewSubmit.addEventListener('click', async function() {
    const rollVal = rollInput.value.trim();
    if (!rollVal) {
      showToast('Please enter a Roll number', true);
      return;
    }
    const rollNum = parseInt(rollVal);
    const found = students.find(s => s.roll === rollNum);
    if (!found) {
      showToast(`Roll ${rollNum} not found in current class`, true);
      return;
    }

    // Fast lookup: directly access student's collection
    try {
      const selectedSession = sessionSelect.value;
      const selectedClass = classSelect.value;
      const today = getTodayDate();

      const docRef = db.collection('attendance')
        .doc(selectedSession)
        .collection('classes')
        .doc(selectedClass)
        .collection('students')
        .doc(found.name)
        .collection('attendance')
        .doc(today);

      const docSnap = await docRef.get();
      let status = 'Not marked';
      let remark = '';
      if (docSnap.exists) {
        const data = docSnap.data();
        status = data.status || 'Not marked';
        remark = data.remark || '';
      }

      const statusEmoji = status === 'present' ? '✅' : status === 'absent' ? '❌' : status === 'leave' ? '🟡' : '⏳';
      const dateStr = formatDateDisplay(today);
      showToast(`${found.name} (${rollNum}) ${statusEmoji} ${status.toUpperCase()} ${remark ? '| '+remark : ''} (${dateStr})`);
    } catch (error) {
      showToast('Error fetching attendance: ' + error.message, true);
    }
  });

  // ============================================================
  // MONTHLY REPORT
  // ============================================================
  document.getElementById('monthlyReportBtn').addEventListener('click', function() {
    if (students.length === 0) {
      showToast('No students to show report!', true);
      return;
    }
    const monthName = new Date().toLocaleString('default', { month: 'long' });
    const year = new Date().getFullYear();
    const classVal = classSelect.value;
    const session = sessionSelect.value;
    
    let report = `📅 MONTHLY ATTENDANCE REPORT - ${monthName} ${year}\n`;
    report += `🏫 Class: ${classVal}\n`;
    report += `📆 Session: ${session}\n`;
    report += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    
    let present = 0, absent = 0, leave = 0, notMarked = 0;
    students.forEach(s => {
      const rec = attendanceData[s.roll] || { status: 'present', remark: '' };
      report += `${s.name} (${s.roll}) → ${rec.status.toUpperCase()}`;
      if (rec.remark) report += ` | ${rec.remark}`;
      report += '\n';
      if (rec.status === 'present') present++;
      else if (rec.status === 'absent') absent++;
      else if (rec.status === 'leave') leave++;
      else notMarked++;
    });
    report += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    report += `📊 Summary: P=${present} | A=${absent} | L=${leave} | Total=${students.length}`;
    
    alert(report);
  });

  // ============================================================

  // ============================================================
  // HANDLE HOLIDAY TOGGLE
  // ============================================================
  function handleHolidayToggle() {
    if (holidayCheck.checked) {
      holidayMsg.style.display = 'block';
      tableWrap.style.display = 'none';
      saveBtnContainer.style.display = 'none';
      classFilterRow.style.display = 'none';
      showToast('🎉 Holiday mode ON - No attendance today');
    } else {
      holidayMsg.style.display = 'none';
      tableWrap.style.display = 'block';
      saveBtnContainer.style.display = 'flex';
      classFilterRow.style.display = 'flex';
      fetchStudents();
    }
  }

  // ============================================================
  // INIT
  // ============================================================
  async function init() {
    updateDateDisplay();
    
    // Auto-select session 2026-27
    sessionSelect.value = '2026-27';
    
    // Load students
    await fetchStudents();
  }

  // ============================================================
  // EVENT LISTENERS
  // ============================================================
  classSelect.addEventListener('change', function() {
    if (!holidayCheck.checked) fetchStudents();
  });

  sessionSelect.addEventListener('change', function() {
    if (!holidayCheck.checked) fetchStudents();
  });

  holidayCheck.addEventListener('change', handleHolidayToggle);

  saveBtn.addEventListener('click', saveAttendance);

  refreshBtn.addEventListener('click', function() {
    if (!holidayCheck.checked) fetchStudents();
    showToast('🔄 Refreshed!');
  });

  rollInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') parentViewSubmit.click();
  });

  // Auto-update date every minute
  setInterval(() => {
    updateDateDisplay();
  }, 60000);

  // ============================================================
  // AUTH CHECK
  // ============================================================
  auth.onAuthStateChanged((user) => {
    if (!user) {
      showToast('⚠️ Please login from main page!', true);
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 2000);
      return;
    }
    init();
  });

  console.log('✅ Attendance System Loaded!');
  console.log('📌 Firebase Structure: attendance/{session}/classes/{class}/students/{studentName}/attendance/{date}');
  console.log('📌 Auto date: Today\'s date is auto-selected');
  console.log('📌 Session: 2026-27 auto-selected');
</script>
