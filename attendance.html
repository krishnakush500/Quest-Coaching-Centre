<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>📋 Attendance · Quest Coaching</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f6ff;
      min-height: 100vh;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 40px 40px 32px 32px;
      box-shadow: 0 20px 50px rgba(0, 40, 100, 0.12);
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.6);
      height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 🔥 FIXED HEADER */
    .fixed-header {
      padding: 20px 22px 0 22px;
      flex-shrink: 0;
      background: white;
      border-radius: 40px 40px 0 0;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid #e6effa;
      padding-bottom: 14px;
    }
    .header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(145deg, #0a2a66, #1f4b9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 i {
      background: #1f4b9e;
      -webkit-text-fill-color: white;
      padding: 8px 10px;
      border-radius: 60px;
      font-size: 1.2rem;
      box-shadow: 0 6px 14px rgba(20, 60, 150, 0.25);
    }
    .header .date-display {
      background: #eef5fe;
      padding: 6px 16px;
      border-radius: 60px;
      font-weight: 600;
      color: #0a2a66;
      border: 1px solid #c7daf5;
      font-size: 0.85rem;
    }
    .header .date-display i { margin-right: 6px; }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      background: #f4f9ff;
      padding: 10px 16px;
      border-radius: 60px;
      margin-bottom: 12px;
      border: 1px solid #d7e5fc;
    }
    .top-controls .session-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-controls .session-group label {
      font-weight: 600;
      color: #0f3b7a;
      font-size: 0.8rem;
    }
    .top-controls .session-group select {
      border: 1px solid #b8cff0;
      border-radius: 40px;
      padding: 6px 14px;
      font-weight: 500;
      color: #0a2a66;
      font-size: 0.85rem;
      outline: none;
      background: white;
      cursor: pointer;
    }
    .top-controls .view-parent-btn {
      margin-left: auto;
      background: #0a2a66;
      border: none;
      border-radius: 60px;
      padding: 6px 18px;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 14px rgba(10, 42, 102, 0.25);
      cursor: pointer;
      border: 1px solid #3f6ec0;
    }
    .top-controls .view-parent-btn:hover {
      background: #13458b;
      transform: scale(1.01);
    }

    .class-filter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      background: #f4f9ff;
      padding: 10px 16px;
      border-radius: 60px;
      margin-bottom: 12px;
      border: 1px solid #d7e5fc;
    }
    .class-filter label {
      font-weight: 600;
      color: #0f3b7a;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
    }
    .class-filter select {
      background: white;
      border: 1px solid #b8cff0;
      border-radius: 40px;
      padding: 6px 18px 6px 14px;
      font-weight: 500;
      color: #0a2a66;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      min-width: 130px;
    }

    /* 🔥 CLASS HOLIDAY - With Reason */
    .class-holiday-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fee2e2;
      padding: 4px 14px 4px 10px;
      border-radius: 40px;
      border: 1px solid #fecaca;
    }
    .class-holiday-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #dc3545;
      cursor: pointer;
    }
    .class-holiday-group label {
      font-weight: 600;
      color: #991b1b;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .holiday-reason-group {
      display: none;
      align-items: center;
      gap: 6px;
      background: #fff5f5;
      padding: 4px 14px 4px 10px;
      border-radius: 40px;
      border: 2px solid #dc3545;
    }
    .holiday-reason-group input {
      border: none;
      background: transparent;
      padding: 4px 8px;
      font-size: 0.8rem;
      color: #991b1b;
      font-weight: 600;
      width: 120px;
      outline: none;
    }
    .holiday-reason-group input::placeholder {
      color: #f87171;
      font-weight: 400;
    }
    .holiday-reason-group i {
      color: #dc3545;
    }

    .holiday-msg {
      background: #fef2f2;
      border: 2px solid #fecaca;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      color: #991b1b;
      margin-bottom: 12px;
      display: none;
    }
    .holiday-msg i { font-size: 2rem; display: block; margin-bottom: 8px; }
    .holiday-msg h2 { font-size: 1.2rem; }
    .holiday-msg .reason-text { 
      font-size: 1rem; 
      font-weight: 700; 
      color: #dc3545; 
      background: white; 
      padding: 6px 18px; 
      border-radius: 40px; 
      display: inline-block;
      margin-top: 8px;
    }

    /* 🔥 ATTENDANCE DONE MESSAGE */
    .attendance-done-msg {
      background: #d1fae5;
      border: 2px solid #10b981;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      color: #065f46;
      margin-bottom: 12px;
      display: none;
    }
    .attendance-done-msg i { font-size: 2rem; display: block; margin-bottom: 8px; color: #10b981; }
    .attendance-done-msg h2 { font-size: 1.2rem; }

    .save-btn-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .save-btn {
      background: #10b981;
      border: none;
      padding: 8px 22px;
      border-radius: 60px;
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      transition: 0.15s;
    }
    .save-btn:hover { background: #059669; transform: scale(1.01); }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .refresh-btn {
      background: #e2e8f0;
      border: none;
      padding: 8px 16px;
      border-radius: 60px;
      color: #1a237e;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #cbd5e1; }

    /* 🔥 SUMMARY COUNTER */
    .summary-counter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      background: #f8fafc;
      padding: 8px 16px;
      border-radius: 60px;
      margin-bottom: 10px;
      border: 1px solid #e2e8f0;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .summary-counter .count-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .summary-counter .count-item .num {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .count-total { color: #1a237e; }
    .count-present { color: #10b981; }
    .count-absent { color: #dc3545; }
    .count-leave { color: #2563eb; }
    .count-pending { color: #f59e0b; }

    /* 🔥 SCROLLABLE TABLE */
    .table-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px 12px;
      margin: 0 10px 10px 10px;
      border-radius: 20px;
      background: #fafcff;
      border: 1px solid #e2e8f0;
    }
    .table-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .table-scroll::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .table-scroll::-webkit-scrollbar-thumb {
      background: #b8cff0;
      border-radius: 10px;
    }
    .table-scroll::-webkit-scrollbar-thumb:hover {
      background: #1f4b9e;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      min-width: 600px;
    }
    th {
      text-align: left;
      padding: 12px 10px 10px 10px;
      font-weight: 600;
      color: #0a2a66;
      background: #e7f0fe;
      border-bottom: 2px solid #bdd2f0;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    td {
      padding: 10px 10px;
      border-bottom: 1px solid #e2ecfc;
      vertical-align: middle;
      background: white;
    }
    tr:last-child td { border-bottom: none; }

    .student-name {
      font-weight: 600;
      color: #0a2a66;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .student-name:hover { color: #0033aa; text-decoration: underline; }
    .roll-badge {
      background: #e3edfe;
      padding: 3px 10px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.7rem;
      color: #0a2a66;
      display: inline-block;
    }

    /* 🔥 ATTENDANCE ACTIONS - NO HOLIDAY */
    .attendance-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      align-items: center;
    }
    .attendance-actions label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 3px 10px 3px 6px;
      border-radius: 40px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .attendance-actions label input[type="radio"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    /* 🔥 Present - Green */
    .attendance-actions label.present-option {
      background: #ecfdf5;
      border-color: #d1fae5;
      color: #065f46;
    }
    .attendance-actions label.present-option:has(input:checked) {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }
    .attendance-actions label.present-option:has(input:checked) input[type="radio"] {
      accent-color: white;
    }
    /* 🔥 Absent - Red */
    .attendance-actions label.absent-option {
      background: #fef2f2;
      border-color: #fee2e2;
      color: #991b1b;
    }
    .attendance-actions label.absent-option:has(input:checked) {
      background: #dc3545;
      border-color: #dc3545;
      color: white;
    }
    .attendance-actions label.absent-option:has(input:checked) input[type="radio"] {
      accent-color: white;
    }
    /* 🔥 Leave - Blue */
    .attendance-actions label.leave-option {
      background: #eff6ff;
      border-color: #dbeafe;
      color: #1e40af;
    }
    .attendance-actions label.leave-option:has(input:checked) {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }
    .attendance-actions label.leave-option:has(input:checked) input[type="radio"] {
      accent-color: white;
    }

    .remark-input {
      border: 1px solid #c8dbf7;
      border-radius: 40px;
      padding: 4px 12px;
      font-size: 0.75rem;
      background: white;
      width: 80px;
      color: #0a2a66;
    }
    .remark-input:focus {
      border-color: #0a2a66;
      outline: none;
      box-shadow: 0 0 0 3px rgba(10, 42, 102, 0.12);
    }

    /* 🔥 REPORT ACTIONS */
    .report-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      gap: 10px 12px;
      background: #edf5ff;
      border-radius: 60px;
      border: 1px solid #c7dbfa;
      flex-shrink: 0;
      margin: 0 12px 12px 12px;
    }
    .report-actions .left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
    }
    .report-actions .left .monthly-btn {
      background: white;
      border: 1px solid #b1caf0;
      padding: 6px 20px;
      border-radius: 60px;
      font-weight: 600;
      color: #0a2a66;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .report-actions .left .monthly-btn:hover {
      background: #e2edfe;
      border-color: #1f4b9e;
    }
    .report-actions .right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .download-btn {
      background: #0a2a66;
      border: none;
      padding: 6px 18px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(10, 42, 102, 0.25);
      cursor: pointer;
      border: 1px solid #3c6fc0;
    }
    .download-btn:hover { background: #13458b; transform: scale(1.01); }
    .download-btn.outline {
      background: white;
      color: #0a2a66;
      border: 1px solid #b8cef0;
      box-shadow: none;
    }
    .download-btn.outline:hover { background: #e8f0fe; }
    .download-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .toast-msg {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a237e;
      color: white;
      padding: 10px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
      max-width: 90%;
      text-align: center;
    }
    .no-students-msg {
      text-align: center;
      padding: 30px 20px;
      color: #666;
    }
    .no-students-msg i {
      font-size: 2.5rem;
      color: #cbd5e1;
      display: block;
      margin-bottom: 10px;
    }

    @media (max-width: 720px) {
      .fixed-header { padding: 14px 14px 0 14px; }
      .header h1 { font-size: 1.3rem; }
      .header .date-display { font-size: 0.7rem; padding: 4px 12px; }
      .top-controls { border-radius: 30px; padding: 10px 14px; flex-direction: column; align-items: stretch; }
      .top-controls .view-parent-btn { margin-left: 0; justify-content: center; }
      .class-filter { border-radius: 30px; padding: 10px 14px; flex-direction: column; align-items: stretch; }
      .holiday-reason-group input { width: 100%; }
      .summary-counter { font-size: 0.7rem; gap: 6px 12px; justify-content: center; }
      .table-scroll { padding: 0 6px 6px 6px; margin: 0 6px 6px 6px; }
      td, th { padding: 8px 6px; font-size: 0.75rem; }
      .attendance-actions label { font-size: 0.65rem; padding: 2px 6px 2px 4px; }
      .remark-input { width: 50px; font-size: 0.65rem; padding: 3px 8px; }
      .report-actions { flex-direction: column; align-items: stretch; border-radius: 30px; }
      .report-actions .left { justify-content: center; }
      .report-actions .right { justify-content: center; }
      .save-btn-container { justify-content: center; }
    }
    @media (max-width: 480px) {
      .fixed-header { padding: 10px 10px 0 10px; }
      .header h1 { font-size: 1.1rem; }
      .header h1 i { font-size: 1rem; padding: 6px 8px; }
      .top-controls .session-group select { font-size: 0.75rem; padding: 4px 10px; }
      .class-filter select { font-size: 0.75rem; padding: 4px 12px; }
      .summary-counter { font-size: 0.6rem; gap: 4px 8px; }
      .summary-counter .count-item .num { font-size: 0.8rem; }
      td, th { padding: 6px 4px; font-size: 0.65rem; }
      .attendance-actions label { font-size: 0.55rem; padding: 2px 4px 2px 3px; }
      .attendance-actions label input[type="radio"] { width: 12px; height: 12px; }
      .remark-input { width: 40px; font-size: 0.6rem; padding: 2px 6px; }
      .save-btn { font-size: 0.75rem; padding: 6px 16px; }
      .download-btn { font-size: 0.7rem; padding: 4px 12px; }
      .report-actions .left .monthly-btn { font-size: 0.7rem; padding: 4px 14px; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 🔥 FIXED HEADER -->
  <div class="fixed-header">
    <div class="header">
      <h1><i class="fas fa-clipboard-check"></i> Attendance</h1>
      <div class="date-display" id="dateDisplay">
        <i class="fas fa-calendar-day"></i> <span id="todayDate">Loading...</span>
      </div>
    </div>

    <div class="top-controls">
      <div class="session-group">
        <label><i class="fas fa-calendar-alt"></i> Session:</label>
        <select id="sessionSelect">
          <option value="2026-27" selected>2026-27</option>
          <option value="2027-28">2027-28</option>
          <option value="2028-29">2028-29</option>
          <option value="2029-30">2029-30</option>
          <option value="2030-31">2030-31</option>
        </select>
      </div>
      <button class="view-parent-btn" id="parentViewBtn">
        <i class="fas fa-eye"></i> Parent View
      </button>
    </div>

    <div class="class-filter" id="classFilterRow">
      <label><i class="fas fa-users"></i> Class</label>
      <select id="classSelect">
        <option value="">-- Select --</option>
        <option value="6th">6th</option><option value="7th">7th</option>
        <option value="8th">8th</option><option value="9th">9th</option>
        <option value="10th">10th</option>
        <option value="11th (Science)">11th (Science)</option>
        <option value="11th (Commerce)">11th (Commerce)</option>
        <option value="11th (Arts)">11th (Arts)</option>
        <option value="12th (Science)">12th (Science)</option>
        <option value="12th (Commerce)">12th (Commerce)</option>
        <option value="12th (Arts)">12th (Arts)</option>
      </select>

      <!-- 🔥 CLASS HOLIDAY -->
      <div class="class-holiday-group">
        <input type="checkbox" id="classHolidayCheck">
        <label for="classHolidayCheck"><i class="fas fa-calendar-times"></i> Holiday</label>
      </div>
      <div class="holiday-reason-group" id="holidayReasonGroup">
        <i class="fas fa-pen"></i>
        <input type="text" id="holidayReason" placeholder="Reason: SUNDAY, JANAMASHTMI...">
      </div>
    </div>

    <!-- Holiday Message -->
    <div class="holiday-msg" id="holidayMsg">
      <i class="fas fa-calendar-times"></i>
      <h2>🎉 Class Holiday!</h2>
      <div class="reason-text" id="holidayReasonDisplay">HOLIDAY</div>
    </div>

    <!-- 🔥 Attendance Done Message -->
    <div class="attendance-done-msg" id="attendanceDoneMsg">
      <i class="fas fa-check-circle"></i>
      <h2>✅ Attendance Already Marked!</h2>
      <p id="attendanceDoneInfo">Attendance has been completed for this class today.</p>
    </div>

    <!-- 🔥 SUMMARY COUNTER -->
    <div class="summary-counter" id="summaryCounter">
      <span class="count-item count-total">📌 Total: <span class="num" id="totalCount">0</span></span>
      <span class="count-item count-present">✅ P: <span class="num" id="presentCount">0</span></span>
      <span class="count-item count-absent">❌ A: <span class="num" id="absentCount">0</span></span>
      <span class="count-item count-leave">🟡 L: <span class="num" id="leaveCount">0</span></span>
      <span class="count-item count-pending">⏳ Pending: <span class="num" id="pendingCount">0</span></span>
    </div>

    <!-- SAVE BUTTON -->
    <div class="save-btn-container" id="saveBtnContainer">
      <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync"></i> Refresh</button>
      <button class="save-btn" id="saveAttendanceBtn">
        <i class="fas fa-save"></i> Save Attendance
      </button>
    </div>
  </div>

  <!-- 🔥 SCROLLABLE TABLE -->
  <div class="table-scroll" id="tableScroll">
    <table id="attendanceTable">
      <thead>
        <tr>
          <th style="width:35%;">Student</th>
          <th style="width:15%;">Roll</th>
          <th style="width:30%;">Status (P/A/L)</th>
          <th style="width:20%;">Remarks</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" style="text-align:center;padding:30px;color:#1f4b9e;">
          <i class="fas fa-spinner fa-spin" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
          Select session and class to load students...
        </td></tr>
      </tbody>
    </table>
  </div>

  <!-- REPORT ACTIONS -->

<script>
  // ============================================================
  // FIREBASE CONFIG
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
    authDomain: "quest-coaching.firebaseapp.com",
    databaseURL: "https://quest-coaching-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quest-coaching",
    storageBucket: "quest-coaching.firebasestorage.app",
    messagingSenderId: "131948734089",
    appId: "1:131948734089:web:f4ba25110c8b1298360858"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // ============================================================
  // DOM REFS
  // ============================================================
  const tbody = document.getElementById('tableBody');
  const classSelect = document.getElementById('classSelect');
  const sessionSelect = document.getElementById('sessionSelect');
  const dateDisplay = document.getElementById('todayDate');
  const classHolidayCheck = document.getElementById('classHolidayCheck');
  const holidayReason = document.getElementById('holidayReason');
  const holidayReasonGroup = document.getElementById('holidayReasonGroup');
  const holidayMsg = document.getElementById('holidayMsg');
  const holidayReasonDisplay = document.getElementById('holidayReasonDisplay');
  const attendanceDoneMsg = document.getElementById('attendanceDoneMsg');
  const attendanceDoneInfo = document.getElementById('attendanceDoneInfo');
  const tableScroll = document.getElementById('tableScroll');
  const saveBtnContainer = document.getElementById('saveBtnContainer');
  const classFilterRow = document.getElementById('classFilterRow');
  const parentViewBtn = document.getElementById('parentViewBtn');
  const saveBtn = document.getElementById('saveAttendanceBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const toast = document.getElementById('toastMsg');

  // Summary counters
  const totalCount = document.getElementById('totalCount');
  const presentCount = document.getElementById('presentCount');
  const absentCount = document.getElementById('absentCount');
  const leaveCount = document.getElementById('leaveCount');
  const pendingCount = document.getElementById('pendingCount');

  let students = [];
  let attendanceData = {};
  let isSaving = false;
  let currentDate = '';
  let isAttendanceDone = false;

  // ============================================================
  // HELPER: Show Toast
  // ============================================================
  function showToast(msg, isError = false) {
    toast.textContent = msg;
    toast.style.display = 'block';
    toast.style.background = isError ? '#dc3545' : '#1a237e';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  // ============================================================
  // GET TODAY'S DATE
  // ============================================================
  function getTodayDate() {
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function formatDateDisplay(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function updateDateDisplay() {
    const today = getTodayDate();
    currentDate = today;
    dateDisplay.textContent = formatDateDisplay(today);
  }

  // ============================================================
  // UPDATE SUMMARY COUNTER
  // ============================================================
  function updateSummary() {
    const total = students.length;
    let present = 0, absent = 0, leave = 0, pending = 0;

    students.forEach(s => {
      const rec = attendanceData[s.roll] || { status: 'present', remark: '' };
      if (rec.status === 'present') present++;
      else if (rec.status === 'absent') absent++;
      else if (rec.status === 'leave') leave++;
      else pending++;
    });

    totalCount.textContent = total;
    presentCount.textContent = present;
    absentCount.textContent = absent;
    leaveCount.textContent = leave;
    pendingCount.textContent = pending;
  }

  // ============================================================
  // CHECK IF ATTENDANCE IS ALREADY DONE
  // ============================================================
  async function checkAttendanceDone() {
    const selectedSession = sessionSelect.value;
    const selectedClass = classSelect.value;
    const today = getTodayDate();

    if (!selectedSession || !selectedClass || students.length === 0) {
      isAttendanceDone = false;
      attendanceDoneMsg.style.display = 'none';
      return;
    }

    try {
      // Check if all students have attendance marked for today
      let allMarked = true;
      let anyMarked = false;

      for (const student of students) {
        const docRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('students')
          .doc(student.name)
          .collection('attendance')
          .doc(today);

        const docSnap = await docRef.get();
        if (docSnap.exists) {
          anyMarked = true;
        } else {
          allMarked = false;
        }
      }

      // If all students have attendance, mark as done
      if (allMarked && students.length > 0 && anyMarked) {
        isAttendanceDone = true;
        attendanceDoneMsg.style.display = 'block';
        attendanceDoneInfo.textContent = `✅ All ${students.length} students have been marked for ${formatDateDisplay(today)}.`;
        // Disable editing
        tableScroll.style.opacity = '0.5';
        saveBtn.style.display = 'none';
      } else {
        isAttendanceDone = false;
        attendanceDoneMsg.style.display = 'none';
        tableScroll.style.opacity = '1';
        saveBtn.style.display = 'flex';
      }
    } catch (error) {
      console.warn('Could not check attendance status:', error);
      isAttendanceDone = false;
      attendanceDoneMsg.style.display = 'none';
    }
  }

  // ============================================================
  // PARENT VIEW - Opens parent-view.html
  // ============================================================
  parentViewBtn.addEventListener('click', function() {
    const session = sessionSelect.value;
    const className = classSelect.value;
    if (!className) {
      showToast('Please select a class first!', true);
      return;
    }
    window.open(`parent-view.html?session=${session}&class=${className}`, '_blank');
  });

  // ============================================================
  // HANDLE CLASS HOLIDAY
  // ============================================================
  function handleClassHoliday() {
    if (classHolidayCheck.checked) {
      holidayReasonGroup.style.display = 'flex';
      holidayMsg.style.display = 'block';
      tableScroll.style.display = 'none';
      saveBtnContainer.style.display = 'none';
      attendanceDoneMsg.style.display = 'none';
      const reason = holidayReason.value.trim() || 'Holiday';
      holidayReasonDisplay.textContent = reason.toUpperCase();
      showToast(`🎉 Holiday: ${reason.toUpperCase()}`);
    } else {
      holidayReasonGroup.style.display = 'none';
      holidayMsg.style.display = 'none';
      tableScroll.style.display = 'block';
      saveBtnContainer.style.display = 'flex';
      fetchStudents();
    }
  }

  // ============================================================
  // FETCH STUDENTS
  // ============================================================
  async function fetchStudents() {
    if (classHolidayCheck.checked) return;
    
    const selectedClass = classSelect.value;
    const selectedSession = sessionSelect.value;
    
    if (!selectedClass || !selectedSession) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:#666;">
        <i class="fas fa-info-circle" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
        Please select Session and Class.
      </td></tr>`;
      students = [];
      attendanceData = {};
      updateSummary();
      return;
    }

    try {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:#1f4b9e;">
        <i class="fas fa-spinner fa-spin" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
        Loading students...
      </td></tr>`;

      let snapshot = await db.collection('admissions')
        .where('classApplying', '==', selectedClass)
        .where('session', '==', selectedSession)
        .get();

      if (snapshot.empty) {
        snapshot = await db.collection('admissions')
          .where('class', '==', selectedClass)
          .where('session', '==', selectedSession)
          .get();
      }

      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="4" class="no-students-msg">
          <i class="fas fa-users"></i>
          No students found in <strong>${selectedClass}</strong> (${selectedSession}).<br>
          Please add admissions first.
        </td></tr>`;
        students = [];
        attendanceData = {};
        updateSummary();
        return;
      }

      students = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        students.push({
          id: doc.id,
          roll: data.rollNumber || data.rollNo || parseInt(doc.id.slice(-3)) || 0,
          name: data.studentName || data.name || 'Unknown',
          class: data.classApplying || data.class || selectedClass
        });
      });

      students.sort((a, b) => a.roll - b.roll);

      attendanceData = {};
      students.forEach(s => {
        attendanceData[s.roll] = { status: 'present', remark: '' };
      });

      await loadExistingAttendance();
      renderTable();
      await checkAttendanceDone();
      updateSummary();

    } catch (error) {
      console.error('Error fetching students:', error);
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:#dc3545;">
        <i class="fas fa-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
        Error loading students: ${error.message}
      </td></tr>`;
    }
  }

  // ============================================================
  // LOAD EXISTING ATTENDANCE
  // ============================================================
  async function loadExistingAttendance() {
    try {
      const selectedSession = sessionSelect.value;
      const selectedClass = classSelect.value;
      const today = getTodayDate();

      if (!selectedSession || !selectedClass || students.length === 0) return;

      for (const student of students) {
        const docRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('students')
          .doc(student.name)
          .collection('attendance')
          .doc(today);

        const docSnap = await docRef.get();
        if (docSnap.exists) {
          const data = docSnap.data();
          attendanceData[student.roll] = {
            status: data.status || 'present',
            remark: data.remark || ''
          };
        }
      }
    } catch (error) {
      console.warn('Could not load existing attendance:', error);
    }
  }

  // ============================================================
  // RENDER TABLE - No Holiday option
  // ============================================================
  function renderTable() {
    if (students.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="no-students-msg">
        <i class="fas fa-users"></i>
        No students found.
      </td></tr>`;
      return;
    }

    let html = '';
    students.forEach((s) => {
      const rec = attendanceData[s.roll] || { status: 'present', remark: '' };
      const status = rec.status || 'present';
      const remark = rec.remark || '';

      html += `<tr>
        <td>
          <div class="student-name" data-roll="${s.roll}" data-name="${s.name}">
            <i class="fas fa-user-graduate"></i> ${s.name}
          </div>
        </td>
        <td><span class="roll-badge">${s.roll}</span></td>
        <td>
          <div class="attendance-actions">
            <label class="present-option"><input type="radio" name="status_${s.roll}" value="present" ${status==='present'?'checked':''}> P</label>
            <label class="absent-option"><input type="radio" name="status_${s.roll}" value="absent" ${status==='absent'?'checked':''}> A</label>
            <label class="leave-option"><input type="radio" name="status_${s.roll}" value="leave" ${status==='leave'?'checked':''}> L</label>
          </div>
        </td>
        <td>
          <input class="remark-input" type="text" placeholder="remark" value="${remark}" data-roll="${s.roll}">
        </td>
      </tr>`;
    });
    tbody.innerHTML = html;

    document.querySelectorAll('#attendanceTable tbody tr').forEach(row => {
      const nameDiv = row.querySelector('.student-name');
      if (!nameDiv) return;
      const roll = parseInt(nameDiv.dataset.roll);

      const radios = row.querySelectorAll(`input[name="status_${roll}"]`);
      radios.forEach(r => {
        r.addEventListener('change', function() {
          if (this.checked) {
            attendanceData[roll] = attendanceData[roll] || {};
            attendanceData[roll].status = this.value;
            updateSummary();
          }
        });
      });

      const remarkInput = row.querySelector('.remark-input');
      if (remarkInput) {
        remarkInput.addEventListener('input', function() {
          const r = parseInt(this.dataset.roll);
          attendanceData[r] = attendanceData[r] || {};
          attendanceData[r].remark = this.value;
        });
      }

      nameDiv.addEventListener('click', function() {
        const roll = parseInt(this.dataset.roll);
        const name = this.dataset.name;
        generateIndividualReport(roll, name);
      });
    });

    updateSummary();
  }

  // ============================================================
  // INDIVIDUAL REPORT
  // ============================================================
  function generateIndividualReport(roll, name) {
    const rec = attendanceData[roll] || { status: 'present', remark: '' };
    const dateStr = formatDateDisplay(currentDate);
    const classVal = classSelect.value;
    const session = sessionSelect.value;

    const content = `📋 INDIVIDUAL ATTENDANCE REPORT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🏫 Quest Coaching Centre
👤 Student: ${name}
🎯 Roll No: ${roll}
📚 Class: ${classVal}
📆 Session: ${session}
📅 Date: ${dateStr}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
✅ Status: ${rec.status.toUpperCase()}
📝 Remark: ${rec.remark || '—'}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📅 Report generated: ${new Date().toLocaleString()}
`;

    downloadAsPDF(content, `${name}_${roll}_attendance.pdf`);
    showToast(`📥 ${name}'s report downloaded!`);
  }

  // ============================================================
  // PDF DOWNLOAD HELPER (A4 Size)
  // ============================================================
  function downloadAsPDF(content, filename) {
    const blob = new Blob([content], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ============================================================
  // SAVE ATTENDANCE
  // ============================================================
  async function saveAttendance() {
    if (isSaving) return;
    if (students.length === 0) {
      showToast('No students to save!', true);
      return;
    }

    const selectedSession = sessionSelect.value;
    const selectedClass = classSelect.value;
    const today = getTodayDate();

    if (!selectedSession || !selectedClass) {
      showToast('Please select Session and Class!', true);
      return;
    }

    isSaving = true;
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
      const batch = db.batch();

      // 🔥 Save Holiday if checked
      if (classHolidayCheck.checked) {
        const reason = holidayReason.value.trim() || 'Holiday';
        const holidayDocRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('holidays')
          .doc(today);
        
        batch.set(holidayDocRef, {
          reason: reason,
          date: today,
          session: selectedSession,
          class: selectedClass,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        await batch.commit();
        showToast(`🎉 Holiday saved: ${reason}`);
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Attendance';
        return;
      }

      // Save each student's attendance
      let savedCount = 0;
      for (const student of students) {
        const rec = attendanceData[student.roll] || { status: 'present', remark: '' };
        
        const docRef = db.collection('attendance')
          .doc(selectedSession)
          .collection('classes')
          .doc(selectedClass)
          .collection('students')
          .doc(student.name)
          .collection('attendance')
          .doc(today);

        batch.set(docRef, {
          status: rec.status || 'present',
          remark: rec.remark || '',
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          roll: student.roll,
          date: today,
          session: selectedSession,
          class: selectedClass
        });
        savedCount++;
      }

      await batch.commit();
      showToast(`✅ Attendance saved for ${savedCount} students!`);
      
      // Check if attendance is now complete
      await checkAttendanceDone();
      updateSummary();

    } catch (error) {
      console.error('Error saving attendance:', error);
      showToast('❌ Error saving attendance: ' + error.message, true);
    } finally {
      isSaving = false;
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Attendance';
    }
  }

  // ============================================================
  // MONTHLY REPORT (Alert)
  // ============================================================
  document.getElementById('monthlyReportBtn').addEventListener('click', function() {
    if (students.length === 0) {
      showToast('No students to show report!', true);
      return;
    }
    const monthName = new Date().toLocaleString('default', { month: 'long' });
    const year = new Date().getFullYear();
    const classVal = classSelect.value;
    const session = sessionSelect.value;
    
    let report = `📅 MONTHLY ATTENDANCE - ${monthName} ${year}\n`;
    report += `🏫 Class: ${classVal} | Session: ${session}\n`;
    report += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    
    let present = 0, absent = 0, leave = 0;
    students.forEach(s => {
      const rec = attendanceData[s.roll] || { status: 'present', remark: '' };
      report += `${s.name} (${s.roll}) → ${rec.status.toUpperCase()}`;
      if (rec.remark) report += ` | ${rec.remark}`;
      report += '\n';
      if (rec.status === 'present') present++;
      else if (rec.status === 'absent') absent++;
      else if (rec.status === 'leave') leave++;
    });
    report += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
    report += `📊 Summary: P=${present} | A=${absent} | L=${leave} | Total=${students.length}`;
    
    alert(report);
  });

  // ============================================================
  // INIT
  // ============================================================
  async function init() {
    updateDateDisplay();
    sessionSelect.value = '2026-27';
    await fetchStudents();
  }

  // ============================================================
  // EVENT LISTENERS
  // ============================================================
  classSelect.addEventListener('change', function() {
    if (!classHolidayCheck.checked) fetchStudents();
  });

  sessionSelect.addEventListener('change', function() {
    if (!classHolidayCheck.checked) fetchStudents();
  });

  classHolidayCheck.addEventListener('change', handleClassHoliday);

  holidayReason.addEventListener('input', function() {
    const reason = this.value.trim() || 'Holiday';
    holidayReasonDisplay.textContent = reason.toUpperCase();
  });

  saveBtn.addEventListener('click', saveAttendance);

  refreshBtn.addEventListener('click', function() {
    if (!classHolidayCheck.checked) fetchStudents();
    showToast('🔄 Refreshed!');
  });

  setInterval(() => {
    updateDateDisplay();
  }, 60000);

  auth.onAuthStateChanged((user) => {
    if (!user) {
      showToast('⚠️ Please login from main page!', true);
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 2000);
      return;
    }
    init();
  });

  console.log('✅ Attendance System Loaded!');
  console.log('📌 Features: Scrollable table | P/A/L colors | Attendance Done check | Holiday save with reason | PDF A4');
</script>
</body>
</html>
