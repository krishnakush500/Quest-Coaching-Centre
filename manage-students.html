<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📋 Quest Coaching · Manage Students</title>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body { background: #f0f4fa; padding: 16px 12px 32px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header-bar {
            background: white;
            border-radius: 40px;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 8px 18px rgba(0,20,40,0.08);
        }
        .back-btn {
            background: #e8f0fe;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #1b4f9b;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .download-pdf-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .download-pdf-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        
        .filter-card {
            background: white;
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 18px rgba(0,20,40,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        .filter-group { flex: 1; min-width: 150px; }
        .filter-group label { font-size: 0.7rem; font-weight: 600; color: #64748b; display: block; margin-bottom: 5px; }
        .filter-group select, .filter-group input { width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 16px; background: white; }
        .search-btn { background: #1b4f9b; color: white; border: none; padding: 10px 25px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        
        .students-card { background: white; border-radius: 32px; padding: 20px; overflow-x: auto; box-shadow: 0 8px 18px rgba(0,20,40,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 14px 10px; text-align: left; font-size: 0.8rem; font-weight: 700; color: #1e3a5f; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; vertical-align: middle; }
        .student-photo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .view-btn, .edit-btn, .delete-btn { padding: 6px 12px; border: none; border-radius: 30px; cursor: pointer; font-size: 0.7rem; font-weight: 600; }
        .view-btn { background: #1b4f9b; color: white; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #dc2626; color: white; }
        .badge { padding: 4px 10px; border-radius: 30px; font-size: 0.7rem; }
        .badge.male { background: #dbeafe; color: #1e40af; }
        .badge.female { background: #fce7f3; color: #be185d; }
        .loading { text-align: center; padding: 40px; color: #64748b; }
        
        .auth-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10000;
        }
        .auth-loading .spinner { width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #1b4f9b; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .main-content { display: none; }
        
        @media (max-width: 700px) {
            .filter-card { flex-direction: column; }
            .action-buttons { flex-direction: column; }
            td, th { font-size: 0.7rem; padding: 8px 5px; }
            .header-bar { flex-direction: column; gap: 10px; }
            .back-btn, .download-pdf-btn { width: 100%; justify-content: center; }
        }
        /* PDF hidden helper */
        .pdf-helper { position: absolute; left: -9999px; top: -9999px; width: 1100px; background: white; z-index: -1; }
    </style>
</head>
<body>
    <div id="authLoading" class="auth-loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #1b4f9b; font-weight: 600;">Verifying access...</p>
    </div>

    <div id="mainContent" class="main-content">
    <div class="container">
        <div class="header-bar">
            <div class="logo-area">
                <h1>📋 Manage Students</h1>
                <p>Quest Coaching Centre | Under MR. RAVI SIR</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="download-pdf-btn" id="downloadPdfBtn">
                    <i class="fas fa-file-pdf"></i> Download PDF Report
                </button>
                <button class="back-btn" onclick="window.location.href='student-dashboard.html'">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </button>
            </div>
        </div>
        
        <div class="filter-card">
            <div class="filter-group">
                <label>🔍 Search by Name / Admission No / Mobile</label>
                <input type="text" id="searchInput" placeholder="Type to search...">
            </div>
            <div class="filter-group">
                <label>📚 Filter by Class</label>
                <select id="classFilter">
                    <option value="All">All Classes</option>
                    <option>6th</option><option>7th</option><option>8th</option>
                    <option>9th</option><option>10th</option>
                    <option>11th (Science)</option><option>11th (Commerce)</option>
                    <option>11th (Arts)</option>
                    <option>12th (Science)</option><option>12th (Commerce)</option>
                    <option>12th (Arts)</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📆 Session</label>
                <select id="sessionFilter">
                    <option value="All">All Sessions</option>
                    <option>2024-25</option><option>2025-26</option>
                    <option selected>2026-27</option>
                </select>
            </div>
            <button class="search-btn" onclick="filterStudents()"><i class="fas fa-search"></i> Search</button>
        </div>
        
        <div class="students-card">
            <table>
                <thead>
                    <tr><th>Photo</th><th>Admission No</th><th>Student Name</th><th>Roll No</th><th>Father Name</th><th>Class</th><th>Gender</th><th>Mobile</th><th>Actions</th></tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="9" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading students...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    </div>

    <script>
    const firebaseConfig = {
        apiKey: "AIzaSyBoAqrgPwwM7GNyURqXrJEYWPihKKR8VGg",
        authDomain: "quest-coaching.firebaseapp.com",
        projectId: "quest-coaching",
        storageBucket: "quest-coaching.firebasestorage.app"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const admissionsCollection = db.collection('admissions');

    const authLoading = document.getElementById('authLoading');
    const mainContent = document.getElementById('mainContent');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');

    auth.onAuthStateChanged((user) => {
        if (!user) {
            Swal.fire({
                title: 'Access Denied!',
                text: 'Please login from main page first!',
                icon: 'error',
                confirmButtonColor: '#1b4f9b',
                confirmButtonText: 'Go to Login'
            }).then(() => {
                window.location.href = 'index.html';
            });
            return;
        }
        authLoading.style.display = 'none';
        mainContent.style.display = 'block';
        
        const logoutBtn = document.createElement('button');
        logoutBtn.innerHTML = '🚪 Logout';
        logoutBtn.style.cssText = 'position:fixed; bottom:20px; right:20px; padding:10px 20px; background:#dc3545; color:white; border:none; border-radius:50px; cursor:pointer; z-index:9999; font-weight:bold; font-size:14px;';
        logoutBtn.onclick = async () => {
            await auth.signOut();
            window.location.href = 'index.html';
        };
        document.body.appendChild(logoutBtn);
        
        loadStudents();
    });
    
    let allStudents = [];
    
    async function loadStudents() {
        try {
            const snapshot = await admissionsCollection.get();
            allStudents = [];
            snapshot.forEach(doc => {
                allStudents.push({ id: doc.id, ...doc.data() });
            });
            allStudents.sort((a, b) => {
                const dateA = a.admissionDate ? new Date(a.admissionDate) : new Date(0);
                const dateB = b.admissionDate ? new Date(b.admissionDate) : new Date(0);
                return dateB - dateA;
            });
            filterStudents();
        } catch (error) {
            document.getElementById('studentsTableBody').innerHTML = '<tr><td colspan="9" class="loading">❌ Error loading data</td></tr>';
        }
    }
    
    function filterStudents() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const classFilter = document.getElementById('classFilter').value;
        const sessionFilter = document.getElementById('sessionFilter').value;
        
        let filtered = [...allStudents];
        
        if (searchTerm) {
            filtered = filtered.filter(s => 
                (s.studentName && s.studentName.toLowerCase().includes(searchTerm)) ||
                (s.admissionNo && s.admissionNo.toLowerCase().includes(searchTerm)) ||
                (s.rollNumber && s.rollNumber.toString().toLowerCase().includes(searchTerm)) ||
                (s.parentMobile && s.parentMobile.includes(searchTerm))
            );
        }
        if (classFilter !== 'All') {
            filtered = filtered.filter(s => s.classApplying === classFilter);
        }
        if (sessionFilter !== 'All') {
            filtered = filtered.filter(s => s.session === sessionFilter);
        }
        
        displayStudents(filtered);
    }
    
    function displayStudents(students) {
        const tbody = document.getElementById('studentsTableBody');
        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="loading">No students found</td></tr>';
            return;
        }
        
        let html = '';
        students.forEach(student => {
            const genderClass = student.gender === 'Male' ? 'male' : 'female';
            const genderText = student.gender === 'Male' ? 'Male' : 'Female';
            
            let photoHtml = '';
            if (student.photoUrl) {
                photoHtml = `<img src="${student.photoUrl}" class="student-photo" onerror="this.src='https://via.placeholder.com/45'">`;
            } else {
                photoHtml = `<div class="student-photo" style="display:flex;align-items:center;justify-content:center;"><i class="fas fa-user" style="color:#64748b;"></i></div>`;
            }
            
            html += `<tr>
                <td>${photoHtml}</td>
                <td>${student.admissionNo || '-'}</td>
                <td><strong>${student.studentName || '-'}</strong></td>
                <td>${student.rollNumber || '-'}</td>
                <td>${student.fatherName || '-'}</td>
                <td>${student.classApplying || '-'}</td>
                <td><span class="badge ${genderClass}">${genderText}</span></td>
                <td>${student.parentMobile || '-'}</td>
                <td class="action-buttons">
                    <button class="view-btn" onclick="viewStudent('${student.id}')"><i class="fas fa-eye"></i> View</button>
                    <button class="edit-btn" onclick="editStudent('${student.id}')"><i class="fas fa-edit"></i> Edit</button>
                    <button class="delete-btn" onclick="deleteStudent('${student.id}')"><i class="fas fa-trash"></i> Delete</button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }
    
    window.viewStudent = function(studentId) {
        window.location.href = `new-admission.html?mode=view&id=${studentId}`;
    };
    
    window.editStudent = function(studentId) {
        window.location.href = `new-admission.html?mode=edit&id=${studentId}`;
    };
    
    window.deleteStudent = function(studentId) {
        const student = allStudents.find(s => s.id === studentId);
        if (!student) return;
        
        Swal.fire({
            title: 'Are you sure?',
            text: `Delete "${student.studentName}"? This cannot be undone!`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            confirmButtonText: 'Yes, delete'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await admissionsCollection.doc(studentId).delete();
                Swal.fire('Deleted!', 'Student has been removed.', 'success');
                loadStudents();
            }
        });
    };
    
    // =============== MULTI-PAGE PDF GENERATOR (A4, ALL STUDENTS VISIBLE) ===============
    async function generateMultiPagePDF(studentsData, filtersInfo) {
        const { className, sessionName, currentDate, totalStudents, totalBoys, totalGirls, searchApplied } = filtersInfo;
        
        // Helper: Build a complete page content (returns a div element with report layout)
        function buildReportPageContent(studentsSubset, pageNumber = 1, totalPages = 1, startIndex = 0) {
            const pageDiv = document.createElement('div');
            pageDiv.style.width = '1000px';
            pageDiv.style.padding = '20px 25px 25px 25px';
            pageDiv.style.backgroundColor = 'white';
            pageDiv.style.fontFamily = "'Segoe UI', Roboto, sans-serif";
            pageDiv.style.boxSizing = 'border-box';
            
            // Header section
            let headerHtml = `
                <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #1b4f9b; padding-bottom: 12px;">
                    <div style="font-size: 22px; font-weight: 800; color: #1b4f9b;">QUEST COACHING CENTRE</div>
                    <div style="font-size: 10px; color: #4a5568; margin: 4px 0;">Block More, Gopalganj, Bihar - 841428 | Ph: +91 9708442525</div>
                    <div style="font-size: 10px; color: #4a5568;">Under the guidance of MR. RAVI SIR</div>
                </div>
                <div style="font-size: 17px; font-weight: 700; color: #113a5e; text-align: center; margin: 10px 0 5px;">📊 STUDENTS REPORT</div>
                <div style="text-align: center; font-size: 10px; color: #64748b; margin-bottom: 15px;">
                    Session: ${sessionName} | Class: ${className} | Date: ${currentDate} | Total: ${totalStudents}
                    ${searchApplied ? ' | 🔍 Filtered View' : ''}
                </div>
                ${pageNumber === 1 ? `
                <div style="background: linear-gradient(135deg, #1b4f9b, #2563eb); color: white; padding: 12px 18px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-around; flex-wrap: wrap;">
                    <div style="text-align: center;"><div style="font-size: 11px; opacity: 0.9;">👨‍🎓 Total Students</div><div style="font-size: 20px; font-weight: 800;">${totalStudents}</div></div>
                    <div style="text-align: center;"><div style="font-size: 11px; opacity: 0.9;">👦 Boys</div><div style="font-size: 20px; font-weight: 800;">${totalBoys}</div></div>
                    <div style="text-align: center;"><div style="font-size: 11px; opacity: 0.9;">👧 Girls</div><div style="font-size: 20px; font-weight: 800;">${totalGirls}</div></div>
                </div>
                ` : `<div style="height: 5px;"></div>`}
                <div style="font-size: 10px; text-align: right; margin-bottom: 8px; color: #334155;">Page ${pageNumber} of ${totalPages}</div>
            `;
            
            // Build table rows
            let tableRows = '';
            for (let i = 0; i < studentsSubset.length; i++) {
                const st = studentsSubset[i];
                const serial = startIndex + i + 1;
                const photoCell = st.photoUrl ? 
                    `<img src="${st.photoUrl}" style="width:38px; height:38px; border-radius:50%; object-fit:cover;" onerror="this.src='https://via.placeholder.com/38'">` : 
                    `<div style="width:38px; height:38px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center;"><span style="font-size:12px;">📷</span></div>`;
                
                tableRows += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 8px 6px; text-align:center; font-size:10px;">${serial}</td>
                        <td style="padding: 8px 6px; text-align:center;">${photoCell}</td>
                        <td style="padding: 8px 6px; font-size:10px;">${st.admissionNo || '-'}</td>
                        <td style="padding: 8px 6px; font-size:10px; font-weight:600;">${st.studentName || '-'}</td>
                        <td style="padding: 8px 6px; font-size:10px;">${st.rollNumber || '-'}</td>
                        <td style="padding: 8px 6px; font-size:10px;">${st.fatherName || '-'}</td>
                        <td style="padding: 8px 6px; font-size:10px;">${st.classApplying || '-'}</td>
                        <td style="padding: 8px 6px; font-size:10px;">${st.gender || '-'}</td>
                        <td style="padding: 8px 6px; font-size:10px;">${st.parentMobile || '-'}</td>
                    </tr>
                `;
            }
            
            const tableHtml = `
                <table style="width:100%; border-collapse:collapse; font-size:10px; margin-top:5px;">
                    <thead>
                        <tr style="background:#1b4f9b; color:white; font-size:9px;">
                            <th style="padding: 8px 4px; text-align:center;">#</th>
                            <th style="padding: 8px 4px; text-align:center;">Photo</th>
                            <th style="padding: 8px 4px;">Adm No</th>
                            <th style="padding: 8px 4px;">Student Name</th>
                            <th style="padding: 8px 4px;">Roll No</th>
                            <th style="padding: 8px 4px;">Father Name</th>
                            <th style="padding: 8px 4px;">Class</th>
                            <th style="padding: 8px 4px;">Gender</th>
                            <th style="padding: 8px 4px;">Mobile</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
            `;
            
            const footerHtml = `
                <div style="display: flex; justify-content: space-between; margin-top: 25px; margin-bottom: 10px;">
                    <div><div style="border-top: 1px solid #94a3b8; width: 180px; margin-top: 25px;"></div><div style="font-size: 9px; text-align: center; margin-top: 4px;">Authorized Signatory</div></div>
                    <div><div style="border-top: 1px solid #94a3b8; width: 180px; margin-top: 25px;"></div><div style="font-size: 9px; text-align: center; margin-top: 4px;">Principal / Director</div></div>
                </div>
                <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 8px; color: #64748b;">Generated by Quest Coaching Management System</div>
            `;
            
            pageDiv.innerHTML = headerHtml + tableHtml + footerHtml;
            return pageDiv;
        }
        
        // Split students into chunks for A4 pages (approx 18-20 rows per page based on content)
        // We'll compute rows per page dynamically: keep around 19 rows for readability on A4
        const ROWS_PER_PAGE = 18; 
        const chunks = [];
        for (let i = 0; i < studentsData.length; i += ROWS_PER_PAGE) {
            chunks.push(studentsData.slice(i, i + ROWS_PER_PAGE));
        }
        if (chunks.length === 0) {
            Swal.fire('No Data', 'No students available for PDF', 'info');
            return null;
        }
        
        // Create temporary container to render pages sequentially
        const tempContainer = document.createElement('div');
        tempContainer.style.position = 'absolute';
        tempContainer.style.left = '-9999px';
        tempContainer.style.top = '-9999px';
        tempContainer.style.width = '1100px';
        document.body.appendChild(tempContainer);
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        let isFirstPage = true;
        
        try {
            for (let idx = 0; idx < chunks.length; idx++) {
                const chunk = chunks[idx];
                const startSerial = idx * ROWS_PER_PAGE;
                const pageDiv = buildReportPageContent(chunk, idx + 1, chunks.length, startSerial);
                tempContainer.innerHTML = '';
                tempContainer.appendChild(pageDiv);
                
                // Wait for images to render & load properly
                await new Promise(resolve => setTimeout(resolve, 800));
                
                // Capture with html2canvas high quality
                const canvas = await html2canvas(pageDiv, {
                    scale: 2.5,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });
                const imgData = canvas.toDataURL('image/png');
                const imgWidth = 190; // mm (A4 width with margins)
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                if (!isFirstPage) {
                    pdf.addPage();
                }
                pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                isFirstPage = false;
            }
            return pdf;
        } catch (err) {
            console.error("PDF chunk error", err);
            throw err;
        } finally {
            document.body.removeChild(tempContainer);
        }
    }
    
    // Modified PDF download handler: supports ALL students with multi-page A4
    downloadPdfBtn.addEventListener('click', async () => {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const classFilter = document.getElementById('classFilter').value;
        const sessionFilter = document.getElementById('sessionFilter').value;
        
        let filtered = [...allStudents];
        
        if (searchTerm) {
            filtered = filtered.filter(s => 
                (s.studentName && s.studentName.toLowerCase().includes(searchTerm)) ||
                (s.admissionNo && s.admissionNo.toLowerCase().includes(searchTerm)) ||
                (s.rollNumber && s.rollNumber.toString().toLowerCase().includes(searchTerm)) ||
                (s.parentMobile && s.parentMobile.includes(searchTerm))
            );
        }
        if (classFilter !== 'All') {
            filtered = filtered.filter(s => s.classApplying === classFilter);
        }
        if (sessionFilter !== 'All') {
            filtered = filtered.filter(s => s.session === sessionFilter);
        }
        
        if (filtered.length === 0) {
            Swal.fire('No Data', 'No students found to download', 'info');
            return;
        }
        
        Swal.fire({
            title: 'Generating Multi-Page PDF...',
            text: `Preparing report for ${filtered.length} students. Please wait.`,
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });
        
        try {
            const totalStudents = filtered.length;
            const totalBoys = filtered.filter(s => s.gender === 'Male').length;
            const totalGirls = filtered.filter(s => s.gender === 'Female').length;
            const currentDate = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            const className = classFilter === 'All' ? 'All Classes' : classFilter;
            const sessionName = sessionFilter === 'All' ? 'All Sessions' : sessionFilter;
            const searchApplied = searchTerm !== '' || classFilter !== 'All' || sessionFilter !== 'All';
            
            // Ensure all student photo URLs are accessible (cors may affect but html2canvas handles)
            // Prepare data enriched
            const enrichedStudents = filtered.map(s => ({
                ...s,
                photoUrl: s.photoUrl && s.photoUrl.trim() !== '' ? s.photoUrl : null,
                admissionNo: s.admissionNo || '—',
                studentName: s.studentName || '—',
                rollNumber: s.rollNumber || '—',
                fatherName: s.fatherName || '—',
                classApplying: s.classApplying || '—',
                gender: s.gender || '—',
                parentMobile: s.parentMobile || '—'
            }));
            
            const pdf = await generateMultiPagePDF(enrichedStudents, {
                className, sessionName, currentDate, totalStudents, totalBoys, totalGirls, searchApplied
            });
            
            if (!pdf) {
                Swal.close();
                return;
            }
            
            pdf.save(`Quest_Students_FullReport_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.pdf`);
            Swal.close();
            Swal.fire({
                icon: 'success',
                title: 'PDF Ready!',
                text: `Report with ${totalStudents} student(s) generated across multiple pages.`,
                timer: 2500,
                showConfirmButton: false
            });
        } catch (error) {
            Swal.close();
            console.error('PDF Generation Error:', error);
            Swal.fire('Error!', 'Failed to generate multi-page PDF: ' + error.message, 'error');
        }
    });
    
    document.getElementById('searchInput').addEventListener('keyup', filterStudents);
    document.getElementById('classFilter').addEventListener('change', filterStudents);
    document.getElementById('sessionFilter').addEventListener('change', filterStudents);
    
    loadStudents();
    </script>
</body>
</html>
